server:
  port: 8761

spring:
  application:
    name: eureka-server
  boot:
    admin:
      contextPath: /admin-dashboard
      client:
        discovery:
          enabled: true
  cloud:
    config:
       server:
         prefix: config

eureka:
  dashboard:
    path: /eureka-dashboard
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
  cloud:
    inetutils:
      preferred-networks[0]: 172.17
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:${server.port}/eureka/

magic-api:
  web: /magic-api/web
  show-sql: true #配置打印SQL
  sql-column-case: camel
  persistence-response-body: false
  cluster:
    channel: magic-api:notify:channel
  resource:
    type: file  # 配置接口存储方式，file | database | git
    location: /Users/xiongxiao/Workspace/Idea/codes/fw-plus/fw-plus-boot/fw-plus-boot-samples/fw-plus-magicapi-spring-boot-starter-sample/src/main/resources
  prefix: /magic-api  # 前缀
  backup: #备份相关配置
    enable: false #是否启用
  page:
    page: current
    size: size
  cache:
    enable: true  #开启缓存，默认是不开启的
    ttl: 3600000 #有效期1小时，默认-1 即永不过期
  response-code:
    success: 200 #执行成功的code值
    invalid: 400 #参数验证未通过的code值
    exception: 500 #执行出现异常的code值
  crud: # CRUD相关配置
    logic-delete-column: is_del #逻辑删除列
    logic-delete-value: 1 #逻辑删除值
  plugin:
    druid:
      aop-patterns:  /*
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: 123456




management:
  management:
    endpoint:
      health:
        show-details: ALWAYS
      shutdown:
        enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
