server:
  port: 9081


spring:
  application:
      name: service-sample
      version: 1.0.0
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  profiles:
    active: test

eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/
      fetch-registery: true
      register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
  cloud:
    inetutils:
      preferred-networks[0]: 172.17



management:
  endpoint:
    health:
      show-details: ALWAYS
    shutdown:
      enabled: true
    logfile:
      external-file1: ${logDir}/${spring.application.name}-${spring.profiles.active}.log
  endpoints:
    web:
      exposure:
        include: '*'


fw:
  plus:
    cloud:
      gateway:
        enabled: true
        swagger:
          aggregate: true
          version: 3.0.3
        excludeUrls:
          - /doc.html
          - /swagger-ui.html
          - /swagger-ui/**
          - /webjars/**
        httpclient:
          connectTimeout: 500000
          readTimeout: 300000
        default-filters:
          - name: RemoveRequestHeader
            args:
              name: accesstoken, __FWX_USER__
          - name: TransmitUserInfo
            args:
              cipherAlgorithm: AES/ECB/PKCS5Padding
              cipherKey: xLgZwda2l0oNEumnXPvepg
          - name: RemoveResponseHeader
            args:
              name: _X_FW_REST_CODE, _X_FW_REST_MSG
          - name: DecodeRestResult
            args:
              errorTranslation:
                 - originalCode: 1
                   newCode: 1
                   newMsg: 内部异常
                   rewriteHeader: true
        routes:
          - id: mate
            uri: svc://fw-plus-mate
            predicates:
              - name: Path
                args:
                  patterns:
                    - /mate/**
            filters:
              - name: StripPrefix
                args:
                  parts: 1


magic-api:
  web: /magic-api/web
  show-sql: true #配置打印SQL
  sql-column-case: camel
  persistence-response-body: false
  cluster:
    channel: magic-api:notify:channel
  resource:
    type: file  # 配置接口存储方式，file | database | git
    location: /Users/xiongxiao/Workspace/Idea/codes/fw-plus/fw-plus-boot/fw-plus-boot-samples/fw-plus-magicapi-spring-boot-starter-sample/src/main/resources
  prefix: /magic-api  # 前缀
  backup: #备份相关配置
    enable: false #是否启用
  page:
    page: current
    size: size
  cache:
    enable: true  #开启缓存，默认是不开启的
    ttl: 3600000 #有效期1小时，默认-1 即永不过期
  response-code:
    success: 200 #执行成功的code值
    invalid: 400 #参数验证未通过的code值
    exception: 500 #执行出现异常的code值
  crud: # CRUD相关配置
    logic-delete-column: is_del #逻辑删除列
    logic-delete-value: 1 #逻辑删除值
  plugin:
    druid:
      aop-patterns:  /*
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: 123456
