server:
  port: 7080


spring:
  application:
      name: gateway-sample
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848


management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
    health:
      show-details: always


fw:
  plus:
    cloud:
      gateway:
        enabled: true
        swagger:
          aggregate: true
          version: 3.0.3
        excludeUrls:
          - /doc.html
          - /swagger-ui.html
          - /swagger-ui/**
          - /webjars/**
        httpclient:
          connectTimeout: 500000
          readTimeout: 300000
        default-filters:
          - name: RemoveRequestHeader
            args:
              name: accesstoken, __FWX_USER__
          - name: TransmitUserInfo
            args:
              cipherAlgorithm: AES/ECB/PKCS5Padding
              cipherKey: xLgZwda2l0oNEumnXPvepg
          - name: RemoveResponseHeader
            args:
              name: _X_FW_REST_CODE, _X_FW_REST_MSG
          - name: DecodeRestResult
            args:
              errorTranslation:
                 - originalCode: 1
                   newCode: 1
                   newMsg: 内部异常
                   rewriteHeader: true
        routes:
          - id: mate
            uri: svc://fw-plus-mate
            predicates:
              - name: Path
                args:
                  patterns:
                    - /mate/**
            filters:
              - name: StripPrefix
                args:
                  parts: 1

