<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
	<title id="title">fw-plus 本地构建顺序</title>
	<desc id="desc">依次安装 Core、Boot，再安装 Cloud 或 AI，最后验证 Sample 聚合项目。</desc>
	<rect width="1200" height="300" rx="6" fill="#0B0F14"/>
	<path d="M56 74H1144" stroke="#25303A" stroke-width="1"/>
	<text x="56" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="30" font-weight="700" fill="#F4F7F5">从源码到样例验证</text>
	<text x="1144" y="47" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8A96A3">LOCAL MAVEN REPOSITORY</text>

	<path d="M122 152H1072" stroke="#4B5966" stroke-width="2"/>
	<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
		<g transform="translate(122 152)">
			<circle r="25" fill="#EF4444"/>
			<text x="0" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#0B0F14">01</text>
			<text x="0" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#F4F7F5">CORE</text>
			<text x="0" y="88" text-anchor="middle" font-size="16" fill="#8A96A3">install</text>
		</g>
		<g transform="translate(396 152)">
			<circle r="25" fill="#EF4444"/>
			<text x="0" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#0B0F14">02</text>
			<text x="0" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#F4F7F5">BOOT</text>
			<text x="0" y="88" text-anchor="middle" font-size="16" fill="#8A96A3">install</text>
		</g>
		<g transform="translate(690 152)">
			<circle r="25" fill="#22C7A9"/>
			<text x="0" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#0B0F14">03</text>
			<text x="0" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#F4F7F5">CLOUD / AI</text>
			<text x="0" y="88" text-anchor="middle" font-size="16" fill="#8A96A3">install as needed</text>
		</g>
		<g transform="translate(1072 152)">
			<circle r="25" fill="#F4F7F5"/>
			<text x="0" y="7" text-anchor="middle" font-size="18" font-weight="700" fill="#0B0F14">04</text>
			<text x="0" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#F4F7F5">SAMPLE</text>
			<text x="0" y="88" text-anchor="middle" font-size="16" fill="#8A96A3">validate</text>
		</g>
	</g>

	<text x="56" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A96A3">mvn -f fw-plus-sample/pom.xml validate</text>
	<text x="1144" y="276" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A96A3">CLOUD AND AI MAY RUN IN PARALLEL AFTER BOOT</text>
</svg>
