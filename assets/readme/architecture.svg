		<text x="1144" y="56" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8A96A3">BUILD ANCESTRY / MODULE BOUNDARIES</text>
	</g>

	<g fill="none" stroke-linecap="square">
