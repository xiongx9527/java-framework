<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE客户端 - 消息接收器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        
        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #ff5722;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ff5722;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
        }
        
        .main-content {
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        .url-input {
            flex: 1;
            min-width: 200px;
        }
        
        input, button {
            padding: 12px 15px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        input {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            width: 100%;
        }
        
        button {
            background: #ff5722;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        button:hover {
            background: #ff7043;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-disconnect {
            background: #f44336;
        }
        
        .btn-disconnect:hover {
            background: #e53935;
        }
        
        .btn-clear {
            background: #9c27b0;
        }
        
        .btn-clear:hover {
            background: #8e24aa;
        }
        
        .status-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .status-box {
            flex: 1;
            min-width: 150px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            text-align: center;
        }
        
        .status-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 5px;
        }
        
        .connected {
            color: #4caf50;
        }
        
        .disconnected {
            color: #f44336;
        }
        
        .message-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .messages {
            height: 400px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .message {
            padding: 10px 15px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.3s ease;
        }
        
        .message.system {
            background: rgba(33, 150, 243, 0.3);
            font-style: italic;
        }
        
        .message.error {
            background: rgba(244, 67, 54, 0.3);
        }
        
        .message-time {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        footer {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        @media (max-width: 600px) {
            .control-panel, .status-panel {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SSE 消息接收器</h1>
            <p class="subtitle">Server-Sent Events 客户端 - 仅接收模式</p>
        </header>
        
        <div class="main-content">
            <div class="control-panel">
                <div class="url-input">
                    <input type="text" id="serverUrl" placeholder="输入SSE服务器URL" value="http://localhost:3089/magic-api/web/sse/events?clientId=abc&token=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ0ZXN0IiwiaWF0IjoxNzYzMjc2ODE3LCJleHAiOjE3NjMyODQwMTd9.1l_Y2sVG-XSiWYNB2YTg_AxLukES1FdEaJA8tig1dsQ">
                </div>
                <button id="connectBtn">连接服务器</button>
                <button id="disconnectBtn" class="btn-disconnect" disabled>断开连接</button>
                <button id="clearBtn" class="btn-clear">清理日志</button>
            </div>
            
            <div class="status-panel">
                <div class="status-box">
                    <div>连接状态</div>
                    <div id="connectionStatus" class="status-value disconnected">未连接</div>
                </div>
                <div class="status-box">
                    <div>接收消息数</div>
                    <div id="messageCount" class="status-value">0</div>
                </div>
                <div class="status-box">
                    <div>最后接收时间</div>
                    <div id="lastMessageTime" class="status-value">--:--:--</div>
                </div>
            </div>
            
            <div class="message-panel">
                <div class="message-header">
                    <h3>消息日志</h3>
                    <div class="message-stats">已显示 <span id="visibleMessageCount">0</span> 条消息</div>
                </div>
                
                <div class="messages" id="messagesContainer">
                    <div class="empty-state">
                        <h3>等待连接服务器...</h3>
                        <p>连接后，服务器推送的消息将显示在这里</p>
                    </div>
                </div>
            </div>
        </div>
        
        <footer>
            <p>SSE消息接收器 &copy; 2023 | 使用原生JavaScript实现</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const serverUrlInput = document.getElementById('serverUrl');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const clearBtn = document.getElementById('clearBtn');
            const messagesContainer = document.getElementById('messagesContainer');
            const connectionStatus = document.getElementById('connectionStatus');
            const messageCount = document.getElementById('messageCount');
            const lastMessageTime = document.getElementById('lastMessageTime');
            const visibleMessageCount = document.getElementById('visibleMessageCount');
            
            let eventSource = null;
            let messageCounter = 0;
            let visibleMessages = 0;
            
            // 检查消息容器是否为空状态
            function isEmptyState() {
                return messagesContainer.querySelector('.empty-state') !== null;
            }
            
            // 移除空状态
            function removeEmptyState() {
                const emptyState = messagesContainer.querySelector('.empty-state');
                if (emptyState) {
                    messagesContainer.removeChild(emptyState);
                }
            }
            
            // 添加消息到消息容器
            function addMessage(text, type = 'normal') {
                // 如果是第一条消息，移除空状态
                if (isEmptyState()) {
                    removeEmptyState();
                }
                
                const messageElement = document.createElement('div');
                messageElement.className = `message ${type}`;
                
                const now = new Date();
                const timeString = now.toTimeString().split(' ')[0];
                
                messageElement.innerHTML = `
                    <div class="message-time">${timeString}</div>
                    <div>${text}</div>
                `;
                
                messagesContainer.appendChild(messageElement);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                
                // 更新最后消息时间
                lastMessageTime.textContent = timeString;
                
                // 更新可见消息计数
                if (type !== 'system') {
                    visibleMessages++;
                    visibleMessageCount.textContent = visibleMessages;
                }
            }
            
            // 清理日志
            function clearMessages() {
                messagesContainer.innerHTML = '';
                visibleMessages = 0;
                visibleMessageCount.textContent = '0';
                
                // 添加空状态
                messagesContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>消息日志已清理</h3>
                        <p>等待新消息...</p>
                    </div>
                `;
            }
            
            // 连接服务器
            function connect() {
                const url = serverUrlInput.value.trim();
                if (!url) {
                    alert('请输入服务器URL');
                    return;
                }
                
                try {
                    eventSource = new EventSource(url);
                    
                    eventSource.onopen = function() {
                        updateConnectionStatus(true);
                        addMessage('成功连接到服务器', 'system');
                    };
                    
                    eventSource.onmessage = function(event) {
                        messageCounter++;
                        messageCount.textContent = messageCounter;
                        addMessage(`服务器消息: ${event.data}`);
                    };
                    
                    eventSource.onerror = function(event) {
                        updateConnectionStatus(false);
                        addMessage('连接错误或服务器断开', 'error');
                        // 不进行自动重连
                    };
                    
                    // 监听自定义事件
                    eventSource.addEventListener('customEvent', function(event) {
                        messageCounter++;
                        messageCount.textContent = messageCounter;
                        addMessage(`自定义事件: ${event.data}`);
                    });
                    
                } catch (error) {
                    addMessage(`连接失败: ${error.message}`, 'error');
                    updateConnectionStatus(false);
                }
            }
            
            // 断开连接
            function disconnect() {
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                    updateConnectionStatus(false);
                    addMessage('已断开与服务器的连接', 'system');
                }
            }
            
            // 更新连接状态
            function updateConnectionStatus(connected) {
                if (connected) {
                    connectionStatus.textContent = '已连接';
                    connectionStatus.className = 'status-value connected';
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                    serverUrlInput.disabled = true;
                } else {
                    connectionStatus.textContent = '未连接';
                    connectionStatus.className = 'status-value disconnected';
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    serverUrlInput.disabled = false;
                }
            }
            
            // 绑定事件
            connectBtn.addEventListener('click', connect);
            disconnectBtn.addEventListener('click', disconnect);
            clearBtn.addEventListener('click', clearMessages);
            
            // 初始化状态
            updateConnectionStatus(false);
            visibleMessageCount.textContent = '0';
        });
    </script>
</body>
</html>
