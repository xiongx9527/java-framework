<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 客户端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #2c3e50, #4a6491);
            color: white;
            padding: 20px 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        h1 i {
            font-size: 1.8rem;
        }
        
        .subtitle {
            font-size: 1rem;
            opacity: 0.8;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            gap: 20px;
        }
        
        .panel {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .panel h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .connection-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input, select, button {
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 1rem;
        }
        
        input {
            flex: 1;
            min-width: 200px;
        }
        
        select {
            flex: 0.5;
            min-width: 150px;
        }
        
        button {
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.connect {
            background: #2ecc71;
        }
        
        button.connect:hover {
            background: #27ae60;
        }
        
        button.disconnect {
            background: #e74c3c;
        }
        
        button.disconnect:hover {
            background: #c0392b;
        }
        
        button.clear {
            background: #f39c12;
        }
        
        button.clear:hover {
            background: #d35400;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.connecting {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .message-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .message-controls input {
            flex: 1;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 1rem;
            resize: vertical;
            background: #f9f9f9;
        }
        
        .log-container {
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
        }
        
        .log-entry {
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #3498db;
            background: #f8f9fa;
            animation: fadeIn 0.3s ease;
        }
        
        .log-entry.send {
            border-left-color: #2ecc71;
            background: #e8f6ef;
        }
        
        .log-entry.receive {
            border-left-color: #3498db;
            background: #e3f2fd;
        }
        
        .log-entry.error {
            border-left-color: #e74c3c;
            background: #fde8e6;
        }
        
        .log-entry.system {
            border-left-color: #f39c12;
            background: #fef5e7;
        }
        
        .log-time {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-bottom: 5px;
        }
        
        .log-message {
            word-break: break-word;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .connection-info {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .connection-controls {
                flex-direction: column;
            }
            
            input, select, button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔌 WebSocket 客户端</h1>
            <p class="subtitle">与 WebSocket 服务器进行实时通信</p>
        </header>
        
        <div class="main-content">
            <div class="panel">
                <h2>🔗 连接控制</h2>
                <div class="connection-controls">
                    <input type="text" id="serverUrl" placeholder="输入 WebSocket 服务器 URL" value="http://127.0.0.1:3089/magic-api/web/ws/api?clientId=abc&token=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ0ZXN0IiwiaWF0IjoxNzYzMTcyOTgyLCJleHAiOjE3NjMxODAxODJ9.NDEoCKbInDwbUmLI1jWRUeNWNNYrErXqf9hTWv2xt-A">
                    <select id="protocol">
                        <option value="">无子协议</option>
                        <option value="chat">聊天协议</option>
                        <option value="notification">通知协议</option>
                    </select>
                    <button id="connectBtn" class="connect">
                        <span>🔗</span> 连接
                    </button>
                    <button id="disconnectBtn" class="disconnect" disabled>
                        <span>❌</span> 断开
                    </button>
                </div>
                
                <div class="status disconnected" id="connectionStatus">
                    未连接
                </div>
                
                <div class="connection-info">
                    <div id="connectionTime">连接时间: --</div>
                    <div id="messageCount">消息计数: 0</div>
                </div>
            </div>
            
            <div class="panel">
                <h2>📨 消息发送</h2>
                <div class="message-controls">
                    <input type="text" id="messageInput" placeholder="输入要发送的消息" disabled>
                    <button id="sendBtn" disabled>
                        <span>📤</span> 发送
                    </button>
                </div>
                
                <h3>消息类型</h3>
                <div class="button-group">
                    <button id="textMessage" class="connect">文本消息</button>
                    <button id="jsonMessage" class="connect">JSON 消息</button>
                    <button id="pingMessage" class="connect">Ping 消息</button>
                </div>
                
                <h3>自动发送</h3>
                <div class="button-group">
                    <button id="startAutoSend" class="connect">开始自动发送</button>
                    <button id="stopAutoSend" class="disconnect">停止自动发送</button>
                </div>
            </div>
            
            <div class="panel">
                <h2>📊 连接状态</h2>
                <div class="log-container" id="logContainer">
                    <div class="log-entry system">
                        <div class="log-time" id="currentTime">系统就绪，等待连接...</div>
                        <div class="log-message">欢迎使用 WebSocket 客户端</div>
                    </div>
                </div>
                
                <div class="button-group">
                    <button id="clearLogBtn" class="clear">
                        <span>🗑️</span> 清除日志
                    </button>
                    <button id="exportLogBtn" class="connect">
                        <span>📥</span> 导出日志
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const serverUrlInput = document.getElementById('serverUrl');
            const protocolSelect = document.getElementById('protocol');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const connectionStatus = document.getElementById('connectionStatus');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const logContainer = document.getElementById('logContainer');
            const clearLogBtn = document.getElementById('clearLogBtn');
            const exportLogBtn = document.getElementById('exportLogBtn');
            const connectionTime = document.getElementById('connectionTime');
            const messageCount = document.getElementById('messageCount');
            const textMessageBtn = document.getElementById('textMessage');
            const jsonMessageBtn = document.getElementById('jsonMessage');
            const pingMessageBtn = document.getElementById('pingMessage');
            const startAutoSendBtn = document.getElementById('startAutoSend');
            const stopAutoSendBtn = document.getElementById('stopAutoSend');
            
            // WebSocket 变量
            let websocket = null;
            let isConnected = false;
            let messageCounter = 0;
            let connectionStartTime = null;
            let autoSendInterval = null;
            
            // 更新状态显示
            function updateStatus(status, message) {
                connectionStatus.textContent = message;
                connectionStatus.className = 'status ' + status;
                
                if (status === 'connected') {
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                } else if (status === 'disconnected') {
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    messageInput.disabled = true;
                    sendBtn.disabled = true;
                } else if (status === 'connecting') {
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = true;
                    messageInput.disabled = true;
                    sendBtn.disabled = true;
                }
            }
            
            // 添加日志条目
            function addLogEntry(type, message) {
                const now = new Date();
                const timeString = now.toLocaleTimeString();
                const logEntry = document.createElement('div');
                logEntry.className = 'log-entry ' + type;
                logEntry.innerHTML = `
                    <div class="log-time">${timeString}</div>
                    <div class="log-message">${message}</div>
                `;
                logContainer.appendChild(logEntry);
                logContainer.scrollTop = logContainer.scrollHeight;
                
                // 更新消息计数
                if (type === 'send' || type === 'receive') {
                    messageCounter++;
                    messageCount.textContent = `消息计数: ${messageCounter}`;
                }
            }
            
            // 连接 WebSocket
            function connectWebSocket() {
                const url = serverUrlInput.value.trim();
                const protocol = protocolSelect.value;
                
                if (!url) {
                    alert('请输入 WebSocket 服务器 URL');
                    return;
                }
                
                try {
                    updateStatus('connecting', '连接中...');
                    addLogEntry('system', `正在连接到: ${url}`);
                    
                    // 创建 WebSocket 连接
                    if (protocol) {
                        websocket = new WebSocket(url, protocol);
                    } else {
                        websocket = new WebSocket(url);
                    }
                    
                    // 连接打开事件
                    websocket.onopen = function(event) {
                        isConnected = true;
                        connectionStartTime = new Date();
                        connectionTime.textContent = `连接时间: ${connectionStartTime.toLocaleTimeString()}`;
                        updateStatus('connected', '已连接');
                        addLogEntry('system', 'WebSocket 连接已建立');
                    };
                    
                    // 接收消息事件
                    websocket.onmessage = function(event) {
                        addLogEntry('receive', `收到消息: ${event.data}`);
                    };
                    
                    // 错误事件
                    websocket.onerror = function(event) {
                        addLogEntry('error', 'WebSocket 错误发生');
                        console.error('WebSocket error:', event);
                    };
                    
                    // 连接关闭事件
                    websocket.onclose = function(event) {
                        isConnected = false;
                        updateStatus('disconnected', '连接已关闭');
                        addLogEntry('system', `连接已关闭，代码: ${event.code}, 原因: ${event.reason || '无'}`);
                        
                        // 清除自动发送
                        if (autoSendInterval) {
                            clearInterval(autoSendInterval);
                            autoSendInterval = null;
                        }
                    };
                    
                } catch (error) {
                    updateStatus('disconnected', '连接失败');
                    addLogEntry('error', `连接失败: ${error.message}`);
                    console.error('Connection error:', error);
                }
            }
            
            // 断开 WebSocket 连接
            function disconnectWebSocket() {
                if (websocket) {
                    websocket.close(1000, '用户主动断开');
                    websocket = null;
                }
            }
            
            // 发送消息
            function sendMessage() {
                if (!isConnected || !websocket) {
                    addLogEntry('error', '未连接，无法发送消息');
                    return;
                }
                
                const message = messageInput.value.trim();
                if (!message) {
                    alert('请输入要发送的消息');
                    return;
                }
                
                try {
                    websocket.send(message);
                    addLogEntry('send', `发送消息: ${message}`);
                    messageInput.value = '';
                } catch (error) {
                    addLogEntry('error', `发送失败: ${error.message}`);
                }
            }
            
            // 发送文本消息
            function sendTextMessage() {
                messageInput.value = 'Hello WebSocket! ' + new Date().toLocaleTimeString();
                sendMessage();
            }
            
            // 发送 JSON 消息
            function sendJsonMessage() {
                const jsonMessage = {
                    type: 'chat',
                    content: 'Hello from WebSocket client',
                    timestamp: new Date().toISOString(),
                    user: 'WebSocketUser'
                };
                messageInput.value = JSON.stringify(jsonMessage);
                sendMessage();
            }
            
            // 发送 Ping 消息
            function sendPingMessage() {
                messageInput.value = 'ping';
                sendMessage();
            }
            
            // 开始自动发送
            function startAutoSend() {
                if (!isConnected) {
                    alert('请先连接到 WebSocket 服务器');
                    return;
                }
                
                addLogEntry('system', '开始自动发送消息');
                let counter = 1;
                
                autoSendInterval = setInterval(() => {
                    if (isConnected && websocket) {
                        const message = `自动消息 #${counter} - ${new Date().toLocaleTimeString()}`;
                        websocket.send(message);
                        addLogEntry('send', `发送消息: ${message}`);
                        counter++;
                    } else {
                        clearInterval(autoSendInterval);
                        autoSendInterval = null;
                    }
                }, 2000);
            }
            
            // 停止自动发送
            function stopAutoSend() {
                if (autoSendInterval) {
                    clearInterval(autoSendInterval);
                    autoSendInterval = null;
                    addLogEntry('system', '已停止自动发送消息');
                }
            }
            
            // 清除日志
            function clearLog() {
                logContainer.innerHTML = '';
                addLogEntry('system', '日志已清除');
                messageCounter = 0;
                messageCount.textContent = '消息计数: 0';
            }
            
            // 导出日志
            function exportLog() {
                const logEntries = logContainer.querySelectorAll('.log-entry');
                let logText = "WebSocket 客户端日志\n";
                logText += "生成时间: " + new Date().toLocaleString() + "\n\n";
                
                logEntries.forEach(entry => {
                    const time = entry.querySelector('.log-time').textContent;
                    const message = entry.querySelector('.log-message').textContent;
                    logText += `${time} - ${message}\n`;
                });
                
                const blob = new Blob([logText], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'websocket_log.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                addLogEntry('system', '日志已导出');
            }
            
            // 事件监听器
            connectBtn.addEventListener('click', connectWebSocket);
            disconnectBtn.addEventListener('click', disconnectWebSocket);
            
            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            textMessageBtn.addEventListener('click', sendTextMessage);
            jsonMessageBtn.addEventListener('click', sendJsonMessage);
            pingMessageBtn.addEventListener('click', sendPingMessage);
            
            startAutoSendBtn.addEventListener('click', startAutoSend);
            stopAutoSendBtn.addEventListener('click', stopAutoSend);
            
            clearLogBtn.addEventListener('click', clearLog);
            exportLogBtn.addEventListener('click', exportLog);
            
            // 初始化
            updateStatus('disconnected', '未连接');
            document.getElementById('currentTime').textContent = new Date().toLocaleString();
        });
    </script>
</body>
</html>
