<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Web客户端</title>
    <!--
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    -->
    <script src="./js/mqtt.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: #fff;
            min-height: 100vh;
            padding: 15px; /* 减少页面边距 */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px; /* 减少头部内边距 */
            text-align: center;
            border-bottom: 2px solid #4CAF50;
        }

        h1 {
            font-size: 2rem; /* 减小标题字体 */
            margin-bottom: 8px; /* 减少底部边距 */
            color: #4CAF50;
        }

        .subtitle {
            font-size: 1rem; /* 减小副标题字体 */
            opacity: 0.8;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            padding: 15px; /* 减少内边距 */
        }

        .connection-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px; /* 减少间距 */
            margin-bottom: 15px;
            padding: 10px; /* 减少内边距 */
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .connection-input {
            flex: 1;
            min-width: 200px;
        }

        .connection-controls {
            display: flex;
            gap: 8px; /* 减少按钮间距 */
        }

        input, button, select {
            padding: 10px 12px; /* 减小输入框和按钮内边距 */
            border: none;
            border-radius: 5px;
            font-size: 0.9rem; /* 减小字体 */
        }

        input, select {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            width: 100%;
        }

        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            white-space: nowrap;
        }

        button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .btn-disconnect {
            background: #f44336;
        }

        .btn-disconnect:hover {
            background: #e53935;
        }

        .btn-clear {
            background: #9c27b0;
        }

        .btn-clear:hover {
            background: #8e24aa;
        }

        .btn-subscribe {
            background: #2196F3;
        }

        .btn-subscribe:hover {
            background: #1E88E5;
        }

        .btn-publish {
            background: #FF9800;
        }

        .btn-publish:hover {
            background: #FB8C00;
        }

        .status-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px; /* 减少间距 */
            margin-bottom: 15px;
        }

        .status-box {
            flex: 1;
            min-width: 120px; /* 减小最小宽度 */
            padding: 12px; /* 减小内边距 */
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            text-align: center;
        }

        .status-value {
            font-size: 1.2rem; /* 减小字体 */
            font-weight: bold;
            margin-top: 5px;
        }

        .connected {
            color: #4CAF50;
        }

        .disconnected {
            color: #f44336;
        }

        .message-panel {
            display: flex;
            flex-direction: column;
            gap: 12px; /* 减少间距 */
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topic-controls {
            display: flex;
            gap: 8px; /* 减少间距 */
            margin-bottom: 12px; /* 减少底部边距 */
            flex-wrap: wrap;
        }

        .topic-controls input {
            flex: 1;
            min-width: 200px;
        }

        .topic-controls select {
            flex: 0 0 auto;
            width: auto;
        }

        .topic-controls button {
            flex: 0 0 auto;
        }

        .publish-controls {
            display: flex;
            gap: 8px; /* 减少间距 */
            margin-bottom: 12px; /* 减少底部边距 */
        }

        .publish-controls input {
            flex: 1;
        }

        .qos-select {
            width: auto;
            flex: 0 0 auto;
        }

        .messages {
            height: 300px; /* 减小高度从400px到300px */
            overflow-y: hidden;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 12px; /* 减小内边距 */
            display: flex;
            flex-direction: column;
            gap: 8px; /* 减少消息间距 */
        }

        .message {
            padding: 8px 12px; /* 减小内边距 */
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.3s ease;
            font-size: 0.9rem; /* 减小字体 */
        }

        .message.system {
            background: rgba(33, 150, 243, 0.3);
            font-style: italic;
        }

        .message.received {
            background: rgba(76, 175, 80, 0.3);
        }

        .message.published {
            background: rgba(255, 152, 0, 0.3);
        }

        .message.error {
            background: rgba(244, 67, 54, 0.3);
        }

        .message-header-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem; /* 减小字体 */
            opacity: 0.7;
            margin-bottom: 3px; /* 减少底部边距 */
        }

        .message-topic {
            font-weight: bold;
        }

        .message-time {
            font-size: 0.7rem; /* 减小字体 */
        }

        .empty-state {
            text-align: center;
            padding: 30px 15px; /* 减小内边距 */
            color: rgba(255, 255, 255, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            text-align: center;
            padding: 12px; /* 减小内边距 */
            background: rgba(0, 0, 0, 0.8);
            font-size: 0.8rem; /* 减小字体 */
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .connection-panel, .status-panel, .topic-controls, .publish-controls {
                flex-direction: column;
            }

            h1 {
                font-size: 1.8rem;
            }

            .messages {
                height: 250px; /* 在小屏幕上进一步减小高度 */
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>MQTT Web客户端</h1>
        <p class="subtitle">基于JavaScript的MQTT客户端实现</p>
    </header>

    <div class="main-content">
        <div class="connection-panel">
            <div class="connection-input">
                <input type="text" id="brokerUrl" placeholder="MQTT代理服务器地址" value="ws://127.0.0.1:8083">
            </div>
            <div class="connection-input">
                <input type="text" id="clientId" placeholder="客户端ID (可选)" value="mqtt_web_client_">
            </div>
            <div class="connection-input">
                <input type="text" id="username" placeholder="用户名 (可选)">
            </div>
            <div class="connection-input">
                <input type="password" id="password" placeholder="密码 (可选)">
            </div>
            <div class="connection-controls">
                <button id="connectBtn">连接</button>
                <button id="disconnectBtn" class="btn-disconnect" disabled>断开</button>
                <button id="clearBtn" class="btn-clear">清理日志</button>
            </div>
        </div>

        <div class="status-panel">
            <div class="status-box">
                <div>连接状态</div>
                <div id="connectionStatus" class="status-value disconnected">未连接</div>
            </div>
            <div class="status-box">
                <div>接收消息数</div>
                <div id="messageCount" class="status-value">0</div>
            </div>
            <div class="status-box">
                <div>已订阅主题</div>
                <div id="subscribedTopics" class="status-value">0</div>
            </div>
            <div class="status-box">
                <div>最后活动</div>
                <div id="lastActivity" class="status-value">--:--:--</div>
            </div>
        </div>

        <div class="message-panel">
            <div class="message-header">
                <h3>主题管理</h3>
                <div class="message-stats">已显示 <span id="visibleMessageCount">0</span> 条消息</div>
            </div>

            <div class="topic-controls">
                <input type="text" id="subscribeTopic" placeholder="输入要订阅的主题 (例如: test/topic)">
                <select id="subscribeQos">
                    <option value="0">QoS 0</option>
                    <option value="1">QoS 1</option>
                    <option value="2">QoS 2</option>
                </select>
                <button id="subscribeBtn" class="btn-subscribe" disabled>订阅</button>
            </div>

            <div class="publish-controls">
                <input type="text" id="publishTopic" placeholder="输入要发布的主题">
                <input type="text" id="publishMessage" placeholder="输入要发布的消息">
                <select id="publishQos" class="qos-select">
                    <option value="0">QoS 0</option>
                    <option value="1">QoS 1</option>
                    <option value="2">QoS 2</option>
                </select>
                <button id="publishBtn" class="btn-publish" disabled>发布</button>
            </div>

            <div class="messages" id="messagesContainer">
                <div class="empty-state">
                    <h3>等待连接MQTT代理...</h3>
                    <p>连接后，您可以订阅主题和发布消息</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>MQTT Web客户端 &copy; 2023 | 基于 mqtt.js 实现</p>
    </footer>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 检查MQTT库是否加载
        setTimeout(() => {
            if (typeof Paho === 'undefined' && typeof mqtt === 'undefined') {
                document.getElementById('messagesContainer').innerHTML = `                <div class="empty-state">
                    <h3>MQTT客户端库加载失败</h3>
                    <p>请检查网络连接或使用本地托管的库文件</p>
                </div>
            `;
            }
        }, 1000);


        // 获取DOM元素
        const brokerUrlInput = document.getElementById('brokerUrl');
        const clientIdInput = document.getElementById('clientId');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const clearBtn = document.getElementById('clearBtn');
        const subscribeTopicInput = document.getElementById('subscribeTopic');
        const subscribeQosSelect = document.getElementById('subscribeQos');
        const subscribeBtn = document.getElementById('subscribeBtn');
        const publishTopicInput = document.getElementById('publishTopic');
        const publishMessageInput = document.getElementById('publishMessage');
        const publishQosSelect = document.getElementById('publishQos');
        const publishBtn = document.getElementById('publishBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const connectionStatus = document.getElementById('connectionStatus');
        const messageCount = document.getElementById('messageCount');
        const subscribedTopics = document.getElementById('subscribedTopics');
        const lastActivity = document.getElementById('lastActivity');
        const visibleMessageCount = document.getElementById('visibleMessageCount');

        // MQTT客户端变量
        let mqttClient = null;
        let messageCounter = 0;
        let visibleMessages = 0;
        let topicCount = 0;

        // 生成随机客户端ID
        function generateClientId() {
            const randomId = Math.random().toString(16).substr(2, 8);
            return clientIdInput.value + randomId;
        }

        // 检查消息容器是否为空状态
        function isEmptyState() {
            return messagesContainer.querySelector('.empty-state') !== null;
        }

        // 移除空状态
        function removeEmptyState() {
            const emptyState = messagesContainer.querySelector('.empty-state');
            if (emptyState) {
                messagesContainer.removeChild(emptyState);
            }
        }

        // 添加消息到消息容器
        function addMessage(text, type = 'system', topic = '') {
            // 如果是第一条消息，移除空状态
            if (isEmptyState()) {
                removeEmptyState();
            }

            const messageElement = document.createElement('div');
            messageElement.className = `message ${type}`;

            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0];

            messageElement.innerHTML = `
                    <div class="message-header-info">
                        <div class="message-topic">${topic || '系统消息'}</div>
                        <div class="message-time">${timeString}</div>
                    </div>
                    <div>${text}</div>
                `;

            messagesContainer.appendChild(messageElement);

            // 更新最后活动时间
            lastActivity.textContent = timeString;

            // 更新可见消息计数
            if (type !== 'system') {
                visibleMessages++;
                visibleMessageCount.textContent = visibleMessages;
            }
        }

        // 清理日志
        function clearMessages() {
            messagesContainer.innerHTML = '';
            visibleMessages = 0;
            visibleMessageCount.textContent = '0';

            // 添加空状态
            messagesContainer.innerHTML = `
                    <div class="empty-state">
                        <h3>消息日志已清理</h3>
                        <p>等待新消息...</p>
                    </div>
                `;
        }

        // 修改连接函数适配mqtt.js
        function connect() {
            const url = brokerUrlInput.value.trim();
            if (!url) {
                alert('请输入MQTT代理服务器地址');
                return;
            }

            try {
                // 使用mqtt.js创建客户端
                mqttClient = mqtt.connect(url, {
                    clientId: generateClientId(),
                    username: usernameInput.value.trim() || undefined,
                    password: passwordInput.value.trim() || undefined,
                    keepalive: 60,
                    clean: true
                });

                mqttClient.on('connect', onConnect);
                mqttClient.on('error', onConnectFailure);
                mqttClient.on('message', onMessageArrived);
                mqttClient.on('close', onConnectionLost);
                mqttClient.on('disconnect', onConnectionLost);
                mqttClient.on('offline', onConnectionLost);

                addMessage(`正在连接MQTT代理: ${url}`, 'system');

            } catch (error) {
                addMessage(`连接失败: ${error.message}`, 'error');
                updateConnectionStatus(false);
            }
        }

        // 连接成功回调
        function onConnect() {
            updateConnectionStatus(true);
            addMessage('成功连接到MQTT代理', 'system');
        }

        // 连接失败回调 - 适配mqtt.js
        function onConnectFailure(error) {
            updateConnectionStatus(false);
            addMessage(`连接失败: ${error.message || error}`, 'error');
        }

        // 连接丢失回调 - 适配mqtt.js
        function onConnectionLost(error) {
            updateConnectionStatus(false);
            if (error) {
                addMessage(`连接丢失: ${error.message || error}`, 'error');
            } else {
                addMessage('连接已关闭', 'system');
            }
        }

        // 消息到达回调 - 适配mqtt.js
        function onMessageArrived(topic, message, packet) {
            messageCounter++;
            messageCount.textContent = messageCounter;

            // mqtt.js中message是Buffer对象，需要转换为字符串
            const payload = message.toString();

            addMessage(payload, 'received', topic);
        }

        // 订阅主题 - 适配mqtt.js
        function subscribe() {
            if (!mqttClient || !mqttClient.connected) {
                addMessage('未连接到MQTT代理', 'error');
                return;
            }

            const topic = subscribeTopicInput.value.trim();
            if (!topic) {
                alert('请输入要订阅的主题');
                return;
            }

            const qos = parseInt(subscribeQosSelect.value);

            mqttClient.subscribe(topic, {qos: qos});

            addMessage(`已订阅主题: ${topic} (QoS: ${qos})`, 'system');
            topicCount++;
            subscribedTopics.textContent = topicCount;

            // 清空输入框
            subscribeTopicInput.value = '';
        }

        // 发布消息 - 适配mqtt.js
        function publish() {
            if (!mqttClient || !mqttClient.connected) {
                addMessage('未连接到MQTT代理', 'error');
                return;
            }

            const topic = publishTopicInput.value.trim();
            const message = publishMessageInput.value.trim();

            if (!topic) {
                alert('请输入要发布的主题');
                return;
            }

            if (!message) {
                alert('请输入要发布的消息');
                return;
            }

            const qos = parseInt(publishQosSelect.value);

            // 使用mqtt.js的发布方法
            mqttClient.publish(topic, message, {qos: qos});

            addMessage(message, 'published', topic);

            // 清空消息输入框
            publishMessageInput.value = '';
        }

        // 断开连接 - 适配mqtt.js
        function disconnect() {
            if (mqttClient && mqttClient.connected) {
                mqttClient.end();
                updateConnectionStatus(false);
                addMessage('已断开与MQTT代理的连接', 'system');

                // 重置计数器
                topicCount = 0;
                subscribedTopics.textContent = '0';
            }
        }


// 更新连接状态检查函数
        function updateConnectionStatus(connected) {
            if (connected) {
                connectionStatus.textContent = '已连接';
                connectionStatus.className = 'status-value connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                subscribeBtn.disabled = false;
                publishBtn.disabled = false;
                brokerUrlInput.disabled = true;
                clientIdInput.disabled = true;
                usernameInput.disabled = true;
                passwordInput.disabled = true;
            } else {
                connectionStatus.textContent = '未连接';
                connectionStatus.className = 'status-value disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                subscribeBtn.disabled = true;
                publishBtn.disabled = true;
                brokerUrlInput.disabled = false;
                clientIdInput.disabled = false;
                usernameInput.disabled = false;
                passwordInput.disabled = false;
            }
        }

        // 绑定事件
        connectBtn.addEventListener('click', connect);
        disconnectBtn.addEventListener('click', disconnect);
        clearBtn.addEventListener('click', clearMessages);
        subscribeBtn.addEventListener('click', subscribe);
        publishBtn.addEventListener('click', publish);

        // 按Enter键发送消息
        publishMessageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                publish();
            }
        });

        // 按Enter键订阅主题
        subscribeTopicInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                subscribe();
            }
        });

        // 初始化状态
        updateConnectionStatus(false);
        visibleMessageCount.textContent = '0';

        // 生成初始客户端ID
        clientIdInput.value = generateClientId();
    });
</script>
</body>
</html>
