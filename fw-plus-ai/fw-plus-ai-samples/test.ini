3. 大语言模型在语言规范化中的作用
大语言模型在语言规范化过程中发挥以下作用：
  1.语义理解：理解用户问题的真实意图，而不仅仅是表面的词汇匹配
  2.上下文融合：结合历史对话、数据库模式等上下文信息来更好地理解问题
  3.表达优化：将不规范或含糊的表达转换为更清晰、准确的表述
  4.领域适应：根据特定领域（如数据库查询）的特点来优化理解 

4. 实际工作流程
整个语言规范化过程在WrenAI中是这样工作的：
  1.用户输入自然语言问题
  2.系统将问题和相关上下文（历史对话、数据库模式等）组织成提示模板
  3.大语言模型接收这个提示并生成规范化的理解和处理方案
  4.系统根据模型的输出进行后续处理（如SQL生成）
因此，可以说语言规范化在WrenAI系统中主要是通过大语言模型来实现的，它利用模型的强大语言理解能力来处理各种复杂的自然语言输入，并将其转换为系统可以准确处理的规范化表达  

这表明系统会将历史问题与当前问题结合，形成更完整的上下文来理解用户意图。
意图分类 (Intent Classification)
意图分类是判断用户问题属于哪种类型的处理过程。在WrenAI中，主要分为两类：
1.TEXT_TO_SQL：需要转换为SQL查询的问题
2.GENERAL：通用问题，不需要SQL查询
实现机制
意图分类通过大型语言模型（LLM）和特定的提示模板来实现


# 意图分类判断逻辑
def classify_intent(query: str) -> str:
    # 判断是否为SQL查询相关问题
    if is_sql_related(query):
        return "TEXT_TO_SQL"
    else:
        return "GENERAL"  


