实际应用场景
场景1: 数据安全   指令: "不要访问用户表中的email和phone字段"
场景2: 性能优化   指令: "所有查询都必须包含时间范围限制"   即使用户没有明确指定时间范围，系统也会在生成的SQL中添加适当的WHERE条件
场景3: 业务规则   指令: "财务数据只显示已审核的记录"

管理方式
与SQL样本类似，指令也可以通过以下方式管理：
   1.UI界面管理：用户可以通过界面添加、编辑、删除指令
   2.API接口管理：提供REST API进行程序化管理
   3.批量导入：支持批量导入JSON格式的指令集
总的来说，指令是WrenAI系统中用于定制化AI行为的重要机制，它们与SQL样本一起为模型提供了丰富的上下文信息，使得系统能够更好地满足用户的特定需求。


