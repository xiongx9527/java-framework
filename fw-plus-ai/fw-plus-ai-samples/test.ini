分类判断标准
意图分类会基于以下因素进行判断：
  1.关键词识别：
    包含"查询"、"显示"、"统计"、"计算"等词汇的问题通常被分类为TEXT_TO_SQL
    包含"帮助"、"如何"、"解释"等词汇的问题可能被分类为GENERAL
  2.数据库模式上下文：
    问题是否与数据库中的表、列、视图等相关
    是否涉及数据聚合、过滤、排序等数据库操作
  3.历史对话上下文：
    用户之前的对话是否与数据查询相关
  4.样本匹配：
    问题是否与已知的SQL样本问题相似
实际处理流程
在WrenAI的AskService中，意图分类的处理流程如下：

1.问题理解阶段：
# 设置初始状态为understanding
self._ask_results[query_id] = AskResultResponse(
       status="understanding",
       trace_id=trace_id,
)
2.意图分类执行：
# 调用意图分类管道
intent_classification_result = await self._pipelines["intent_classification"].run(
    query=ask_request.query,
    history=ask_request.history,
    db_schemas=db_schemas,
    # 其他参数...
)
3.结果处理： 
根据分类结果决定后续处理流程：
  如果是TEXT_TO_SQL类型，进入数据库模式检索和SQL生成流程
  如果是GENERAL类型，进入通用问题处理流

意图分类的重要性
  1.资源优化：避免对不需要SQL查询的问题执行昂贵的数据库模式检索
  2.用户体验：为不同类型的问题提供相应的回答方式
  3.处理路径分离：将SQL查询和通用问题分别路由到不同的处理管道
通过这种两步处理方式（问题重述 + 意图分类），WrenAI能够更准确地理解用户需求，并选择最合适的处理流程来生成响应  


