2. 上下文窗口管理
系统会限制历史对话的数量：
class AskService:
    def __init__(self, max_histories: int = 5):
        self._max_histories = max_histories
    def _limit_histories(self, histories):
        # 只保留最近的几轮对话
        return histories[-self._max_histories:] if histories else []
3. 分层处理策略
系统采用分层处理来减少token消耗：
    1.轻量级意图分类：使用较少的上下文进行初步分类
    2.详细处理：只对需要SQL生成的问题提供完整上下文
4. 压缩和摘要技术
对于复杂上下文，可能会使用摘要技术
# 对历史对话进行摘要
def summarize_histories(histories):
    if len(histories) > 3:
        # 只保留最近的对话和摘要信息
        recent = histories[-2:]
        summary = generate_summary(histories[:-2])
        return [summary] + recent
    return histories


