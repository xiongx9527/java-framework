自然语言转SQL实现流程
WrenAI的自然语言转SQL流程遵循一个完整的AI处理管道，包含以下几个关键阶段：
1. 整体流程概述
graph TD
    A[用户提问] --> B[意图分类]
    B --> C{是否为SQL查询}
    C -->|是| D[数据库模式检索]
    C -->|否| E[通用处理]
    D --> F[SQL推理生成]
    F --> G[SQL生成]
    G --> H[SQL执行与验证]
    H --> I[结果返回]
2. 详细实现步骤
阶段1: 理解与意图分类 (Understanding & Intent Classification)
首先系统会对用户问题进行理解并分类：
  1.问题重述 (Rephrasing) - 重新表述用户问题以更好地理解
  2.意图分类 (Intent Classification) - 判断问题类型(TEXT_TO_SQL 或 GENERAL)

首先系统会对用户问题进行理解并分类： 
问题重述 (Rephrasing) - 重新表述用户问题以更好地理解 意图分类 (Intent Classification) - 
判断问题类型(TEXT_TO_SQL 或 GENERAL) 详细解释下

在WrenAI系统中，问题理解和分类是自然语言转SQL流程的第一步，这个过程包含两个关键步骤：问题重述（Rephrasing）和意图分类（Intent Classification）。让我详细解释这两个步骤：
问题重述 (Rephrasing)
问题重述的目的是重新表述用户的问题，以便更好地理解用户的真实意图。这一步通常包括：
1.语言规范化：将用户问题转换为更标准的表达方式
2.消除歧义：澄清可能含糊不清的表达
3.上下文补充：根据历史对话或领域知识补充必要的上下文信息
4.具体实现机制：
  向量检索：将文本转换为向量表示，在向量数据库中查找语义上最相关的内容
  上下文窗口管理：限制历史对话数量(通常保留最近5轮)
在WrenAI中，虽然没有直接展示问题重述的具体实现，但我们可以从代码中看到相关处理
# 在意图分类管道中，会处理历史对话上下文
previous_query_summaries = (
    [history.question for history in histories] if histories else []
)
query = "\n".join(previous_query_summaries) + "\n" + query

语言规范化与大语言模型的关系
在WrenAI系统中，语言规范化确实是通过大语言模型来实现的，但这并不是一个独立的步骤，而是集成在多个处理流程中的。
1. 意图分类中的语言规范化
