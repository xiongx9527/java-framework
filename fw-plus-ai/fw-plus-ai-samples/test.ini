我将帮你了解 wren-ai-service 中如何操作向量数据库。让我先查看相关代码结构和实现方式。



在 WrenAI 的 wren-ai-service 项目中，向量数据库操作主要通过 Qdrant 实现。让我为你详细介绍：
向量数据库操作实现
1. AsyncQdrantDocumentStore 类
wren-ai-service 使用自定义的 AsyncQdrantDocumentStore 类来操作 Qdrant 向量数据库，该类继承自 QdrantDocumentStore 并添加了异步支持。
主要操作方法包括：


一、写入文档：
async def write_documents(self, documents: List[Document], policy: DuplicatePolicy = DuplicatePolicy.FAIL)
该方法将文档列表写入向量数据库，支持重复策略处理。
二、删除文档查询操作
1.基于向量相似度查询：
async def _query_by_embedding(
    self,
    query_embedding: List[float],
    filters: Optional[Dict[str, Any]] = None,
    top_k: int = 10,
    scale_score: bool = True,
    return_embedding: bool = False,
) -> List[Document]
2.基于过滤条件查询：
async def _query_by_filters(
    self,
    filters: Optional[Dict[str, Any]] = None,
    top_k: Optional[int] = None,
) -> List[Document]
三、删除文档
async def delete_documents(self, filters: Optional[Dict[str, Any]] = None)
四、统计文档数量
async def count_documents(self, filters: Optional[Dict[str, Any]] = None) -> int

2. AsyncQdrantEmbeddingRetriever 类
用于执行向量检索操作：
async def run(
    self,
