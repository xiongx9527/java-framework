3. Views（视图）
视图是预定义的查询，可以简化复杂查询或提供特定视角的数据：
name：视图名称
statement：SQL查询语句
properties：视图的元数据

----------------------
视图定义的关键字段
type：固定为"VIEW"，标识这是一个视图文档
comment：包含视图的属性信息，如描述等
name：视图的名称
statement：定义视图的SQL查询语句
# 输入的MDL定义
{
    "views": [
        {
            "name": "view_1", 
            "statement": "SELECT * FROM user"
        }
    ]
}

# 生成的文档
document = {
    "meta": {
        "type": "TABLE_SCHEMA", 
        "name": "view_1"
    },
    "content": str({
        "type": "VIEW",
        "comment": "",
        "name": "view_1",
        "statement": "SELECT * FROM user",
    })
}


# 输入的MDL定义
{
    "views": [
        {
            "name": "view_1",
            "statement": "SELECT * FROM user",
            "properties": {
                "description": "A view containing user information."
            }
        }
    ]
}

# 生成的文档
document = {
    "meta": {
        "type": "TABLE_SCHEMA", 
        "name": "view_1"
    },
    "content": str({
        "type": "VIEW",
        "comment": "/* {'description': 'A view containing user information.'} */\n",
        "name": "view_1",
        "statement": "SELECT * FROM user",
    })
}

设计考虑
1.统一的元数据结构：所有数据库对象（表、视图、列）都使用相同的元数据结构，便于检索
2.区分的内容结构：通过内容中的"type"字段区分不同类型的数据库对象
3.完整的视图定义：包含视图名称和定义SQL语句，足以重建视图
4.属性支持：支持通过properties字段添加额外的元数据信息


实际应用中的视图
在实际应用中，多表连接视图通常用于以下场景：
数据聚合 - 将来自多个表的数据进行汇总计算
简化复杂查询 - 将常用的多表连接查询封装成视图
数据安全 - 通过视图限制用户只能访问特定的数据列或行
逻辑抽象 - 将复杂的表结构抽象为简单的视图结构
视图的优势
重用性 - 可以在多个查询中重复使用
简化查询 - 将复杂的多表连接逻辑封装起来
安全性 - 可以隐藏敏感数据列
逻辑独立性 - 底层表结构变化时，只需调整视图定义
在WrenAI系统中，视图与其他数据库对象（表、列等）一样，都会被转换为向量文档存储在向量数据库中，以便AI在生成SQL查询时能够理解和使用这些视图。

视图字段的推断
当AI需要理解视图的字段结构时，它需要：
1.解析视图的SQL语句
2.分析SELECT子句中的字段
3.推断字段的数据类型和含义
这与表的处理方式不同，表可以直接从columns定义中获取字段信息。
