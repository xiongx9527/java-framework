指导与指令的区别
根据项目规范[1]，需要区分USER GUIDE和用户自定义的instructions：
USER GUIDE (docs): 系统级别的文档，介绍系统功能和使用方法，对所有用户通用
USER INSTRUCTIONS (instructions): 用户自定义的业务规则和偏好设置，针对特定项目或用户需求

在意图分类中的作用
在意图分类过程中，USER GUIDE帮助模型：
  1.理解WrenAI系统的功能范围
  2.了解什么样的问题适合用SQL查询来回答
  3.掌握系统的工作原理和限制
  4.更好地判断用户问题是否属于TEXT_TO_SQL类型
通过提供这些系统文档，意图分类模型能够更准确地区分哪些问题是需要转换为SQL查询的，哪些是需要通用回答的，从而提高分类准确性

