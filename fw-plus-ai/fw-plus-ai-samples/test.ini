阶段2: 数据库模式检索 (Schema Retrieval)
对于SQL查询类问题，系统会检索相关的数据库模式信息：
  1.表检索 - 通过向量搜索找到与问题相关的表
  2.列检索 - 获取相关表的列信息
  3.视图和指标检索 - 获取相关的视图和预定义指标 

# 数据库模式检索过程
async def dbschema_retrieval(table_retrieval: dict, embedding: dict, project_id: str):
    # 从检索到的表中提取表名
    tables = table_retrieval.get("documents", [])
    table_names = [parse_table_name(table.content) for table in tables]
    
    # 构建过滤条件获取表结构信息
    filters = build_filters(table_names, project_id)
    results = await dbschema_retriever.run(query_embedding=embedding.get("embedding"), filters=filters)
    return results["documents"]   

