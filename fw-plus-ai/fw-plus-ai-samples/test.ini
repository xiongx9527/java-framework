4. Metrics（指标）
指标是用于分析的度量标准，通常包含维度和度量：
name：指标名称
baseObject：基础对象（通常是模型）
dimension：维度列（用于分组）
measure：度量列（用于计算）

处理流程
在数据库模式索引过程中，这些元素按以下方式处理：
模型处理：
每个模型被转换为TABLE类型的文档
模型的列被分批处理为TABLE_COLUMNS类型的文档（避免单个文档过大）
列信息包括数据类型、主键信息和注释
关系处理：
关系被转换为外键约束信息
添加到相关模型的列定义中
视图处理：
每个视图被转换为VIEW类型的文档
包含视图的SQL语句和元数据
指标处理：
每个指标被转换为METRIC类型的文档
包含维度和度量信息
通过这种方式，WrenAI能够将复杂的数据库模式转换为向量表示，便于后续的语义搜索和自然语言查询处理。这种结构化的处理方式使得AI能够更好地理解数据之间的关系，从而生成更准确的SQL查询


指标（Metrics）的数据结构
指标在WrenAI中被定义为一种预聚合的数据结构，包含维度（dimensions）和度量（measures）两个核心组件，类似于OLAP立方体的概念

 1. 维度（Dimensions）：维度是指标的属性，例如时间、地区、产品、类别等，维度可以进行分组和聚合，用于描述指标的属性
 2. 度量（Measures）：度量是指标的值，例如销售额、库存量、利润等，度量可以进行计算和聚合，用于描述指标的值
 3. 聚合函数：聚合函数是度量进行计算和聚合的函数，例如求和、平均值、最大值、最小值等


指标各组成部分详解
  1.name: 指标的名称
  2.baseObject: 指标的基础对象（源表）
  3.dimension: 维度列表，用于数据分组和切片
  4.measure: 度量列表，包含聚合计算表达式 


document = {
    "meta": {
        "type": "TABLE_SCHEMA", 
        "name": "revenue"
    },
    "content": str({
        "type": "METRIC",
        "comment": "\n/* This table is a metric */\n/* Metric Base Object: orders */\n",
        "name": "revenue",
        "columns": [
            {
                "type": "COLUMN",
                "comment": "-- This column is a dimension\n  ",
                "name": "purchase_timestamp",
                "data_type": "TIMESTAMP",
            },
            {
                "type": "COLUMN",
                "comment": "-- This column is a measure\n  -- expression: SUM(order_items.price)\n  ",
                "name": "price_sum",
                "data_type": "DOUBLE",
            }
        ],
    })
}

指标的优势
1.简化复杂查询：将复杂的聚合逻辑封装在指标中
2.提高查询性能：预聚合数据，减少实时计算
3.业务语义明确：度量和维度的分离使业务含义更加清晰
4.易于理解和使用：用户可以像查询普通表一样查询指标
在WrenAI系统中，指标与其他数据库对象（表、视图等）一样，都会被转换为向量文档存储在向量数据库中，以便AI在生成SQL查询时能够理解和使用这些指标。

5.Question-SQL Pair文档
这类文档专门用于存储问题和SQL查询对，主要用于训练和优化AI模型：
Document(
    id=str(uuid.uuid4()),
    meta={
        "sql_pair_id": sql_pair.id,
        "sql": sql_pair.sql,
        "project_id": project_id,  # 可选
    },
    content=sql_pair.question,
)
特点：
content存储自然语言问题
meta中存储对应的SQL语句和ID信息
主要用于语义相似性搜索和模型训练
实际应用场景
1.训练AI模型: 通过大量的Question-SQL Pair，AI可以学习如何将自然语言问题转换为SQL查询
2.评估模型性能: 用于测试AI生成的SQL是否准确
3.知识库构建: 作为系统知识库的一部分，帮助AI更好地理解业务规则和查询模式


为什么这样设计？
这种设计有以下几个原因：
1.统一检索机制：无论用户查询的是表、视图还是指标，系统都可以通过相同的元数据字段("name")来检索相关文档。
2.逻辑抽象：在WrenAI系统中，表、视图和指标都被抽象为可以查询的"数据库对象"，它们都有自己的名称。
3.简化处理：使用统一的元数据结构简化了文档处理和检索逻辑。
---------------------------------------------

historical_question_indexing (历史问题索引)
table_description_indexing (表描述索引)
db_schema_retrieval (数据库模式检索)
historical_question_retrieval (历史问题检索)
这些管道通过配置文件进行配置，并在运行时使用 Qdrant 进行向量存储和检索操作。



