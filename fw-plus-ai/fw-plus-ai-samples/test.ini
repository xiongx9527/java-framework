### USER GUIDE ###部分是提供给大语言模型的用户指南文档，用于帮助模型更好地理解系统功能、使用方法和上下文信息。
这个部分包含：
doc.path: 文档的路径或标识符
doc.content: 文档的具体内容

在系统中的作用
   1.系统功能说明：向模型介绍WrenAI系统的功能和特性
   2.使用指导：提供系统使用方法和最佳实践
   3.上下文增强：为模型提供更丰富的背景信息，帮助其做出更准确的判断

数据来源
从代码中可以看到，这些文档是通过wren_ai_docs变量传递的：   

