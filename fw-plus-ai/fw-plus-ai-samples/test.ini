模型处理流程
当这个模板被填充并发送给大语言模型时，模型会：
  1.阅读所有上下文信息：包括数据库模式、历史对话、用户指令等
  2.理解当前问题：分析问题的内容和意图
  3.参考样本和指南：根据提供的样本和指南进行判断
  4.生成分类结果：输出问题的分类结果（如TEXT_TO_SQL或GENERAL）

SQL样本 (SQL Samples) 和历史对话 (Histories) 的区别：
1. 来源不同
SQL样本 (SQL Samples):
    来源于预先定义的Question-SQL对
    通常由系统管理员或数据工程师预先准备和维护
    是通用的、高质量的问答示例
历史对话 (Histories):
    来源于当前用户在同一个对话线程中的实际交互记录
    是实时生成的，反映了用户当前的对话上下文
2. 作用不同
SQL样本的作用:
    作为学习示例，帮助模型理解如何将自然语言转换为SQL
    提供标准的问答模式参考
    增强模型对特定领域问题的理解能力
历史对话的作用:
    提供当前对话的上下文信息
    帮助模型理解用户的意图演进过程
    支持后续问题（follow-up questions）的处理
3. 使用场景不同
SQL样本使用场景:
### SQL SAMPLES ###
Question:
How many users are there?
SQL:
SELECT COUNT(*) FROM users

Question:
What are the total sales?
SQL:
SELECT SUM(amount) FROM orders
这些样本在任何查询中都可能被引用，作为参考示例。
历史对话使用场景:

### User's previous questions: ###
Question:
Show me the sales data for last month
SQL:
SELECT * FROM sales WHERE date >= '2023-04-01' AND date <= '2023-04-30'

Question:
What about the top 5 products?
SQL:
SELECT product_name, SUM(sales) as total_sales FROM sales WHERE date >= '2023-04-01' GROUP BY product_name ORDER BY total_sales DESC LIMIT 5
4. 在系统中的处理方式不同
SQL样本的处理:
# 通过专门的检索管道获取相关样本
async def sql_pairs_retrieval(
    query: str,
    project_id: str,
    sql_pairs_retriever: Any,
) -> dict:
    # 检索与当前查询相关的预定义SQL样本
    return await sql_pairs_retriever.run(
        query=query,
        filters={"project_id": project_id}
    )
历史对话的处理:
# 直接从用户请求中获取
def process_histories(ask_request):
    # histories直接来自用户请求
    return ask_request.histories

5. 内容特点不同
SQL样本特点:
   通常是高质量、经过验证的问答对
   覆盖常见的查询模式和业务场景
   具有教学和参考价值
历史对话特点:
   是用户实际的交互记录
   可能包含不完整或不准确的信息
   反映了特定用户的查询习惯和当前需   

6. 在提示模板中的不同作用
在意图分类的提示模板中

### SQL SAMPLES ###
{% for sql_sample in sql_samples %}
Question:
{{sql_sample.question}}
SQL:
{{sql_sample.sql}}
{% endfor %}

### User's QUERY HISTORY ###
{% for history in histories %}
Question:
{{ history.question }}
SQL:
{{ history.sql }}
{% endfor %}

SQL样本告诉模型:"这些是标准的问答示例，你可以参考这种模式" 
历史对话告诉模型:"这是当前用户之前的对话记录，需要考虑上下文"

7. 实际应用示例
假设用户在一个对话中进行了如下交互：
用户问:"显示上个月的销售数据" 系统生成SQL并返回结果
用户问:"按产品分组呢？" 这时系统会看到历史对话中有关于销售数据的查询，并理解用户是在询问上个月销售数据按产品分组的情况
同时，系统可能还会参考SQL样本中类似"按产品分组统计"的示例来更好地理解用户意图。

总结
虽然SQL样本和历史对话在形式上都是问答对，但它们在系统中扮演着不同的角色：
SQL样本是系统的"知识库"，提供通用的参考示例
历史对话是用户的"上下文"，提供当前对话的背景信息
两者结合使用，可以让系统既具备通用的问答能力，又能理解特定用户的当前需求，从而提供更准确和个性化的服务


Token消耗分析
1. SQL样本的Token消耗
SQL样本通常包含：
   自然语言问题（约10-50个token）
   对应的SQL语句（约20-200个token，取决于复杂度）
   如果有10个样本，总共可能消耗300-2000个token
2. 历史对话的Token消耗
历史对话包含：
   每轮对话的问题和SQL（约30-200个token）
   如果有5轮历史对话，可能消耗150-1000个token   
3. 总体消耗
加上数据库模式、用户指令等其他上下文，一个完整的提示可能消耗数千个token。
WrenAI系统中的优化策略
1. 智能检索机制
系统不会将所有样本和历史对话都提供给模型，而是通过检索机制选择最相关的部分：
# 只检索最相关的样本
async def sql_pairs_retrieval(
    query: str,
    project_id: str,
    sql_pairs_retriever: Any,
    top_k: int = 3  # 只返回最相关的3个样本
) -> dict:
    return await sql_pairs_retriever.run(
        query=query,
        filters={"project_id": project_id},
        top_k=top_k
)


、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、、
向量数据库在智能检索中的应用
1. 向量数据库的基本原理
向量数据库存储的是文本的向量表示（embeddings），这些向量能够捕捉文本的语义信息。通过计算向量之间的相似度（如余弦相似度），系统可以找到语义上最相关的文本。
2. SQL样本的向量检索流程
索引阶段
# SQL样本索引过程
class SqlPairsIndexing(BasicPipeline):
    def __init__(
        self,
        embedder_provider: EmbedderProvider,
        document_store_provider: DocumentStoreProvider,
        **kwargs,
    ):
        self._embedder = embedder_provider.get_text_embedder()
        self._document_store = document_store_provider.get_store(dataset_name="sql_pairs")

    async def run(
        self,
        sql_pairs: List[dict],  # [{"question": "...", "sql": "..."}, ...]
        project_id: str,
        **kwargs,
    ):
        # 为每个SQL样本创建文档对象
        documents = [
            Document(
                id=str(uuid.uuid4()),
                meta={
                    "sql_pair_id": sql_pair["id"],
                    "sql": sql_pair["sql"],
                    "project_id": project_id,
                },
                content=sql_pair["question"],  # 以问题作为内容进行向量化
            )
            for sql_pair in sql_pairs
        ]
        # 对问题内容进行向量化
        documents_with_embeddings = await self._embedder.run(documents)
        # 存储到向量数据库
        await self._document_store.write_documents(documents_with_embeddings)


检索阶段

# SQL样本检索过程
@observe(capture_input=False)
async def sql_pairs_retrieval(
    query: str,
    project_id: str,
    sql_pairs_retriever: Any,
    top_k: int = 3,  # 只检索最相关的3个样本
) -> dict:
    # 构建过滤条件，只检索当前项目的数据
    filters = {
        "operator": "AND",
        "conditions": [
            {"field": "project_id", "operator": "==", "value": project_id}
        ],
    }
    
    # 在向量数据库中检索最相关的SQL样本
    return await sql_pairs_retriever.run(
        query=query,
        filters=filters,
        top_k=top_k
    )

    3. 历史对话的向量检索
    历史对话的处理方式类似：

# 历史对话检索过程
@observe(capture_input=False)
async def history_retrieval(
    query: str,
    histories: List[dict],  # 用户的历史对话
    history_retriever: Any,
    top_k: int = 2,  # 只检索最相关的2轮对话
) -> dict:
    # 将历史对话转换为文档格式
    documents = [
        Document(
            id=str(uuid.uuid4()),
            meta={
                "question": history["question"],
                "sql": history["sql"],
            },
            content=history["question"],  # 以问题作为内容进行向量化
        )
        for history in histories
    ]
    
    # 对历史问题进行向量化
    documents_with_embeddings = await history_retriever.embedder.run(documents)
    
    # 检索最相关的对话历史
    return await history_retriever.run(
        query=query,
        documents=documents_with_embeddings,
        top_k=top_k
    )
4. 检索结果的使
检索到的结果会被用于构建提示模板

# 在意图分类中使用检索结果
async def intent_classification(
    query: str,
    db_schemas: List[str],
    sql_samples: List[dict],  # 检索到的SQL样本
    histories: List[dict],    # 检索到的历史对话
    instructions: List[dict], # 用户指令
    **kwargs,
) -> dict:
    # 构建提示模板，只包含检索到的相关内容
    prompt = build_intent_classification_prompt(
        query=query,
        db_schemas=db_schemas,
        sql_samples=sql_samples,
        histories=histories,
        instructions=instructions,
    )
    
    # 将提示发送给大语言模型
    return await classifier.run(prompt=prompt)

向量数据库的优势
1. 语义相似性匹配
传统的关键词匹配可能无法找到语义上相关但用词不同的内容，而向量检索可以
用户问题: "显示上个月的销售总额"
数据库中的样本问题: "上月销售数据统计"
虽然用词不同，但语义相似，向量检索可以匹配到    
2. 高效检索
向量数据库使用近似最近邻搜索（ANN）算法，能够在大规模数据中快速找到最相关的条目
3. 动态相关性排序
根据当前查询与历史内容的语义相似度进行动态排序，确保最相关的上下文优先提供给模型。
实际应用示例
假设系统中有以下SQL样本：
[
  {
    "question": "统计用户总数",
    "sql": "SELECT COUNT(*) FROM users"
  },
  {
    "question": "显示最近一周的订单",
    "sql": "SELECT * FROM orders WHERE created_at >= DATE_SUB(NOW(), INTERVAL 7 DAY)"
  },
  {
    "question": "计算产品销售总额",
    "sql": "SELECT SUM(price) FROM products"
  }
]

当用户问"查询上个月的订单数量"时：
1.系统将问题转换为向量
2.在向量数据库中搜索最相似的样本
3.找到"显示最近一周的订单"这个样本最相关
4.只将这个样本提供给大语言模型作为参考
### SQL SAMPLES ###
Question:
显示最近一周的订单
SQL:
SELECT * FROM orders WHERE created_at >= DATE_SUB(NOW(), INTERVAL 7 DAY)
这样既提供了有用的参考信息，又避免了提供过多不相关的上下文，有效控制了token消耗。
总结
智能检索机制通过以下步骤实现：
向量化：将文本内容转换为向量表示
存储：将向量和元数据存储在向量数据库中
检索：根据查询的向量表示，在数据库中查找最相似的条目
过滤：根据项目ID等条件进行过滤
限制：只返回最相关的top-k个结果
使用：将检索结果作为上下文提供给大语言模型
这种机制确保了系统能够高效地提供最相关的上下文信息，既提高了模型的准确性，又控制了token消耗

