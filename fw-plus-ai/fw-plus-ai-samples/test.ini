  2.第二阶段：详细处理（仅对需要的请求提供完整上下文    

成本与性能平衡
1. 成本考虑
   更多上下文 = 更高准确性 + 更高成本
   需要在准确性和成本之间找到平衡点
2. 性能优化
   使用更高效的嵌入模型进行检索
   缓存常用样本和摘要
   优化提示模板结构
3. 实际应用策略
   大多数实际系统会采用以下策略：
   限制历史对话轮数（通常2-5轮）
   限制样本数量（通常3-5个）
   对长SQL进行截断或摘要
   使用更紧凑的提示格式   

最佳实践建议
1. 智能截断
def truncate_context(context, max_length):
    if len(context) > max_length:
        return context[:max_length] + "..."
    return context
2. 优先级排序
# 上下文优先级：
# 1. 当前问题和数据库模式（必需）
# 2. 最近的历史对话（高优先级）
# 3. 相关的SQL样本（中优先级）
# 4. 用户指令（低优先级）
3. 动态调整
根据实际使用情况动态调整各部分的详细程度，确保在token限制内提供最有价值的信息。
总的来说，虽然SQL样本和历史对话确实会消耗大量token，但通过智能检索、限制数量、分层处理等优化策略，可以在保证效果的同时有效控制token消耗


