    result: pending
    reason: null
  - id: A36
    source: brief.md
    text: "Scenario: 流式对话——WHEN 用户端发起问数 THEN SSE 流式返回过程与最终数据/解读"
    result: pending
    reason: null
  - id: A37
    source: brief.md
    text: "Scenario: 图表切换——WHEN 返回结果后切换图表类型 THEN 按数据正确渲染表格/柱状/折线/饼图 ##
      图表与看板（nl2sql-chart-dashboard）"
    result: pending
    reason: null
  - id: A38
    source: brief.md
    text: "Scenario: LLM 图表推荐——WHEN 问数返回结果 THEN LLM
      依据结果自动产出图表配置（类型/轴，柱/条/线/饼/表），前端据此渲染"
    result: pending
    reason: null
  - id: A39
    source: brief.md
    text: "Scenario: 服务端出图——WHEN 需要图片形态（导出/非流式场景） THEN 服务端按图表配置渲染为 PNG（对齐 SQLBot
      g2-ssr 能力）"
    result: pending
    reason: null
  - id: A40
    source: brief.md
    text: "Scenario: 数据分页列表——WHEN 用户查看问数结果数据列表 THEN 后端按 page/size
      服务端分页返回当前页数据与总行数，翻页结果正确"
    result: pending
    reason: null
  - id: A41
    source: brief.md
    text: "Scenario: dashboard——WHEN 用户将多次问数结果保存到看板 THEN 看板按配置展示图表 ##
      集成（nl2sql-integrations）"
    result: pending
    reason: null
  - id: A42
    source: brief.md
    text: "Scenario: MCP 问数——WHEN MCP 客户端通过对外 API 服务的 MCP 接口调用问数能力 THEN
      返回与对话通道一致的问数结果（复用同一问数核心与配置）"
    result: pending
    reason: null
  - id: A43
    source: brief.md
    text: "Scenario: MCP 对外能力全覆盖——WHEN MCP 客户端通过 MCP 接口调用会话历史与图表数据能力 THEN 返回与
      REST/SSE 通道一致的结果（会话列表/消息历史、问数结果图表数据）"
    result: pending
    reason: null
  - id: A44
    source: brief.md
    text: "Scenario: Excel 导入——WHEN 导入 Excel 数据 THEN 生成可查询表并可问数"
    result: pending
    reason: null
  - id: A45
    source: brief.md
    text: "Scenario: API 对接——WHEN 业务方用自己的 UI 调用问数 API THEN
