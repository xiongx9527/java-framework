    - id: mysql57-fresh-full-manifest-persistence-e2e
      name:
        text: Isolated MySQL 5.7.44 fresh manifest persistence encryption and cleanup
        truncated: false
      argv_display:
        - text: -lc
          truncated: false
        - text: |-
            set -euo pipefail
            DATADIR=$(mktemp -d /tmp/tinyengine-runtime-mysql57.XXXXXX)
            SOCKET="$DATADIR/mysql.sock"
            PIDFILE="$DATADIR/mysql.pid"
            LOGFILE="$DATADIR/mysql.log"
            PORT=33307
            cleanup() {
              if [ -S "$SOCKET" ]; then mysqladmin -uroot --socket="$SOCKET" shutdown >/dev/null 2>&1 || true; fi
              python3 -c 'import shutil,sys; shutil.rmtree(sys.argv[1], ignore_errors=True)' "$DATADIR"
              git restore -- fw-plus-sample/fw-plus-ai-samples/fw-plus-ai-tiny-engine-sample/target
            }
            trap cleanup EXIT
            mysqld --initialize-insecure --datadir="$DATADIR" --log-error="$LOGFILE"
            mysqld --datadir="$DATADIR" --socket="$SOCKET" --port="$PORT" --bind-address=127.0.0.1 --pid-file="$PIDFILE" --log-error="$LOGFILE" --daemonize
            for i in $(seq 1 60); do
              if mysqladmin -uroot --socket="$SOCKET" ping --silent >/dev/null 2>&1; then break; fi
              if [ "$i" -eq 60 ]; then tail -100 "$LOGFILE"; exit 1; fi
              sleep 1
            done
            mysql -uroot --socket="$SOCKET" -e 'CREATE DATABASE tiny_engine_verify CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
            export TINY_ENGINE_MYSQL_TEST_URL="jdbc:mysql://127.0.0.1:${PORT}/tiny_engine_verify?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai"
            export TINY_ENGINE_MYSQL_TEST_USERNAME=root
            export TINY_ENGINE_MYSQL_TEST_PASSWORD=
            [REDACTED] JAVA_HOME=$(/usr/libexec/java_home -v 1.8)
            export PATH="$JAVA_HOME/bin:$PATH"
            mvn -f fw-plus-sample/fw-plus-ai-samples/fw-plus-ai-tiny-engine-sample/pom.xml \
              -Dtest=TinyEngineAiMysqlIntegrationTest,TinyEngineAiSampleApplicationTest#startsWithTinyEnginePersistenceAndAiWebEndpoint \
              -Dspring.datasource.url="$TINY_ENGINE_MYSQL_TEST_URL" \
              -Dspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver \
              -Dspring.datasource.username=root \
              -Dspring.datasource.password= [REDACTED]
              -Dfw.plus.tiny-engine.sql.database=mysql \
              -Dfw.plus.tiny-engine.sql.auto-initialize=true \
              clean test
          truncated: false
      argv_truncated: false
      cwd_ref: .
