  summary:
    text: kb/mcp 控制台三类报障修复完成。(1) i18n 根因：zh-cn.js/en.js 的 kb 段从 langchain4j
      命名空间提升至顶层（结构移动+整体 dedent 4 空格），对齐前端顶层 kb.* 引用；node doLocale 验证
      kb.dataset.title/kb.setting.title 中英命中，langchain4j.* 原有键不受影响。(2) MCP D7
      容错：MagicMcpServerController 新增 dynamicDataSource()/dynamicRegistry()
      安全获取（SpringUtils.getBeansOfType 自带 try-catch），list/defined 缺 Bean 时返回
      code:1+空列表+message 提示，datasourceTest/changeConnected/refresh 返回错误描述；样例实测
      /mcp/server/list 返回 {code:1,data:[],message:MCP server runtime
      未装配，返回空实例列表}，不再抛
      NoSuchBeanDefinitionException；MagicMcpDiagnosticController 的
      notifier.all() 已确认 null 安全。(3) 响应契约修复（Build 阶段新根因）：控制台 request.js 以
      data.code===1 为成功判定，KbConsoleController ok()/error() 由 200/500 改为
      1/-1；kb-service.js unwrap 重写（原实现返回对象却被当函数传给 .success 且误判
      res.code===200，双重缺陷导致知识库全部操作失败），29 处调用统一挂载 exception/error 使 Promise 必
      settle 交组件 catch 弹错，upload XHR 同步改判 code===1。(4) 补全缺失端点：DELETE|POST
      /kb/document/{id} 删除文档（前端删除按钮原调该路径 404），复用
      KbDocumentService.deleteDocument。(5) D6：index.js KB 入口恢复 adminOnly:true
      并更新过时注释。(6) MCP 前端 service 补 authProviders()（失败 resolve(null) 回退内置清单）。(7)
      两个 console dist 重建：CR 158228B、MCP 20945B，grep 证实含 adminOnly:true、kb
      顶层转义文案、/mcp/datasource/test、图标 symbol；Maven prepare-package 构建期重建已进
      target/classes 与 .m2 jar，运行实例 /magic-api/web/plugins/<iife> 返回
      200+158228B。全链 Core→Boot→AI clean install 成功；样例 :3199 实例 A1-A9 验收全通过：A1 kb
      三接口 code:1 非 404 且数据集创建+列出闭环；A2 前端 32 方法 vs 后端 41 映射逐一对照、无效 id 返回 code:-1
      业务错误 HTTP 200；A3 i18n 顶层命中+iife 转义文案；A4 /plugins 4 插件（content-retriever
      adminEnabled:true、隐身插件名/脚本空）+ 新 iife 200 可达；A5 MCP list 空列表容错；A6
      datasource test 错误描述不抛异常；A7 MCP iife 含 doTest 路径与图标 symbol；A8 四配置类
      auth-core 条件注解齐备+启动 0 NoSuchBeanDefinition/NoClassDefFound；A9 构建成功+样例 4
      插件。已知限制见 known_limits。
    truncated: false
