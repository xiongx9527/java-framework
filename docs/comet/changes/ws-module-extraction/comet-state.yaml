  summary:
    text: |-
      把 magic-api WS 插件里与 magic 无关的「WebSocket 地基」抽成新模块 fw-plus-boot-autoconfigure-web（包前缀 com.xiongx9527.fw.plus.boot.autoconfigure.web，地基置于 .web.ws），并为其定义 SPI；magic 侧包名与前端资源保持不变，只改为实现 SPI。

      新模块内容：WsConfig + WsConfigReader（仍为 HashMap + flatten()，前缀 fw.plus.ws.*，键名与缺省值逐项不变）；WsBaseService（配置读取 + JWT 签发/校验，token.secret / token.expireHours 语义不变）；SPI：WsBusinessDispatcher（existsApp / findEnabledSubscribes / execute）、WsSubscribeScript、WsInvocationContext（INIT/MESSAGE/CLOSE）、WsReplyHandle（结果回发句柄）、WsBasePathProvider、WsHandshakeInterceptor；AbstractWebSocketHandler（握手鉴权、会话注册表、心跳、定向发送/广播、异常与关闭清理，职责自原 BaseDynamicWebSocketHandler 平移）；SimpleWebSocketHandler / RedisWebSocketHandler（Redis 跨实例广播，对应原 RedisDynamicWebSocketHandler）；WsEndpointRegistrar；WsAutoConfiguration + WsRedisConfiguration（经自身 spring.factories 注册）。

      magic 侧变化：BaseDynamicWebSocketHandler 改为实现 WsBusinessDispatcher（订阅取自 magic 资源存储，执行走 magic-script），不再自行创建 handler Bean；删除 SimpleDynamicWebSocketHandler、RedisDynamicWebSocketHandler、MagicAPIWsHandlerConfiguration、MagicAPIWsConfig；MagicAPIWsConfiguration 不再实现 WebSocketConfigurer、不再建 handler/Redis 容器，改为装配 2 个 storage + 2 个 registry + WsModule + MagicWsController，并提供 wsBusinessDispatcher 与 wsBasePathProvider（沿用 magic-api.web 作基础路径）；MagicAPIHandshakeInterceptor 改为继承 WsHandshakeInterceptor；ws/common/BaseService 收敛为 extends WsBaseService, MagicBaseService；WsModule / MagicWsController / WsDataSourceMagicDynamicRegistry 的 handler 引用类型改为 AbstractWebSocketHandler；WsSubscribeInfo 实现 WsSubscribeScript。wsModule 上补 @DependsOn("springUtils")，补回 handler 下沉后丢失的初始化顺序保证。

      POM：新模块登记进聚合 POM 与 fw-plus-boot-dependencies BOM；fw-plus-boot-autoconfigure 增加对新模块的 optional compile 依赖；fw-plus-ws-spring-boot-starter 增加对新模块的依赖，仍作为 WS 能力对外入口。

      本轮收尾（在原 Task #4 接线之上）：① 删除两个孤儿 mqtt 测试（MagicMqttDashboardControllerTest / MqttDashboardServiceTest），它们引用的 magicapi.plugin.mqtt.model|service|web 在整个仓库已不存在，是历史提交遗留的死测试，且阻塞 testCompile，使 E4 无法无干预执行；② 补 A3 覆盖：新增 WsHandshakeAuthenticationTest(6 例，真实走 afterConnectionEstablished 按 token.secret 放行/拒绝)、WsRedisConfigurationTest(4 例，真实容器中断言处理器切换与监听器-广播频道绑定)、support/TestWebSocketSession 复用桩、报文契约测试(1 例)；③ 修复 WsRedisConfiguration 两处缺陷：移除 @DependsOn("redisWebSocketHandler") 硬依赖（宿主自备处理器时该 Bean 不存在会导致上下文启动失败），改为 getBeanProvider 柔性获取并仅对 RedisWebSocketHandler 绑定监听器；为 redisMessageListenerContainer 补 @ConditionalOnMissingBean，与同文件 redisWebSocketHandler 的扩展点保持一致。新模块测试 24 → 35。
    truncated: false
