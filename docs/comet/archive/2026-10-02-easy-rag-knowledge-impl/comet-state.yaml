    text: easy-rag 知识库全量实现（已按用户确认的 Shape 完成）：后端落在 content-retriever
      插件后端包（autoconfigure 的 langchain4j/retriever/knowledge
      子包），KnowledgeContentRetrieverProvider 放 retriever/provider 与既有 provider
      同层，经 ContentRetrieverProviderRegistry 收集注册为短名 knowledge，build 返回
      KnowledgeContentRetriever（ContentRetriever
      实例，懒解析数据集）。实现：三表实体/Mapper（MapperFactoryBean 显式注册）、service
      层（数据集/文档/分段/索引管道/检索）、CAS 认领状态机
      waiting→parsing→splitting→indexing→completed|error、KbIndexingExecutor（核心2+有界队列+CallerRunsPolicy+30s
      轮询兜底）、DocumentPipeline（Tika 解析+recursive 切分+分隔符预切）、ParentChildSplitter
      父子分段、QaExtractor（预留）、向量批量写入（InMemoryEmbeddingStore
      测试验证）、启禁/归档以表为权威内存过滤、hit_count 异步累加、Dify /v1/external/knowledge/retrieval
      兼容（error_code 1002/2001、metadata 恒为对象）、KbSaTokenAuthChecker（Bearer
      token→StpUtil）、KbConsoleController（/kb/** 随 magic 鉴权，写接口兼容
      POST）、KbOpenApiController（/v1/**）、KnowledgeModule（import knowledge
      脚本入口）。前端：content-retriever 插件 console 同一 iife.js 增加 toolbars kb-browser
      管理页（数据集/文档/分段/召回测试四视图）+ knowledge 类型表单（dataset-id 动态拉取数据集列表）+ 中英
      i18n。装配：KnowledgePluginConfiguration @Import 进
      Langchain4jDatasourceConfiguration，@ConditionalOnClass+@ConditionalOnBean(SqlSessionFactory)、fw.plus.ai.knowledge.enabled
      总开关、启动校验三表存在性缺失警告禁用。DDL 落地 META-INF/sql/fw-plus-ai-knowledge.sql（含确认的
      segment_mode 字段）。pom：autoconfigure 补 fw-plus-mp-base 与 mybatis-plus（均
      optional）。实现已提交 936157ca，覆盖 brief A1–A17 全部验收项。
