  summary:
    text: 本轮实现全部范围。改动一、AI 层 reactive 装配链（A1/A2/A3）：MagicAPIBaseAutoConfiguration 去
      SERVLET 条件改为环境无关入口，@AutoConfigureAfter 追加 Boot 层 Base（reactive 下
      MagicResourceService 先注册）；新增
      magicapi/webflux/MagicAPIWebFluxConditionalConfiguration（字符串条件桥）、MagicAPIWebFluxPluginAutoConfiguration（REACTIVE
      +
      @ConditionalOnBean(MagicAPIWebFluxMapping)）、MagicAPIWebFluxPluginControllerRegistrar（SmartInitializingSingleton，BeanProvider
      门控注册 langchain4j 4 控制器 + mcp 2 控制器）。改动二、mongo
      前缀修复（A5）：MagicAPIMongoConfiguration @ConditionalOnProperty 前缀
      mogno→mongo，MagicAPIServletIsolationAutoConfigurationTest 属性同步。改动三、swagger
      重构统一（A6）：MagicSwaggerConfiguration 合并为栈无关单配置类（去 SERVLET 条件，ServletContext
      改 ObjectProvider 可选注入，contextPath 优先 magic-api.swagger.context-path），新增统一
      web/MagicSwaggerController（懒初始化 provider 避免循环依赖，双栈探测 registry 视图），servlet
      走 controllerRegister() 编程注册（占位符解析后）、webflux 走
      MagicAPIWebFluxControllerRegistrar swagger 分支（空 base）；删除
      MagicSwaggerWebFluxController/Configuration，spring.factories 与
      AutoConfiguration.imports 条目指向统一配置类（SERVLET 下与
      MagicApiPluginAutoConfiguration Import 链自动去重）；MagicSwaggerControllerTest（原
      MagicSwaggerWebFluxTest 迁移改名）11 用例。改动四、测试与文档（A7）：新增 AI reactive 契约测试
      MagicAPIWebFluxPluginAutoConfigurationTest（聚合根 @Import 保序解决条件评估顺序，断言 6 端点带
      /magic-api/web 前缀注册、插件 bean 装配、servlet 激活）；fw-plus-ai README
      双语补双栈说明。处理验收项：A1-A3（reactive 生效，测试断言 6 端点注册+bean 装配）、A4（servlet
      回归：装配链条件与改动前语义一致，Boot 634 测试全绿）、A5（两处修正+测试通过）、A6（11 用例含双栈注册/HTTP
      访问/location 覆盖/开关/插件清单）、A7（见 checks）。已运行检查：AI 层全量 484 tests（新增 3
      个全过）；基线对比（stash 改动后跑基线）确认 12 failures+1 error 与改动前完全一致，零新增失败——全部为
      langchain4j datasource 体系既有失败（本地 ~/.m2 factory 覆盖依赖过期）；Boot 层全量 634 tests
      全绿（含 mongo 修复与 swagger 重构回归）；sample MagicApiAllPluginsClasspathTest 2/2
      通过。已知限制：sample MagicApiAllPluginsApplicationContextTest 4 个 error 为 dev
      在途提交 71546588（ws enabled 缺省关闭，在途）既有缺陷，与本 change 无关（未触碰 ws）；AI 层既有
      langchain4j 失败源于本地仓库依赖过期，与本次改动无关；WebFlux 下 WebSocket 在线调试不可用为 Boot
      层既有边界。全部源码改动未提交（Builder 候选实现待 Verifier）。
    truncated: false
