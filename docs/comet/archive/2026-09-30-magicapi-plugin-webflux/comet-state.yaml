      /langchain4j/system-message/execute`；其中 B 类端点（content-injector /
      system-message 的 `MagicHttpServletRequest` 参数）由 Boot
      `WebFluxMagicAPIArgumentResolver` 适配，无需改动控制器。"
    result: passed
    reason:
      text: Registrar 按 6 个门控 bean 注册 langchain4j 端点，ai-tests 最新日志 447 tests
