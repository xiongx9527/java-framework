  summary:
    text: |-
      本轮（iteration 2）只做一处修复，用于让 A7 真正成立；iteration 1 的 starter 抽取与配置前缀迁移保持不变。

      修复背景：独立验收发现既有缺陷——WS 配置读路径是 MagicAPIWsConfig（@ConfigurationProperties("fw.plus.ws")，extends HashMap<String,Object>）+ MagicBaseService#getConfigValue 的 configMap.get("token.secret") 这类点号扁平键；而 Spring Boot 将嵌套 YAML（fw.plus.ws.token.secret）绑定进 Map<String,Object> 时得到的是嵌套 Map（{token={secret=...}}），扁平键取不到值，导致 getWebsocketPath() 回落 /ws/api、getTokenExpireHours() 回落 2、getTokenSecret() 抛 IllegalStateException。该缺陷与前缀改名无关（旧前缀下同样存在），但 A7 要求「值被绑定并在 token 签发、端点注册、连接参数解析中生效」，因此必须修复。

      本轮改动（2 个文件，均在 fw-plus-boot-autoconfigure 的 magicapi/plugin/ws 包内，未触碰共享代码）：
      ① MagicAPIWsConfig 新增 public Map<String,Object> flatten()，递归把嵌套 Map 展开为点号扁平键（叶子值原样保留；空 Map 不产生条目；null 跳过），并新增私有静态 flattenInto(prefix, source, target)。
      ② ws common/BaseService#getConfig() 由「直接返回配置 Bean」改为「返回 config.flatten()」，使 getConfigValueAsString("token.secret") 这类扁平键读取可以命中嵌套写法；键名层级与默认值（enabled 缺省启用、websocket.path 缺省 /ws/api、token.expireHours 缺省 2 等）完全不变。

      iteration 1 的实现（保持有效）：① 新增纯 POM 模块 fw-plus-ws-spring-boot-starter（只含依赖声明，无 src/、无 Java、无 auto-configuration、无 spring.factories）；依赖 fw-plus-boot-starter + spring-boot-starter-websocket + jjwt-api/impl/jackson，父 POM 为 fw-plus-boot-starters，版本 ${revision}。② fw-plus-boot-starters/pom.xml 增加该模块；fw-plus-boot-dependencies 的 dependencyManagement 增加该 starter（${project.version}）。③ fw-plus-magicapi-plugin-ws/pom.xml 改为依赖该 starter，删除本模块 3 个 jjwt 声明；src/console 前端与 src/main/resources/magic-editor/ws 资源及前端构建配置未改动。④ WS 的 Java 实现未迁移，仍在 fw-plus-boot-autoconfigure 的 magicapi/plugin/ws 包，包名/类名/MagicApiPluginAutoConfiguration 的 @Import 均未变。⑤ 配置前缀迁移：两个 @ConditionalOnProperty 前缀与 @ConfigurationProperties 均改为 fw.plus.ws；BaseService 异常文案改为 fw.plus.ws.token.secret must be configured；MagicAPIServletIsolationAutoConfigurationTest 中属性改为 fw.plus.ws.enabled=false；README 的 yaml 示例、配置表与安全建议改为 fw.plus.ws 前缀并注明旧前缀不再被读取。

      处理的验收项：A1~A8 全部提交验收。

      实际运行的开发期检查：fw-plus-boot-project 全层 mvn -Dmaven.test.skip=true -Dexec.skip=true install 成功（reactor 中 fw-plus-ws-spring-boot-starter SUCCESS）；fw-plus-magicapi-spring-boot-starter-sample 编译成功；对 fw-plus-magicapi-plugin-ws 执行 dependency:tree，确认 fw-plus-ws-spring-boot-starter:0.1.1-SNAPSHOT 下带出 spring-boot-starter-websocket:2.7.18 与 jjwt-api/impl/jackson:0.12.7；starter 目录仅 pom.xml（+.flattened-pom.xml/target）且已在 starters modules 与 BOM 登记；全仓 src/main 检索 magic-api.plugin.ws 残留 0 处（仅剩 README 迁移说明、测试注释与 change 文档）；运行时探针以真实 SpringApplication + 真实 application.yml 分别以新/旧前缀提供同一组配置：新前缀 BOUND 收到该子树且读取生效（getWebsocketPath=/custom-ws、getTokenExpireHours=7、getTokenSecret=s3cr3t-value、getClientIdParamName=cid-x），仅旧前缀时 BOUND={} 且回落默认值（/ws/api、2、token.secret 未配置抛异常）。

      未运行的开发期检查：未运行任何单元测试（fw-plus-boot-autoconfigure 的测试源码因 mqtt 包遗留测试引用已迁移的包而无法编译，属既有问题，与本次无关；故所有 Maven 操作使用 -Dmaven.test.skip=true）。另已完成一次独立只读复核（执行标识 agent-c08e6ff8），复核对本轮修复判定通过，并确认 getConfig() 的调用方均为只读扁平键读取、无写操作、不波及 vue3/mqtt 等其它插件。
    truncated: false
  addressed_acceptance_ids:
