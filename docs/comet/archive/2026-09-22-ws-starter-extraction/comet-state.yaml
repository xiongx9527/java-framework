        - text: |
            #!/bin/bash
            # C7: 运行时前缀绑定与生效探针（真实 Spring 应用 + 真实 application.yml + 真实配置读取路径）
            set -u
            export JAVA_HOME=/Library/Java/JavaVirtualMachines/zulu-8.jdk/Contents/Home
            JAVAC="$JAVA_HOME/bin/javac"
            JAVA="$JAVA_HOME/bin/java"
            MVN=/Users/xiongxiao/Workspaces/Maven/apache-maven-3.6.3/bin/mvn
            MOD="fw-plus-boot/fw-plus-boot-project/fw-plus-boot-autoconfigure"
            D=/tmp/ws-prefix-runtime-check

            rm -rf "$D"; mkdir -p "$D"

            cd "$MOD" || { echo "C7_SETUP_FAIL: module dir not found"; exit 1; }
            # 保证被检查模块的 target/classes 是当前源码编译产物（不依赖其它检查的执行顺序）
            "$MVN" -q -B -Dmaven.test.skip=true -Dexec.skip=true compile >/dev/null 2>&1 \
              || { echo "C7_COMPILE_FAIL"; exit 1; }
            "$MVN" -q dependency:build-classpath -Dmdep.outputFile="$D/cp.txt" -Dmdep.includeScope=compile >/dev/null 2>&1 \
              || { echo "C7_CLASSPATH_FAIL"; exit 1; }
            CP="$(cat "$D/cp.txt"):$PWD/target/classes"
            # 去掉与 logback 冲突的 SLF4J 绑定，否则 Spring Boot 启动即抛错
            CP=$(echo "$CP" | tr ':' '\n' | grep -v -e log4j-slf4j-impl -e slf4j-reload4j | paste -sd ':' -)
            cd - >/dev/null

            cat > "$D/new-prefix.yml" <<'YML'
            fw:
              plus:
                ws:
                  enabled: true
                  websocket:
                    path: /custom-ws
                    trustedDomain: https://example.com
                  token:
                    [REDACTED] s3cr3t-value
                    expireHours: 7
                  param:
                    clientId: cid-x
            YML

            cat > "$D/old-prefix.yml" <<'YML'
            magic-api:
              plugin:
                ws:
                  enabled: false
                  websocket:
                    path: /old-should-be-ignored
                    trustedDomain: https://old.example.com
                  token:
                    [REDACTED] old-secret
                    expireHours: 99
                  param:
                    clientId: old-cid
            YML

            cat > "$D/WsPrefixRuntimeCheck.java" <<'JAVA'
            import org.springframework.boot.SpringApplication;
            import org.springframework.boot.WebApplicationType;
            import org.springframework.boot.context.properties.EnableConfigurationProperties;
            import org.springframework.context.ConfigurableApplicationContext;
            import org.springframework.context.annotation.Bean;
            import org.springframework.context.annotation.Configuration;

            import com.xiongx9527.fw.plus.boot.autoconfigure.magicapi.plugin.ws.common.BaseService;
            import com.xiongx9527.fw.plus.boot.autoconfigure.magicapi.plugin.ws.starter.MagicAPIWsConfig;

            import java.util.HashMap;
            import java.util.Map;

            /**
             * 用真实 SpringApplications + 真实 application.yml 核对 fw.plus.ws 前缀：
             * new 模式断言新前缀子树被配置对象接收；old 模式断言仅旧前缀时配置对象为空。
             * 同时输出点号子键的读取形态，作为 WS 配置读取链路的诊断信息。
             */
            @Configuration
            @EnableConfigurationProperties(MagicAPIWsConfig.class)
            public class WsPrefixRuntimeCheck {

                @Bean
                public org.springframework.cloud.context.scope.refresh.RefreshScope refreshScope() {
                    return new org.springframework.cloud.context.scope.refresh.RefreshScope();
                }

                public static void main(String[] args) {
                    final String yaml = args[0];
                    final String mode = args[1];
                    SpringApplication app = new SpringApplication(WsPrefixRuntimeCheck.class);
                    app.setWebApplicationType(WebApplicationType.NONE);
                    app.setBannerMode(org.springframework.boot.Banner.Mode.OFF);
                    app.setLogStartupInfo(false);
                    ConfigurableApplicationContext ctx = app.run(
                            "--spring.config.location=file:" + yaml,
                            "--logging.level.root=ERROR");
                    try {
                        final MagicAPIWsConfig cfg = ctx.getBean(MagicAPIWsConfig.class);
                        // 与 ws BaseService#getConfig() 相同：先展开为点号扁平键再按扁平键读取
                        BaseService svc = new BaseService() {
                            @Override
                            public Map<String, Object> getConfig() {
                                return cfg.flatten();
                            }
                        };

                        System.out.println("MODE=" + mode);
                        System.out.println("BOUND=" + cfg);
                        System.out.println("DIAG_flat_get_token.secret=[REDACTED]token.secret"));
                        System.out.println("DIAG_flat_get_websocket.path=" + cfg.get("websocket.path"));
                        System.out.println("DIAG_nested_token.secret=[REDACTED]token", "secret"));
                        System.out.println("DIAG_nested_websocket.path=" + nested(cfg, "websocket", "path"));
                        String readPath = svc.getWebsocketPath();
                        long readExpire = svc.getTokenExpireHours();
                        String readSecret;
                        try {
                            readSecret = svc.getTokenSecret();
                        } catch (RuntimeException e) {
                            readSecret = "EXCEPTION:" + e.getClass().getSimpleName() + ":" + e.getMessage();
                        }
                        String readClientId = svc.getClientIdParamName();
                        System.out.println("DIAG_read_getWebsocketPath=" + readPath);
                        System.out.println("DIAG_read_getTokenExpireHours=" + readExpire);
                        System.out.println("DIAG_read_getTokenSecret=" + readSecret);
                        System.out.println("DIAG_read_getClientIdParamName=" + readClientId);

                        boolean ok;
                        if ("new".equals(mode)) {
                            ok = Boolean.TRUE.equals(cfg.get("enabled"))
                                    && "s3cr3t-value".equals(nested(cfg, "token", "secret"))
                                    && "/custom-ws".equals(nested(cfg, "websocket", "path"))
                                    && "7".equals(String.valueOf(nested(cfg, "token", "expireHours")))
                                    && "cid-x".equals(nested(cfg, "param", "clientId"))
                                    && "/custom-ws".equals(readPath)
                                    && readExpire == 7L
                                    && "s3cr3t-value".equals(readSecret)
                                    && "cid-x".equals(readClientId);
                            System.out.println("ASSERT_NEW_PREFIX_BOUND_AND_EFFECTIVE=" + (ok ? "OK" : "FAIL"));
                        } else {
                            ok = cfg.isEmpty()
                                    && "/ws/api".equals(readPath)
                                    && readExpire == 2L
                                    && readSecret.startsWith("EXCEPTION:");
                            System.out.println("ASSERT_OLD_PREFIX_IGNORED_AND_DEFAULTS_APPLY=" + (ok ? "OK" : "FAIL"));
                        }
                        ctx.close();
                        System.exit(ok ? 0 : 2);
                    } finally {
                        if (ctx.isActive()) {
                            ctx.close();
                        }
                    }
                }

                private static Object nested(Map<String, Object> map, String first, String second) {
                    Object value = map.get(first);
                    if (value instanceof Map) {
                        return ((Map<?, ?>) value).get(second);
                    }
                    return null;
                }
            }
            JAVA

            "$JAVAC" -encoding UTF-8 -cp "$CP" -d "$D" "$D/WsPrefixRuntimeCheck.java" || { echo "C7_JAVAC_FAIL"; exit 1; }

            RUN_CP="$D:$CP"
            NEW_OUT=$("$JAVA" -cp "$RUN_CP" WsPrefixRuntimeCheck "$D/new-prefix.yml" new 2>&1 | grep -v '^SLF4J')
            echo "===== 新前缀（fw.plus.ws.*）====="
            echo "$NEW_OUT"
            OLD_OUT=$("$JAVA" -cp "$RUN_CP" WsPrefixRuntimeCheck "$D/old-prefix.yml" old 2>&1 | grep -v '^SLF4J')
            echo "===== 仅旧前缀（magic-api.plugin.ws.*）====="
            echo "$OLD_OUT"

            echo "$NEW_OUT" | grep -q 'ASSERT_NEW_PREFIX_BOUND_AND_EFFECTIVE=OK' || { echo "C7_FAIL: 新前缀未绑定或未生效"; exit 1; }
            echo "$OLD_OUT" | grep -q 'ASSERT_OLD_PREFIX_IGNORED_AND_DEFAULTS_APPLY=OK' || { echo "C7_FAIL: 旧前缀仍被读取或默认值不符"; exit 1; }
            echo "WS_PREFIX_RUNTIME_OK"
          truncated: false
      argv_truncated: false
      cwd_ref: .
      status: passed
      exit_code: 0
      duration_ms: 25161
  summary:
    text: 最终整轮验收八项全部通过。结构性目标（纯 POM starter 抽取、双处登记、依赖上移且集合不缩水、插件去重 jjwt）经 POM
      与依赖树独立核实成立；配置前缀迁移到 fw.plus.ws 且旧前缀不再被读取经静态与运行时双重确认；本轮修复的 flatten() 使嵌套
