            grep -q '"name": "fw.plus.ws"' "$M" || { echo "C6_FAIL: 元数据未登记 fw.plus.ws 组"; exit 1; }
            grep -q 'magic-api.plugin.ws' "$M" && { echo "C6_FAIL: 元数据仍含旧前缀"; exit 1; }
            grep -q 'fw.plus.ws.token.secret must be configured' $W/common/BaseService.java || { echo "C6_FAIL: 异常文案未迁移"; exit 1; }
            grep -q 'config.flatten()' $W/common/BaseService.java || { echo "C6_FAIL: getConfig() 未使用展开后的扁平键配置"; exit 1; }
            grep -q 'public Map<String, Object> flatten()' $W/starter/MagicAPIWsConfig.java || { echo "C6_FAIL: 配置类缺少嵌套展开方法"; exit 1; }
