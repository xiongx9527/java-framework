acceptance:
  - id: A1
    source: brief.md
    text: A1（H1）：reactive 应用启动后 `GET /doc.html` 返回 200（或框架定义的 3xx 重定向到
      UI），WebTestClient 断言，非类路径资源断言。
    result: passed
    reason:
      text: MagicSwaggerWebFluxTest:168-176 servesKnife4jDocHtmlInReactiveApplication
        为应用上下文级 WebTestClient 真实 HTTP 断言（GET /doc.html → 200，经资源 WebHandler 服务
        knife4j-openapi3-ui 的 META-INF/resources/doc.html），非类路径断言；Runtime 契约回执
        MagicSwaggerWebFluxTest 12/12、总 15/15、BUILD SUCCESS。
      truncated: false
  - id: A2
    source: brief.md
    text: A2（H2）：单测以固定 `ApiInfo`（如 path `/demo/hello`、method GET）经
      `MagicApiRegistryView` 供给，断言 `swaggerJson().getPaths()` 含 `prefix +
      groupPath + /demo/hello` 形态的键、`basePath` 为 contextPath、无 `/magic-api/web`
      前缀。
    result: passed
    reason:
      text: SwaggerEndpointSupportTest:35-48 以固定
        ApiInfo（path=/hello、groupPath=demo）经函数式 MagicApiRegistryView 供给，断言 paths
        hasSize(1)、键
        endsWith(/demo/hello)、doesNotContain(/magic-api/web)、basePath 为空，与
        SwaggerProvider:80 的路径构造逻辑精确对应，直接覆盖 spec「paths 包含已注册接口且无 base 前缀」场景。
      truncated: false
  - id: A3
    source: brief.md
    text: A3（H3）：两条支线的配置类在对应 runner 下均产生 `magicSwaggerUiConfigProperties` 与
      `magicSwaggerUiConfigParameters` bean；`getConfigParameters()` 的 `urls` 含
      `magic-api.swagger.name` 分组且指向 `magic-api.swagger.location`；servlet
      侧既有契约不回归（端点路径/内容/时机不变）。
    result: passed
    reason:
      text: 两配置类对称移除 import 与
        @ConditionalOnMissingBean(SwaggerUiConfigParameters.class)（类型矛盾确认）；SwaggerEndpointSupportTest:50-69
        以 WebApplicationContextRunner/ReactiveWebApplicationContextRunner 双栈断言两个
        UI bean 存在且 getConfigParameters urls 含 magic-api.swagger.name 分组指向
        location；servlet 端点注册/内容/时机代码零改动，magicapi 全包 397/397 无回归，H3 的 servlet
        行为变化已在 Shape 确认。
      truncated: false
