acceptance:
  - id: A1
    source: brief.md
    text: '**A1** 样例启动（知识库装配，H2 + schema-h2.sql）后，`GET
      /magic-api/web/kb/dataset`、`GET /magic-api/web/kb/settings`、`GET
      /magic-api/web/kb/openapi-auth-providers` 返回 `{"code":1,...}` 而非 404；`POST
      /kb/dataset`（键为合法表单）创建后 `GET /kb/dataset` 可列出。（Build 阶段根因修正：控制台
      `request.js` 以 `data.code === 1` 为成功判定，`ok()` 必须返回 code=1，旧值 200
      会让控制台全部请求走全局异常分支。）'
    result: passed
    reason:
      text: 3199 上 GET kb/dataset、kb/settings、kb/openapi-auth-providers 均
        200+code:1；POST 创建 verify-a1-ds 后 GET 列出成功（测试数据已清理）
      truncated: false
  - id: A2
    source: brief.md
    text: '**A2** `KbConsoleController` 其余路径按能力规格 §3.1
      全量可访问：hitTest、preview-split、import/export、document（upload/reindex/enabled/archived/metadata/segment/move/download/delete）、segment（enabled/update/delete）、settings
      等；任意存在路径不再返回 404，无效 id 返回业务错误而非 404。（Build 阶段补全：`DELETE|POST
      /kb/document/{id}` 删除文档端点，前端删除按钮原调该路径但后端缺失。）（Build iteration-2 根因修复：规格
      §3.1 规定数据集/分段的更新与删除同为 `POST /{kb|...}/dataset|segment/{id}`、以 body 是否为空对象
      `{}` 区分，原实现拆成 update `{PUT,POST}` 与 delete `{DELETE,POST}` 两个 handler，POST
      歧义触发 Spring "Ambiguous handler methods" 一律 500，控制台编辑/删除数据集与分段不可用；现改为单
      handler `{PUT,DELETE,POST}` 内按 method + body 分发——DELETE 或 POST+空 body
      走删除，否则走更新。）'
    result: passed
    reason:
      text: dataset/segment 各两组 POST（{}与数据体）及 PUT/DELETE 无效 id 全 200+code:-1，无
        500/Ambiguous；真实闭环创建→POST 改名（名称变、条数不减）→POST {} 删除→消失；源码每路径仅一个
        {PUT,DELETE,POST} handler + isDeleteInvocation
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3** `zh-cn.js`/`en.js` 含前端实际使用的全部 `kb.*` 键（含
      `kb.dataset.title`、`kb.empty`），且 `kb` 段位于字典**顶层**（与前端
      `i18n.format('kb.*')` 引用同层，历史缺陷是嵌在 `langchain4j` 命名空间下导致查不到而显示原始 key）；重建后的
      `dist/magic-langchain4j-content-retriever.*.iife.js` 中可 grep 到对应文案（esbuild
      默认 charset 将中文转义为大写 `\\uXXXX` 形式，如 `知识库` = `\\u77E5\\u8BC6\\u5E93`），不再显示原始
      key。"
    result: passed
    reason:
      text: zh-cn/en 顶层 kb 段含 dataset.title=知识库/Knowledge Base、empty；127 个前端实际引用 kb.*
        键中英 0 缺失；dist iife 含 i18n.add(zh-cn) 与 \u77E5\u8BC6\u5E93 文案
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4** 重建后的 content-retriever iife 被控制台加载（`/magic-api/web/plugins` 中
      `langchain4j-content-retriever` 指向该产物），toolbars
      出现「知识库」入口并可打开（数据集/文档/分段/召回测试/设置视图）。"
    result: passed
    reason:
      text: /plugins 返回 4 插件，content-retriever 指向新 iife 且 adminEnabled:true；iife HTTP
        200、md5 与本地 dist 一致，含 kb-browser 工具栏入口与知识库标题
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5** MCP 控制台接口不再抛 `NoSuchBeanDefinitionException`：`GET
      /magic-api/web/mcp/server/list` 在 MCP 插件装配时返回运行实例列表；未装配时返回空列表或明确提示。"
    result: passed
    reason:
      text: GET /mcp/server/list 返回 {code:1,data:[],message:MCP server runtime
        未装配…}，启动日志与响应无 NoSuchBeanDefinitionException
      truncated: false
  - id: A6
    source: brief.md
    text: '**A6** `POST /magic-api/web/mcp/datasource/test` 按控制台表单真实装配并经传输探测后返回
      `"ok"` 或错误描述；不落库、不注册、不影响运行中实例。'
    result: passed
    reason:
      text: POST /mcp/datasource/test 返回 code:1 错误描述（未装配降级分支），随后 list 不含
        verify-mcp，不落库不抛异常
      truncated: false
  - id: A7
    source: brief.md
    text: "**A7** 重建后的 `dist/magic-mcp-server.*.iife.js` 包含新 datasource
      service（doTest 调 `/mcp/datasource/test`）与 `magic-mcp-server` 图标 symbol；控制台
      `mcp-server` 类型 datasource 可打开并执行「测试连接」。"
    result: passed
    reason:
      text: mcp dist iife 含 /mcp/datasource/test、magic-mcp-server 图标 symbol 与
        authProviders；服务端下发文件 md5 与 dist 一致，HTTP 200
      truncated: false
  - id: A8
    source: brief.md
    text: "**A8** auth-core optional
      场景：`KnowledgeConfiguration`、`MagicAPIMcpServerConfiguration`、`McpAutoConf\
      iguration`、`WsAutoConfiguration` 均以 classpath 条件纳入
      `InstanceAuthRegistry`；条件评估匹配（样例含 auth-core），缺失时整类降级不装配、不抛
      `NoClassDefFoundError`。"
    result: passed
    reason:
      text: 四配置类均核到含 InstanceAuthRegistry 的 @ConditionalOnClass classpath 条件；启动日志
        NoClassDefFound/BeanCreationException 计数 0
      truncated: false
  - id: A9
    source: brief.md
    text: "**A9** 全仓 `./mvnw compile`（或分层增量）通过；`ai-magicapi-sample`
      可启动，`/magic-api/web/plugins` 正常返回 4
      个插件（s3/mcpserver/langchain4j-content-retriever/langchain4j-knowledge）。"
    result: passed
    reason:
      text: 构建日志 3 处 BUILD SUCCESS、0 FAILURE；.m2 autoconfigure jar 为今日产物；运行实例 /plugins
        返回 s3/mcpserver/content-retriever/knowledge 4 插件
      truncated: false
  - id: A10
    source: brief.md
    text: "**A10** 交付 commit 不含 `.flattened-pom.xml`、`.DS_Store` 等生成噪音与 eureka
      样例无关调整。"
    result: passed
    reason:
      text: git show 62739e97 共 46 文件无生成噪音与 eureka 样例调整；845bbde7 仅 brief.md 与
        KbConsoleController 两文件
      truncated: false
