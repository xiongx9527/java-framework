acceptance:
  - id: A1
    source: brief.md
    text: "**A1｜新键绑定与缺省**：`fw.plus.ws.path` / `fw.plus.ws.paths` 可按列表绑定，未配置时取内置默认
      `/ws/api` 与空列表；未配 `servers` 时端点集合、会话 appId 与订阅派发和改造前完全一致。"
    result: passed
    reason:
      text: WsConfig 顶层 path 默认 /ws/api、paths
        默认空列表（WsConfig.java:43,51）；WsConfigBindingTest
        缺省/单值/列表三组断言绑定正确；WsAutoConfigurationTest 与 MagicAPIWsWiringTest 确认未配
        servers 时端点集合与 appId 行为和改造前一致；Runtime ws-package-tests 回执 exit_code 0。
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2｜旧键完全失效**：写 `fw.plus.ws.websocket.path=/ws/legacy` 时端点取顶层 `path`
      的值（未配则是内置默认
      `/ws/api`），旧键既不生效、不告警也不参与取值；`websocket.paths`、`websocket.endpoint`、`webso\
      cket.basePath` 同理。"
    result: passed
    reason:
      text: Websocket 内嵌类（WsConfig.java:174-191）已无
        path/paths/endpoint/basePath；WsConfigBindingTest#legacyWebsocketEndpointKeysShouldNotBind（:106-120）写四个旧键后取顶层值、flatten
        不含旧键；WsBaseService.java:110、WsEndpointPathResolver.java:73、WsInstanceValidator.java:54-55
        均改读顶层；全局 grep 无旧键读取残留与告警桩。
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3｜空串语义保留**：`fw.plus.ws.path`
      显式置空串时默认实例端点集合退化为「只按基础路径注册」（含只在基础路径后追加一个连接斜杠的口径），与改造前对旧键置空的表现逐条一致，webmvc 与
      webflux 两栈相同。"
    result: passed
    reason:
      text: WsConfigBindingTest#explicitEmptyPathShouldBindAsEmptyString（:95-102）绑定层锁定空串且不回退；WsEndpointPathResolverTest（:33-36,:48）确认只按基础路径注册且只补一个连接斜杠；webflux
        装配级
        WsWebFluxAutoConfigurationTest#reactiveBlankPrimaryPathShouldFollowBasePathOnly（:77-85）断言
        /gateway/；两栈共用同一
        resolver（WsEndpointRegistrar.java:147-158、WsWebFluxAutoConfiguration.java:85-95）。
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4｜`websocket:` 只剩握手参数**：`Websocket` 中
      `path`、`paths`、`endpoint`、`basePath` 四个字段全部删除，全仓无任何代码或文档再出现
      `fw.plus.ws.websocket.path` / `websocket.paths` / `websocket.endpoint` /
      `websocket.basePath`；`WsBasePathProvider` javadoc 不再声称存在读取
      `websocket.basePath` 的默认实现。"
    result: passed
    reason:
      text: WsConfigBindingTest#websocketShouldOnlyCarryHandshakeParameters（:161-172）反射断言
        Websocket 仅剩 subProtocols/supportsPartialMessages/trustedDomain；全仓旧键
        grep 命中均属允许例外：starter README:185 迁移说明、WsConfigBindingTest:108-119
        负向用例、canonical spec:46,99,152 描述移除后行为、docs/comet 工件与归档；MagicWsController
        /ws/execute 为 HTTP 控制器路由非配置键；WsBasePathProvider.java:6 javadoc 已无失实描述。
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5｜扁平键与读取侧**：`flatten()` 只产出
      `path`、`paths`、`websocket.trustedDomain`、`websocket.subProtocols`、`websoc\
      ket.supportsPartialMessages` 这几个端点与握手键；`WsBaseService.getWebsocketPath()`
      读 `path` 且返回类型不变，magic-api ws 插件取到的配置值不变。"
    result: passed
    reason:
      text: flatten()（WsConfig.java:103-107）恰产出
        path/paths/websocket.trustedDomain/websocket.subProtocols/websocket.supportsPartialMessages；WsConfigBindingTest#flattenShouldExposeEveryContractKey（:188-208）锁定全键集、#serversShouldNotEnterFlattenedKeys（:150-158）确认
        servers 不进扁平键；WsBaseService.getWebsocketPath()（:109-111）读 path、返回 String
        不变，WsBaseServiceTest 缺省 /ws/api；MagicAPIWsWiringTest 确认插件取到的
        /magic-api/ws/api 不变。
      truncated: false
  - id: A6
    source: brief.md
    text: "**A6｜文档与样例同步**：starter README、magicapi-plugin-ws README、样例
      `application.yml` 与样例 README 一律写成顶层 `path`/`paths` + `websocket:`
      只留握手参数，并标注旧键已移除及迁移写法；样例 javadoc 的失效 token 说明被更正。"
    result: passed
    reason:
      text: starter README:27-37/:52-56/:185、magicapi-plugin-ws
        README:14-17/:26-27/:36/:88-89/:171/:181/:194、样例
        application.yml:9-11/:17-19、样例 README:24 全部写成顶层 path/paths + websocket
        只留握手参数并标注旧键移除与迁移写法；样例 javadoc 已删除失效的 token 签发说明（git diff
        a71713f3..0abae46d）。
      truncated: false
  - id: A7
    source: brief.md
    text: "**A7｜测试全绿**：ws 包测试改名后全绿；新增用例覆盖新键绑定与缺省、新键显式空串、扁平键键集合契约；跳过项仅限依赖真实 Redis
