acceptance:
  - id: A1
    source: brief.md
    text: 每个 MCP runtime 的授权配置独立生效，实例间不能因共享认证组件而互相继承或串用授权规则。
    result: passed
    reason:
      text: fw-plus-auth-core 新增 InstanceAuthRegistry 按 instanceKey 解析 provider，各
        runtime 独立绑定；McpRuntimeFactory 与 MagicDynamicMcpServer 按实例注入
        auth；McpRuntimeFactoryTest（含
        shouldNotInheritTopLevelAuthWhenNamedRuntimeOmitsIt）、MagicApiMcpServerRegistryTest、MagicDynamicMcpServerTest
        均仍在，命名实例不继承顶层授权。
      truncated: false
  - id: A2
    source: brief.md
    text: Starter 每个 runtime 可逐实例选择 PermitAll 或任一可用的 Sa-Token 认证方式（登录
      token、OAuth2、JWT、API Key、SSO ticket），未配置时拒绝。
    result: passed
    reason:
      text: Starter 默认与命名 runtime 逐实例选择 provider：McpProperties/MagicApiMcpProperties
        增字段；InstanceAuthRegistry.availableProviders() 输出 PermitAll + 5 种
        Sa-Token 方式（login/oauth2/jwt/apikey/sso）；未配置时 resolve 返回
        null→401。本轮修复未触及这些文件，无回退。
      truncated: false
  - id: A3
    source: brief.md
    text: Magic-API 每个实例可选择与 Starter 同一份 provider 清单；控制台表单按 classpath 可用性展示可选项，资源只存
      provider 与非敏感选择字段。
    result: passed
    reason:
      text: Magic-API 侧复用同一份 InstanceAuthRegistry.availableProviders()；控制台
        service/magic-mcp-server.js 调
        /mcp/server/authProviders，magic-mcp-server-info.vue
        按返回清单渲染；MagicMcpServerInfo/MagicMcpServerInfoMagicResourceStorage 仅存
        provider 与非敏感字段，MagicMcpServerStorageTest 覆盖 custom 拒绝与 auth 往返。
      truncated: false
  - id: A4
    source: brief.md
    text: 各 Sa-Token provider 按 classpath 可选装配：对应模块缺失时该 provider 不可选，选中缺失模块的
      provider 时 fail-closed（拒绝请求而非回退到其他 provider）。
    result: passed
    reason:
      text: "InstanceAuthRegistry 各分支用 available(CLASS_...) ? 实例 : reject(...) 明确
        fail-closed；classpath 缺失 provider
        不出现在清单、已配置则恒拒绝不回退；McpAuthServiceRegistryTest 覆盖缺失模块与 custom/unknown。"
      truncated: false
  - id: A5
    source: brief.md
    text: 认证成功的主体必须携带 scopes，scopes 可为多个值或空集；OAuth2/API Key 取凭据原生 scopes，JWT 取
      claim，登录 token 与 SSO ticket 无原生 scopes 时为空集。
    result: passed
    reason:
      text: McpPrincipal 复用主体 scopes：OAuth2 取 accessToken.getScopes()，API Key 取
        ApiKeyModel.getScopes()，JWT 取 scopes/scope claim，登录 token 与 SSO ticket
        无原生 scopes 时为空集；SaTokenJwtAuthServiceTest 等覆盖多值/空集/畸形。
      truncated: false
  - id: A6
    source: brief.md
    text: MVC 与 WebFlux 对未认证/无效主体返回 401 且不进入 MCP 内核；认证通过但目标 scope 不足（含空 scopes）时返回
      403；显式 PermitAll 绕过 scope 检查。
    result: passed
    reason:
      text: 回归证据充分：MagicMcpDiagnosticControllerAuthTest（诊断缺认证 401、无 scope
        403）、McpAuthEntryMvcTest（SSE 建连前拒绝、Streamable GET/DELETE
        拒绝且不进内核）、McpAuthEntryFluxTest、McpScopeEntryMvcTest/McpScopeEntryFluxTest（缺
        scope/空 scopes 拒绝、PermitAll 绕过）均存在；Runtime mcp-autoconfigure-tests 579
        项全通过。
      truncated: false
  - id: A7
    source: brief.md
    text: sa-token 升级到 1.46.0 后，`fw-plus-auth-satoken` 覆写的
      `StpLogic`/`SaTokenConfig` 与上游新版本对齐且保留本地 `tokenNames` 回退补丁，相关模块编译与测试通过。
    result: passed
    reason:
      text: 独立逐行 diff（上游 CRLF 已 tr -d '\r'）：SaTokenConfig 相对上游 1.46.0 仅 tokenNames
        字段（默认 {"satoken"}）与 getter/setter（19 行），StpLogic 仅
        getTokenValueByTokenName 辅助方法与 getTokenValueNotCut 中 tokenNames 遍历回退（56
        行），无其他偏离；fw-plus-auth-satoken/pom.xml 5 个 sa-token 依赖均为
        ${sa-token.version}，BOM sa-token.version=1.46.0，全仓无 1.44.0 残留；javap 确认
        target/classes 内 SaTokenConfig.class（含
