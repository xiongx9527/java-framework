acceptance:
  - id: A1
    source: brief.md
    text: "**A1｜Scenario**：配置形态 —— `fw.plus.ws.servers` 可按列表绑定，每项字段为
      `key`、`path`、`paths`、`appId`；默认实例仍取顶层 `websocket.path`/`websocket.paths` 与
      `appId`；未配 `servers` 时端点集合、会话 appId 与订阅派发和改造前完全一致。"
    result: passed
    reason:
      text: WsConfig.servers(List<WsInstance>) 与实例内 key/path/paths/appId
        四字段绑定未变；默认实例端点仍由 WsEndpointPathResolver.resolveRelativePaths(WsConfig) 从
        websocket.path/paths 播种，servers 为空时与两参重载等价；appId 仍由
        AbstractWebSocketHandler 与 ReactiveWsHandler 共用
        WsInstanceResolver.resolveAppId 解析。相对 iteration 1 候选仅有报文文案改动，绑定行为无回归；ws
        包 15 类 114 tests 与全量 752 tests 复跑 0 failures。
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2｜Scenario**：旧键移除 —— YAML 写旧键 `fw.plus.ws.instances` 或实例内 `name`
      时不再被绑定（Spring 默认忽略未知字段），不产生任何实例端点，默认实例行为不变，应用正常启动。"
    result: passed
    reason:
      text: 旧键 instances 与实例内 name 依旧无对应字段，legacyInstancesKeyShouldNotBind 断言 servers
        空且 flatten 无 instances 扁平键；全仓 java/yml/md 无旧键残留（rg 只命中 cloud 层无关的
        ServiceInstance），本次 2b30c7fd 只改 2 个文件、未触及绑定路径。
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3｜Scenario**：key 必填 —— 任一实例 `key` 缺失、空串或纯空白时启动失败，错误信息含
      `fw.plus.ws.servers[].key`。"
    result: passed
    reason:
      text: "已修复：WsInstanceValidator.validateKey 空白 key 报文改为「fw.plus.ws.servers[].key
        must not be blank:
        fw.plus.ws.servers[N].key」（WsInstanceValidator.java:85），既含 spec A22
        要求的字面 fw.plus.ws.servers[].key，又保留下标定位，且与同类重复 key
        报文（fw.plus.ws.servers[].key '...' is declared more than once: ...）结构一致、与
        McpRuntimeFactory:53 的非下标口径对齐。key 缺失、空串、纯空白三种情形均仍抛
        IllegalArgumentException
        并导致启动失败；WsInstanceValidatorTest.blankKeyShouldFail 已同步断言新文案，runtime 复跑
        10 tests 0 failures，全仓无其他用例断言旧文案。"
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4｜Scenario**：key 唯一 —— 两个实例 `key` 相同（trim 后）时启动失败，错误信息给出冲突的 key。"
    result: passed
    reason:
      text: "trim 后重复 key 报文不变：fw.plus.ws.servers[].key 'report' is declared more than
        once: fw.plus.ws.servers[1].key conflicts with
        fw.plus.ws.servers[0].key，duplicateKeyShouldFail 保持通过；本次未改动该分支。"
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5｜Scenario**：端点唯一 —— 实例端点与默认实例端点、或与另一实例端点（规范化后）重复时启动失败，错误信息含冲突路径与相关
      key；同一实例内部 `path` 与 `paths` 重复仍按配置顺序去重、不失败；只配 `key` 不配任何端点同样启动失败。"
    result: passed
    reason:
      text: 端点冲突四类场景（与默认实例重复含尾斜杠与 websocket.paths 变体、实例间重复、只配 key 未配端点、实例内 path 与
        paths 重复放行）行为与报文本轮未变，WsInstanceValidatorTest 覆盖并通过；全量回归 752 tests 0
        failures 覆盖 webmvc 与 webflux 两条装配路径。
      truncated: false
  - id: A6
    source: brief.md
    text: "**A6｜Scenario**：appId 继承与两栈一致 —— 实例未配 `appId`（留空）时握手会话 appId 取顶层
      `fw.plus.ws.appId`，显式配置时取实例值；webmvc 与 webflux 两栈判定一致。"
    result: passed
    reason:
      text: webmvc AbstractWebSocketHandler:419 与 webflux ReactiveWsHandler:265 仍走
        WsInstanceResolver.resolveAppId，命中且填 appId 取实例值、留空或未命中回落各自栈
        defaultAppId（顶层 fw.plus.ws.appId）；WsHandshakeValidationTest 与
        ReactiveWsHandlerTest 三种情形两栈一致，本轮复跑通过。
      truncated: false
  - id: A7
    source: brief.md
    text: "**A7｜Scenario**：文档与样例同步 —— starter README 与样例 `application.yml` 只出现
      `servers`/`key` 形态，无 `instances`/`name` 残留；ws 自动配置模块 ws 包测试改名后全绿（跳过项仅限依赖真实
      Redis 的用例）。"
    result: passed
    reason:
      text: starter README、样例 application.yml、magic-api ws README 与 spec.md
        未因本轮文案修复变动，仍只呈现 servers/key 形态；ws-docs-shape rg 检查 exit 0；ws 包 114
        tests、magic-api ws 插件 3 类 22 tests、fw-plus-boot-autoconfigure 全量 147 类
        752 tests 全部 0 failures，唯一 skip 是未设 Redis 环境变量的
        WsRedisBroadcastEndToEndTest。
      truncated: false
