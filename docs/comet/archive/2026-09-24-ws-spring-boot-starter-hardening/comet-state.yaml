acceptance:
  - id: A1
    source: brief.md
    text: "**A1｜Scenario**：WsConfig POJO 绑定 —— `WsConfig` 为类型安全嵌套
      POJO，`fw.plus.ws.*` 下既有 21
      个键（token.secret、websocket.path、session.cache.expireMinutes…）与新增键均可绑定；`fla\
      tten()` 产出的点号扁平键集合与改造前逐键一致。"
    result: passed
    reason:
      text: WsConfig 为类型安全嵌套 POJO（web/ws/config/WsConfig.java:24），flatten()
        输出旧读取契约的全部扁平键（同文件 :67），WsConfigBindingTest
        覆盖默认值、嵌套绑定与扁平键（src/test/.../web/ws/config/WsConfigBindingTest.java:24,:82）。
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2｜Scenario**：插件侧零改动 —— `WsBaseService` 现有全部语义 getter
      方法名与返回类型不变；magic-api ws 插件的
      `BaseService`/`MagicAPIWsConfiguration`/`WsModule`/`MagicWsController`/`B\
      aseDynamicWebSocketHandler` 能取到与改造前相同的配置值。"
    result: passed
    reason:
      text: WsBaseService 语义 getter
        名与返回类型未变（web/ws/common/WsBaseService.java:181,:203,:303,:312），magic-api
        ws 插件经 MagicAPIWsConfiguration/MagicWsController/WsModule
        仍取到相同配置值（magicapi/plugin/ws/starter/MagicAPIWsConfiguration.java:141、magicapi/plugin/ws/web/MagicWsController.java:92、magicapi/plugin/ws/module/WsModule.java:89），相关测试在
        703 条全量测试中通过。
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3｜Scenario**：长连接不被误杀 —— 只发送业务文本消息（从不发 ping）的会话，超过
      `session.cache.expireMinutes` 后仍为有效状态，服务端不主动关闭、不返回 SERVICE_OVERLOAD。"
    result: passed
    reason:
      text: 入站消息刷新 lastActiveTime
        与缓存计时（handler/AbstractWebSocketHandler.java:516），isSessionValid
        以活跃时间判定（同文件 :986,:999），驱逐回调默认不关闭会话；回归测试
        AbstractWebSocketHandlerTest.java:344。
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4｜Scenario**：生命周期清理 —— 应用关闭通过 Spring `DisposableBean` 清理会话；同一 JVM
      内重复创建 handler 不累积 JVM shutdown hook，代码中无 `Runtime.addShutdownHook`。"
    result: passed
    reason:
      text: AbstractWebSocketHandler 实现 DisposableBean，destroy() 走
        cleanupAllResources（handler/AbstractWebSocketHandler.java:188,:195）；全
        fw-plus-boot 无 Runtime.addShutdownHook，重复创建 handler 不累积钩子。
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5｜Scenario**：帧大小限制 —— 握手成功后会话设置了文本与二进制消息大小上限（默认 65536），超限帧被拒绝。"
    result: passed
    reason:
      text: 握手成功后设置文本与二进制帧上限，默认
        65536（handler/AbstractWebSocketHandler.java:403、config/WsConfig.java:184），AbstractWebSocketHandlerTest.java:239
        断言上限设置；超限帧由 Spring 传输层拒绝。
      truncated: false
  - id: A6
    source: brief.md
    text: "**A6｜Scenario**：连接数上限 —— 会话总数达 `session.maxTotalSessions` 或单 clientId 达
      `session.maxSessionsPerClient` 时，新握手被拒绝并返回 SERVICE_OVERLOAD。"
    result: passed
    reason:
      text: 握手阶段校验总数与单 clientId 上限，超限返回
        CloseStatus.SERVICE_OVERLOAD（handler/AbstractWebSocketHandler.java:468,:475），webflux
        侧同样实现（webflux/ReactiveWsHandler.java:95）；测试
        AbstractWebSocketHandlerTest.java:268,:288。
      truncated: false
  - id: A7
    source: brief.md
    text: "**A7｜Scenario**：密钥热更新 —— `fw.plus.ws.token.secret` 变更后 JWT
      校验立即使用新密钥，无需重启应用。"
    result: passed
    reason:
      text: 密钥缓存以密钥字符串为键，secret 变更后即时生效；WsConfig
        带刷新能力（config/WsConfig.java:22、web/ws/common/WsBaseService.java:203）；secretRotationShouldTakeEffectWithoutRestart
        通过（AbstractWebSocketHandlerTest.java:324）。
      truncated: false
  - id: A8
    source: brief.md
    text: "**A8｜Scenario**：广播异步开关 —— `fw.plus.ws.broadcast.async` 默认
      false，行为与改造前一致（同步）；置 true 时 Redis 触发的本地广播提交到有界线程池，队列满时丢弃并告警，不阻塞监听线程。"
    result: passed
    reason:
      text: broadcast.async 默认 false，本地广播保持同步（config/WsConfig.java:346）；置 true 时提交到有界
        WsBroadcastExecutor，队列满丢弃并告警（broadcast/WsBroadcastExecutor.java:23、handler/AbstractWebSocketHandler.java:1028）；测试
        AbstractWebSocketHandlerTest.java:373,:387。
      truncated: false
  - id: A9
    source: brief.md
    text: "**A9｜Scenario**：二进制消息 —— `fw.plus.ws.binary.enabled=true` 时二进制帧按
      `fw.plus.ws.binary.type`（默认 binary）进入订阅派发链路，上下文可标识 BINARY 并取到 byte[]；置
      false 时维持 NOT_ACCEPTABLE。"
    result: passed
    reason:
      text: binary.enabled=true 时二进制帧按 binary.type 派发，上下文为 MessageKind.BINARY 且携带
        byte[]（handler/AbstractWebSocketHandler.java:530、webflux/ReactiveWsHandler.java:126,:175、config/WsConfig.java:329）；置
        false 维持 NOT_ACCEPTABLE；测试 AbstractWebSocketHandlerTest.java:165 与
        ReactiveWsHandlerTest.java:88,:111。
      truncated: false
  - id: A10
    source: brief.md
    text: "**A10｜Scenario**：webmvc 行为回归 —— `AbstractWebSocketHandler`
      公共方法签名与报文契约（UNKNOWN_TYPE / INVALID_JSON / SCRIPT_ERROR / ping-pong）保持不变，既有
      webmvc 测试全部通过。"
    result: passed
    reason:
      text: AbstractWebSocketHandler 公共方法签名与报文契约（UNKNOWN_TYPE / INVALID_JSON /
        SCRIPT_ERROR /
        ping-pong）未漂移（handler/AbstractWebSocketHandler.java:509,:548,:560,:691,:759），既有
        webmvc 测试在全量 703
        条中通过（AbstractWebSocketHandlerTest.java:49,:61,:88,:100,:215）。
      truncated: false
  - id: A11
    source: brief.md
    text: "**A11｜Scenario**：webflux 双栈 ——
      `@ConditionalOnWebApplication(type=REACTIVE)` 下注册响应式 WebSocket
      端点，能完成握手鉴权、文本与二进制收发、定向发送与广播。"
    result: passed
    reason:
      text: "@ConditionalOnWebApplication(type=REACTIVE)
        下注册响应式端点（webflux/WsWebFluxAutoConfiguration.java:34、ReactiveWsHandler.j\
        ava:88,:159,:342），握手鉴权、文本/二进制收发、定向发送与广播均有测试覆盖（ReactiveWsHandlerTest.jav\
        a:51,:88,:146,:161）。"
      truncated: false
  - id: A12
    source: brief.md
    text: "**A12｜Scenario**：webflux 脚本非阻塞 —— webflux 栈下订阅脚本提交到独立有界线程池执行，不阻塞 Reactor
      event loop。"
    result: passed
    reason:
      text: webflux 栈订阅脚本经 publishOn(Schedulers.fromExecutor(scriptExecutor)) 与
        runOnScriptExecutor()
        进入独立有界线程池（webflux/ReactiveWsHandler.java:70,:108,:210,:318），测试
        ReactiveWsHandlerTest.java:131 断言不在 Reactor event loop 执行。
      truncated: false
  - id: A13
    source: brief.md
    text: "**A13｜Scenario**：统一会话抽象 —— `WsInvocationContext.getSession()` 返回
      `WsSession`，提供
      `getAttributes()`/`sendText`/`sendBinary`/`close`/`isOpen`；webmvc 与
      webflux 各有适配器实现。"
    result: passed
    reason:
      text: WsInvocationContext.getSession() 返回 WsSession，提供
        getAttributes/sendText/sendBinary/close/isOpen（spi/WsSession.java:21、spi/WsInvocationContext.java:81），webmvc
        与 webflux
        各有适配器（webmvc/ServletWsSession.java:18、webflux/ReactiveWsSession.java:22）并在两侧派发中实际使用（AbstractWebSocketHandler.java:751、ReactiveWsHandler.java:165）。
      truncated: false
  - id: A14
    source: brief.md
    text: "**A14｜Scenario**：自动配置清单一致 —— `AutoConfiguration.imports` 包含
      `WsAutoConfiguration`、`WsRedisConfiguration`，与 `spring.factories` 不冲突。"
    result: passed
    reason:
      text: AutoConfiguration.imports 与 spring.factories 均登记
        WsAutoConfiguration、WsRedisConfiguration
        且互不冲突（.../META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports:15,:16
        与 .../META-INF/spring.factories:17,:18），装配测试
        WsAutoConfigurationTest.java:35、WsRedisConfigurationTest.java:41。
      truncated: false
  - id: A15
    source: brief.md
    text: "**A15｜Scenario**：清理与命名 —— 死配置
      `getErrorCode`/`getWebsocketEndpoint`/`getWebsocketBasePath`
      已移除；`getInitBusinessType`/`getCloseBusinessType` 可用且旧拼写保留 `@Deprecated`
      委托；无 `io.jsonwebtoken.lang.Collections` 等第三方内部 API 依赖。"
    result: passed
    reason:
      text: 死配置 getErrorCode/getWebsocketEndpoint/getWebsocketBasePath
        已不存在；getInitBusinessType/getCloseBusinessType 可用且旧拼写保留 @Deprecated
        委托（web/ws/common/WsBaseService.java:312,:321,:331,:342）；未见
        io.jsonwebtoken.lang.Collections 等第三方内部 API 依赖。
      truncated: false
  - id: A16
    source: brief.md
    text: "**A16｜Scenario**：外围产物 —— starter 提供 README（对齐 centrifuge
      章节）；`fw-plus-sample` 下新增可编译的 ws 样例模块并在 `fw-plus-boot-samples/pom.xml` 注册。"
    result: passed
    reason:
