        结构（fw-plus-boot/fw-plus-boot-project/fw-plus-boot-starters/fw-plus-ws-spring-boot-starter/README.md:8,:19；对照
        fw-plus-centrifuge-spring-boot-starter/README.md）。ws
        样例模块已从空壳补齐：pom.xml:26 引入 starter，src/main 下有
        WsSampleApplication、DemoTokenController、DemoWsDispatcher 三个类与
        application.yml、static/index.html，并已在
        fw-plus-sample/fw-plus-boot-samples/pom.xml 的 modules 中注册。样例调用的
        WsBaseService#getSecretKeyAndSignatureAlgorithm()、WsBusinessDispatcher、WsInvocationContext、WsReplyHandle
