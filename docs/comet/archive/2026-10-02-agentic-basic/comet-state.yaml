acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: 通用顺序编排——WHEN 用 AgenticWorkflows.sequence() 串联多个 agent 并指定
      outputName THEN 各 agent 输出经 AgenticScope 按 @V 变量名流向下一个 agent，最终产出
      outputName 结果"
    result: passed
    reason:
      text: AgenticWorkflows.sequence() 委托
        AgenticServices.sequenceBuilder()，subAgents/outputKey/build
        全量透传（AgenticWorkflows.java:33-107），AgenticScope 按 @V 变量流转由 agentic 原生
        sequence 语义保证
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: 通用循环编排——WHEN 用 AgenticWorkflows.loop() 配置 maxIterations 与
      exitCondition THEN 反复执行 subAgents 直到条件满足或达上限"
    result: passed
    reason:
      text: AgenticLoopBuilder 透传 maxIterations 与
        exitCondition（AgenticWorkflows.java:138-146），达到上限即停，防无限循环
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: 条件路由——WHEN 用 AgenticWorkflows.conditional() 配置分支条件 THEN
      按条件路由到对应 agent"
    result: passed
    reason:
      text: AgenticConditionalBuilder.subAgents(Predicate<AgenticScope>, agent)
        按条件声明分支（AgenticWorkflows.java:168-171），委托 ConditionalAgentService 路由
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: 并行编排——WHEN 用 AgenticWorkflows.parallel() 配置多个 agent THEN
      并行执行并汇聚结果"
    result: passed
    reason:
      text: AgenticParallelBuilder 委托
        ParallelAgentService（AgenticWorkflows.java:200-236），多 agent fan-out
        且结果按各自 outputKey 写回汇聚
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: graph 编排——WHEN 用 AgenticWorkflows.graph() 构建
      StateGraph（节点+条件边）并编译 THEN graphToolProvider 可将其挂为工具执行"
    result: passed
    reason:
      text: graph() 返回 langgraph4j
        StateGraph（AgenticWorkflows.java:58-61），graphToolProvider 包装
        CompiledGraph.invoke（AgenticToolProvider.java:53-64），测试
        shouldWrapCompiledGraphAsTool 真图执行返回 graph-done，单测 5/5 通过
      truncated: false
  - id: A6
    source: brief.md
    text: "Scenario: 编排当工具——WHEN 将编排产物经 agenticToolProvider 包装并挂入助手 toolProvider
      THEN 主 LLM 可按工具描述调用该工具并获得编排结果"
    result: passed
    reason:
      text: agenticToolProvider 把 UntypedAgent 包装为单工具
        ToolProvider，名称/描述可配置（AgenticToolProvider.java:47-76），挂载复用既有
        AssistantBuilder.toolProvider（AssistantBuilder.java:269），测试验证
        specification 暴露与 outputKey 结果回传
      truncated: false
  - id: A7
    source: brief.md
    text: "Scenario: 入参映射——WHEN 主 LLM 调用工具传参 THEN 参数按编排 inputKeys 注入 AgenticScope"
    result: passed
    reason:
      text: execute() 解析工具调用 JSON 入参传给 agent.invoke 注入
        AgenticScope（AgenticToolProvider.java:87-98, 101-112），inputKeys 逐个生成
        schema 属性（:79-85），测试 shouldReturnOutputKeyValueAsToolResult 覆盖
      truncated: false
  - id: A8
    source: brief.md
    text: "Scenario: 脚本可用——WHEN magic 脚本经 langchain4j.agentic() 构建
      sequence/loop/conditional/parallel/graph 并挂入助手 THEN 行为与 Java API 一致"
    result: passed
    reason:
      text: Langchain4jModule.agentic() 返回
        AgenticWorkflows.instance()（Langchain4jModule.java:129-131），脚本经同一门面构建
        sequence/loop/conditional/parallel/graph 与 Java API 同构
      truncated: false
  - id: A9
    source: brief.md
    text: "Scenario: 依赖可选——WHEN 应用未引入 langchain4j-agentic THEN 构建器与适配器不装配，助手其余功能不受影响"
    result: passed
    reason:
      text: langchain4j-agentic 与 langgraph4j-core 均
        optional=true（fw-plus-ai-boot-autoconfigure/pom.xml:254-265），全仓 grep 确认
        agentic/langgraph4j 类型仅出现在隔离类与测试，无自动装配引用；Langchain4jModule 不直接引用 agentic
        类型，缺失依赖时其余助手功能不受影响
      truncated: false
