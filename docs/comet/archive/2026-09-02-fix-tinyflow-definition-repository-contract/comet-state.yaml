acceptance:
  - id: A1
    source: brief.md
    text: "**A1：默认仓库契约一致。** 给定未提供自定义 `TinyflowChainDefinitionRepository` 的应用上下文，当
      Tinyflow 自动配置启动时，系统创建唯一默认 Definition Repository；该 Bean 同时可按
      `TinyflowChainDefinitionRepository` 使用，并支持注册、查询和删除定义。"
    result: passed
    reason:
      text: "`InMemoryChainDefinitionRepository` 现已实现
        `TinyflowChainDefinitionRepository`，保留注册、按 ID 查询和删除行为；Runtime 的 Tinyflow
        Core Java 8 测试通过，自动配置测试通过。"
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2：自定义仓库完整替换默认实现。** 给定应用提供自定义 `TinyflowChainDefinitionRepository`，当
      Tinyflow 自动配置启动并注册工作流时，系统不创建默认内存仓库，`ChainExecutor` 与 `TinyflowService`
      使用同一个自定义仓库，注册后的定义可从该仓库查询。"
    result: passed
    reason:
      text: 现有
        `TinyflowAutoConfigurationTest.shouldUseCustomWritableDefinitionRepositoryInsteadOfTheDefault`
        验证自定义仓库替换默认实现，并确认 `ChainExecutor`、`TinyflowService`
        和注册后的定义使用同一自定义仓库；测试通过。
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3：阻塞命令恢复。** 在 Java 8 下构建 Tinyflow Core 并执行 AI Boot
      `fw-plus-ai-boot-autoconfigure` direct consumer/condition 测试时，不再出现
      `InMemoryChainDefinitionRepository` 与 `TinyflowChainDefinitionRepository`
      互相不可转换的编译错误，相关测试通过。"
    result: passed
    reason:
      text: Runtime 的 Tinyflow Core Java 8 测试和 AI Boot direct consumer Java 8 reactor
        测试均通过，分别为 74/74 与 329/329；原
        `InMemoryChainDefinitionRepository`/`TinyflowChainDefinitionRepository`
        类型转换错误不再出现。
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4：改动范围受控。** 候选实现只恢复 Tinyflow Definition Repository
      的两处遗漏契约迁移及必要的正式产物；不包含 Agentic 候选、其他 Tinyflow 行为或无关文件改动。"
    result: passed
    reason:
      text: 实现 diff 仅包含 `InMemoryChainDefinitionRepository` 与 `DefaultTinyflowService`
        两个 Tinyflow Core Java 文件；未包含 Agentic 候选或其他 Tinyflow 行为改动。
      truncated: false
  - id: A5
    source: specs/tinyflow-definition-repository-contract/spec.md
    text: 默认内存仓库通过接口提供服务 - **WHEN** 应用没有提供自定义 `TinyflowChainDefinitionRepository` -
      **THEN** 自动配置创建唯一默认 Definition Repository Bean - **AND** 该 Bean 可按
      `TinyflowChainDefinitionRepository` 注入 - **AND** 注册的 `ChainDefinition` 可按
      ID 查询并删除
    result: passed
    reason:
      text: 默认实现已通过 `TinyflowChainDefinitionRepository` 接口提供可写仓库能力，编译后签名检查通过，Core Java
        8 测试通过。
      truncated: false
  - id: A6
    source: specs/tinyflow-definition-repository-contract/spec.md
    text: 自定义仓库贯穿执行与服务链 - **WHEN** 应用提供一个自定义 `TinyflowChainDefinitionRepository` -
      **THEN** 自动配置不创建默认内存仓库 - **AND** `ChainExecutor` 与
      `DefaultTinyflowService` 使用该同一自定义仓库 - **AND** 通过
      `TinyflowService.register` 注册工作流后，该仓库包含对应定义
    result: passed
    reason:
      text: 服务字段与 public 构造器第三参数均已改为 `TinyflowChainDefinitionRepository`，自定义仓库可贯穿
        `ChainExecutor` 与服务注册链路；自动配置测试通过。
      truncated: false
  - id: A7
    source: specs/tinyflow-definition-repository-contract/spec.md
    text: AI Boot direct consumer 构建通过 - **WHEN** 使用 Java 8 构建 Tinyflow Core 并执行
      `fw-plus-ai-boot-autoconfigure` 测试 - **THEN** 不出现
