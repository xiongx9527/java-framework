      互相不可转换的编译错误 - **AND** Tinyflow 自动配置的默认仓库与自定义仓库测试通过
    result: passed
    reason:
      text: AI Boot direct consumer Java 8 测试完整通过，包含 `TinyflowAutoConfigurationTest`
