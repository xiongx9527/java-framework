acceptance:
  - id: A1
    source: brief.md
    text: "**A1｜Scenario**：webmvc 多路径 —— 配 `websocket.path=/ws/api` 加
      `websocket.paths=[/ws/api2, /ws/api]`
      时，去重后两条路径都注册到同一处理器，跨域与子协议设置与改造前逐条一致。"
    result: passed
    reason:
      text: WsEndpointRegistrar 按「全部 WsBasePathProvider × (websocket.path +
        websocket.paths)」展开并用 LinkedHashSet 去重，规则收在
        WsEndpointPathResolver。WsAutoConfigurationTest#additionalPathsShouldRegisterEveryUniquePathOnSameHandler
        验证 /ws/api、/ws/api2、/ws/api3 去重后注册到同一处理器；单路径注册失败仅记日志不影响其余路径。Runtime 回执
        autoconfigure-full-tests exit 0（729 通过）覆盖该行为。
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2｜Scenario**：webmvc 多基础路径 —— 容器内存在两个 `WsBasePathProvider`（如
      `/magic-api`、`/bff`）时，每个 basePath 与每条相对路径都注册，且不再抛
      `NoUniqueBeanDefinitionException`。"
    result: passed
    reason:
      text: 基础路径候选改由 ObjectProvider 有序收集（@Primary 优先，其余按 @Order/Ordered 排序），容器内多个
        WsBasePathProvider 不再抛
        NoUniqueBeanDefinitionException。WsAutoConfigurationTest#multipleBasePathProvidersShouldRegisterEveryCombination
        验证两个 provider（/magic-api、/bff）与每条相对路径的组合全部注册。
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3｜Scenario**：webmvc 多 configurer —— 宿主自带 `@EnableWebSocket` 并注册自己的
      `WebSocketConfigurer`（路径 `/host/echo`）时，宿主路径与地基 `/ws/api` 同时注册、互不覆盖，真实
      Tomcat 下两条路径都能完成 HTTP upgrade 握手。"
    result: passed
    reason:
      text: 地基注册器不加 @ConditionalOnMissingBean(WebSocketConfigurer.class) 独占，交由 Spring
        DelegatingWebSocketConfiguration 收集全部实例。装配级
        WsAutoConfigurationTest#hostSuppliedConfigurerShouldCoexistWithFoundationRegistrar
        验证容器内 2 个 WebSocketConfigurer 并存（/ws/api 与 /host/echo）；真实 Tomcat
        WsEndpointHttpUpgradeTest#additionalAndHostRegisteredPathsShouldHandshakeAlongsideFoundationPath
        验证地基路径与宿主路径均完成 HTTP upgrade 握手并往返消息。
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4｜Scenario**：webflux 多路径与多基础路径 —— `websocket.paths` 与多个
      `WsBasePathProvider` 在响应式栈展开为同一组路径，`SimpleUrlHandlerMapping` 的 urlMap 与
      webmvc 注册结果一致；宿主自带 mapping 时两者由 order 决定先后、互不覆盖。"
    result: passed
    reason:
      text: WsWebFluxAutoConfiguration 复用同一套矩阵与 WsEndpointPathResolver 展开 paths 与多
        basePathProvider，保留自有 SimpleUrlHandlerMapping，Bean 名
        wsReactiveHandlerMapping 与 order
        不变。WsWebFluxAutoConfigurationTest#reactiveApplicationShouldExpandEveryPathAgainstEveryBasePath
        断言 4 个键的 urlMap 与 webmvc
        口径一致；#hostSuppliedMappingShouldCoexistWithFoundationMapping 验证宿主 mapping
        与本品 mapping 由 order 决定先后、互不覆盖。
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5｜Scenario**：两端路径口径统一 —— 主路径显式置空串时两端一致地只按 basePath 注册（webflux 的
      `/ws/api` 本地回落已删除），拼接规则共用 `WsEndpointPathResolver`。"
    result: passed
    reason:
      text: webflux 侧本地 /ws/api 回落已删除，两端拼接规则共用
        WsEndpointPathResolver，斜杠语义（三分支）与改造前逐字节一致。WsWebFluxAutoConfigurationTest#reactiveBlankPrimaryPathShouldFollowBasePathOnly
        验证主路径显式置空串时只按 basePath 注册。
      truncated: false
  - id: A6
    source: brief.md
    text: "**A6｜Scenario**：登记与开关收敛 —— `spring.factories` 与
      `AutoConfiguration.imports` 只有 `WsAutoConfiguration`
      一项；`WsRedisConfiguration` 与 `WsWebFluxAutoConfiguration` 经 `@Import`
      生效且身上无冗余 `@ConditionalOnProperty`；`fw.plus.ws.enabled=false` 时三类 WS Bean
      全部不装配。"
    result: passed
    reason:
      text: "META-INF/spring.factories:17 与 AutoConfiguration.imports:15 均只有 1 条 WS
        登记且同为 WsAutoConfiguration；ws 包内 @ConditionalOnProperty 仅存于入口类
        starter/WsAutoConfiguration.java:41，WsRedisConfiguration 与
        WsWebFluxAutoConfiguration 经 @Import({WsRedisConfiguration.class,
        WsWebFluxAutoConfiguration.class})（同文件 :45）收编且身上无该注解；禁用路径有
        WsAutoConfigurationTest#shouldNotRegisterAnythingWhenDisabled 与 webflux
        #reactiveEndpointShouldBeAbsentWhenFeatureDisabled 覆盖并在全量回归中通过。遗留覆盖缺口见
        risks。"
      truncated: false
  - id: A7
    source: brief.md
    text: "**A7｜Scenario**：频道与文档 —— `WsBaseService#getBroadcastChannelName()` 为
      `fw-plus:websocket:broadcast`，README（starter 与 magic-api ws
      插件）记录多路径、多基础路径与多 configurer 用法，自动配置模块 ws 包测试全绿（跳过项仅限依赖真实 Redis 的用例）。"
    result: passed
    reason:
      text: WsBaseService#getBroadcastChannelName() 默认
        fw-plus:websocket:broadcast（common/WsBaseService.java:118），WsConfig.Redis.broadcast
        默认同值（config/WsConfig.java:281），订阅侧实际取用（redis/WsRedisMessageListenerContainer.java:48、handler/RedisWebSocketHandler.java:62）；测试
        WsBaseServiceTest.java:33、WsConfigBindingTest.java:48、WsRedisConfigurationTest.java:79
        断言该频道。starter 与 magic-api ws 插件两份 README 均已补充 websocket.paths 配置表、yaml
        示例、多端点/多基础路径/多 configurer 用法章节并更新频道名；ws 包测试在全量回归中全绿（跳过项仅
        WsRedisBroadcastEndToEndTest）。
      truncated: false
