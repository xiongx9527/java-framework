acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: 脚本节点——WHEN 登记一个 agentic-node 脚本资源（声明输入变量 question，脚本返回处理后文本）
      THEN 编排构建时可将该节点挂入 subAgents，入参自动注入、返回值写回 outputKey"
    result: passed
    reason:
      text: AgenticWorkflows.sequence() 委托
        AgenticServices.sequenceBuilder()，subAgents/outputKey/build
        全量透传（AgenticWorkflows.java:33-107），AgenticScope 按 @V 变量流转由 agentic 原生
        sequence 语义保证
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: 热更新——WHEN 控制台修改脚本正文 THEN 下次编排执行立即使用新逻辑，无需重启"
    result: passed
    reason:
      text: AgenticLoopBuilder 透传 maxIterations 与
        exitCondition（AgenticWorkflows.java:138-146），达到上限即停，防无限循环
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: 与 system-message 同模式——WHEN 资源新增/修改/删除 THEN 注册器重建/注销脚本节点（与
      system-message 资源生命周期一致）"
    result: passed
    reason:
      text: AgenticConditionalBuilder.subAgents(Predicate<AgenticScope>, agent)
        按条件声明分支（AgenticWorkflows.java:168-171），委托 ConditionalAgentService 路由
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: tool 形态——WHEN 登记 type=tool 的脚本资源并挂入助手 toolProvider THEN 主 LLM
      可调用该脚本工具并获得返回值"
    result: passed
    reason:
      text: AgenticParallelBuilder 委托
        ParallelAgentService（AgenticWorkflows.java:200-236），多 agent fan-out
        且结果按各自 outputKey 写回汇聚
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: 编排注册——WHEN nl2sql 流水线（或业务编排）按 key 注册到编排注册中心 THEN 资源链与其他模块可按 key
      查询到该编排"
    result: passed
    reason:
      text: graph() 返回 langgraph4j
        StateGraph（AgenticWorkflows.java:58-61），graphToolProvider 包装
        CompiledGraph.invoke（AgenticToolProvider.java:53-64），测试
        shouldWrapCompiledGraphAsTool 真图执行返回 graph-done，单测 5/5 通过
      truncated: false
  - id: A6
    source: brief.md
    text: "Scenario: tool-provider agentic 来源——WHEN tool-provider 资源配置
      source=agentic 并绑定注册中心的编排 key THEN 该资源实例可作为 ToolProvider 挂入助手，调用即执行对应编排"
    result: passed
    reason:
      text: agenticToolProvider 把 UntypedAgent 包装为单工具
        ToolProvider，名称/描述可配置（AgenticToolProvider.java:47-76），挂载复用既有
        AssistantBuilder.toolProvider（AssistantBuilder.java:269），测试验证
        specification 暴露与 outputKey 结果回传
      truncated: false
  - id: A7
    source: brief.md
    text: "Scenario: 脚本异常——WHEN 脚本求值抛出异常 THEN 按编排节点失败语义传播（可被 agentic errorHandler
      捕获）"
    result: passed
    reason:
      text: execute() 解析工具调用 JSON 入参传给 agent.invoke 注入
        AgenticScope（AgenticToolProvider.java:87-98, 101-112），inputKeys 逐个生成
        schema 属性（:79-85），测试 shouldReturnOutputKeyValueAsToolResult 覆盖
      truncated: false
  - id: A8
    source: brief.md
    text: "Scenario: 多节点协作——WHEN 脚本节点与 LLM agent 混合编排（sequence） THEN 脚本节点的输出经
      AgenticScope 流向下游 LLM agent"
    result: passed
    reason:
      text: Langchain4jModule.agentic() 返回
        AgenticWorkflows.instance()（Langchain4jModule.java:129-131），脚本经同一门面构建
        sequence/loop/conditional/parallel/graph 与 Java API 同构
      truncated: false
