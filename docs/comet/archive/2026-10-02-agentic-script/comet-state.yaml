  iteration: 1
  summary:
    text: 实现 agentic-script 三块能力：1) 脚本资源——新资源类型 langchain4j-agentic-script（单一类型 +
      type 字段：node=编排节点/tool=编排工具），资源链 6 文件（Info extends PathMagicEntity 含
      type/key/name/description/inputKeys/outputKey/enabled，script 继承；DataSource
      持有 MagicScriptAgent 实例；Registry 生命周期与 system-message 一致；Storage 校验
      key/type/name；Configuration @ConditionalOnClass(UntypedAgent) +
      fw.plus.magicapi.langchain4j.agentic-script.enabled 开关）+
      独立前端插件（magic-textarea 编辑脚本、type 下拉、inputKeys 逗号分隔）；2) 编排注册中心
      AgenticPipelineRegistry（key→UntypedAgent 注册/查询/注销/contains，Configuration
      提供 bean）；3) tool-provider 资源链 agentic 来源——Langchain4jToolProviderInfo 新增
      agenticKey/agenticDescription/agenticOutputKey/agenticInputKeys，DataSource
      构造注入 AgenticPipelineRegistry 且 create 按 agenticKey 分支（经
      AgenticToolProviders.agenticToolProvider 包装，编排不存在时报错列出已注册
      key），Configuration 构造注入 registry。同时补齐 AgenticWorkflows
      门面两工厂（agenticToolProvider/graphToolProvider）与 Langchain4jModule.agentic()
      脚本入口。
    truncated: false
  addressed_acceptance_ids:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    - A8
