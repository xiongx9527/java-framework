acceptance:
  - id: A1
    source: brief.md
    text: A1：用户在模板创建表单输入符合规则的新编码后，提交参数包含该编码而不是源模板编码。
    result: passed
    reason:
      text: TemplateDialog 将用户输入的 code 合并进请求；前端组件测试验证提交 new-app-code 而非模板编码。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：编码为空、格式不合法或超过 20 位时，前端阻止提交；后端对绕过前端的同类请求也在写库前拒绝。
    result: passed
    reason:
      text: 前端必填、最大 20 位及字符规则测试通过；后端 6 项空白、非法、超长及首尾空格定向测试均验证写库前拒绝。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：当前租户已存在相同应用编码时，模板创建在写入新应用前失败，且不留下应用、页面或角色数据。
    result: passed
    reason:
      text: 后端以 code 和 tenantId 查询重复项并在 createApp 前抛错；定向测试验证 createApp
        未调用，事务边界防止后续部分数据。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：源应用经验证是当前租户模板后，即使当前用户不是源模板成员，系统仍能读取并复制其页面；未验证的跨租户或非模板源应用不能使用内部读取路径。
    result: passed
    reason:
      text: 服务先按当前租户调用 queryAppTemplateById 验证模板，再直接用 PageMapper 读取源页面；测试验证不调用受成员权限约束的
        PageService 查询，未验证源不会进入读取路径。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：模板创建成功后返回的新应用编码与请求一致，页面复制成功，并为当前真实用户创建且仅创建一个 `app_owner` 关系。
    result: passed
    reason:
      text: 定向测试验证请求编码原样保存、页面经 PageService 创建并调用 createOwner；已有真实 MySQL/API 验收记录显示页面
        1->1 且仅一个 app_owner。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：页面或 Owner 创建等任一步骤失败时，模板创建事务整体回滚，不留下部分应用数据。
    result: passed
    reason:
      text: createAppByTemplate 标注
        @Transactional(rollbackFor=Exception.class)，应用、Owner
        与复制均在该调用内；定向测试验证事务契约。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：模板创建接口失败时页面只显示一次由全局 HTTP 层产生的错误提示，不出现额外空白提示框。
    result: passed
    reason:
      text: TemplateDetail 的失败分支仅收敛 rejection，不再局部 Notify；组件测试验证失败时无第二个通知，避免空白重复框。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：部署到 19080 的样例服务后，真实登录用户可通过模板创建应用；验收创建的测试应用随后通过正式删除接口清理，关联应用角色数据同时删除。
    result: passed
    reason:
      text: 已有 19080、真实登录用户和 MySQL 的创建/复制/正式删除验收记录：测试应用删除后 APP、PAGE、ROLE 残留均为 0。
      truncated: false
  - id: A9
    source: specs/tinyengine-template-clone/spec.md
    text: 模板创建应用表单应要求用户输入新应用名称和新应用编码。
    result: passed
    reason:
      text: TemplateDialog 明确展示应用名称和应用编码两个表单项，且均纳入校验。
      truncated: false
  - id: A10
    source: specs/tinyengine-template-clone/spec.md
    text: 新应用编码不得从源模板编码复制，也不得由系统静默生成。
    result: passed
    reason:
      text: code 初始为空并由用户输入；提交合并顺序使 formState.code 覆盖模板 code，组件测试已验证。
      truncated: false
  - id: A11
    source: specs/tinyengine-template-clone/spec.md
    text: 应用编码必须匹配 `^[A-Za-z0-9_-]{1,20}$`。
    result: passed
    reason:
      text: 后端使用 ^[A-Za-z0-9_-]{1,20}$ 精确匹配；前端等价地组合必填、最大长度和允许字符校验，边界测试通过。
      truncated: false
  - id: A12
    source: specs/tinyengine-template-clone/spec.md
    text: 前端应在提交前校验应用编码，后端应独立执行同等格式校验，不能信任前端输入。
    result: passed
    reason:
      text: 前端提交前执行表单校验，后端 validateNewAppCode 独立校验；前后端相关测试均通过。
      truncated: false
  - id: A13
    source: specs/tinyengine-template-clone/spec.md
    text: 模板创建请求应把用户输入的新应用编码传递给后端并保存到新应用。
    result: passed
    reason:
      text: 前端请求传递用户 code，后端不 trim 或替换并持久化同一值；组件和 Core 定向测试均验证透传。
      truncated: false
  - id: A14
    source: specs/tinyengine-template-clone/spec.md
    text: 新应用编码在当前租户内必须唯一。
    result: passed
    reason:
      text: 后端唯一性查询条件同时包含当前 tenantId 和 code，租户内唯一语义明确。
      truncated: false
  - id: A15
    source: specs/tinyengine-template-clone/spec.md
    text: 后端应在创建应用记录前查询当前租户是否已有相同编码；存在时应返回稳定业务错误且不执行应用写入。
    result: passed
    reason:
      text: 重复编码检查发生在 baseMapper.createApp 之前，返回稳定 CM003；定向测试验证没有应用写入。
      truncated: false
  - id: A16
    source: specs/tinyengine-template-clone/spec.md
    text: 数据库唯一约束应继续作为并发请求的最终保护。
    result: passed
    reason:
      text: MySQL 迁移保留并创建 t_app(tenant_id, code) 唯一索引
        u_idx_app_code_tenant，继续提供并发最终保护。
      truncated: false
  - id: A17
    source: specs/tinyengine-template-clone/spec.md
    text: 编码校验或后续复制失败时，不得留下部分应用、页面或角色数据。
    result: passed
    reason:
      text: 编码错误在首次写入前失败，后续复制错误由 createAppByTemplate 的全异常事务回滚覆盖。
      truncated: false
  - id: A18
    source: specs/tinyengine-template-clone/spec.md
    text: 复制前应验证源应用存在、属于当前租户且具有模板标识。
    result: passed
    reason:
      text: queryAppTemplateById(templateId,currentTenant) 在编码检查和写入前执行；Mapper
        语义限定当前租户且仅返回模板。
      truncated: false
  - id: A19
    source: specs/tinyengine-template-clone/spec.md
    text: 只有源应用通过上述验证后，模板复制服务才可通过内部 Mapper 读取源模板页面。
    result: passed
    reason:
      text: PageMapper.queryPageByApp 仅位于模板验证成功后的 copyData 路径；未验证源定向测试验证该 Mapper 从未调用。
      truncated: false
  - id: A20
    source: specs/tinyengine-template-clone/spec.md
    text: 内部源模板读取不要求当前用户持有源模板的应用成员角色，因为模板是当前租户内已授权的复制来源。
    result: passed
    reason:
      text: 源页面通过内部 PageMapper 读取而非 PageService 成员权限查询；定向测试明确验证这一调用边界。
      truncated: false
  - id: A21
    source: specs/tinyengine-template-clone/spec.md
    text: 跨租户应用、非模板应用或不存在的应用不得进入内部模板读取路径。
    result: passed
    reason:
      text: 跨租户、非模板或不存在来源无法通过
        queryAppTemplateById(templateId,currentTenant)，测试验证失败时无查询页面和写库调用。
      truncated: false
  - id: A22
    source: specs/tinyengine-template-clone/spec.md
    text: 目标页面应继续通过现有 PageService 创建，以保留目标应用的服务层校验和创建行为。
    result: passed
    reason:
      text: 复制页面仍逐项调用 pageService.createPage；定向测试验证目标 appId 和清理后的审计字段。
      truncated: false
  - id: A23
    source: specs/tinyengine-template-clone/spec.md
    text: 真实用户通过模板成功创建应用时，应为该用户创建且仅创建一个新应用的 `app_owner` 关系。
    result: passed
    reason:
      text: 真实用户创建后调用 createOwner；其实现加锁并拒绝既有 Owner/关系后只插入一次 app_owner，真实 API 验收也确认仅一个
        Owner。
      truncated: false
  - id: A24
    source: specs/tinyengine-template-clone/spec.md
    text: 新应用、页面复制和 Owner 关系创建应位于同一事务。
    result: passed
    reason:
      text: 应用写入、createOwner 和全部复制步骤都由 createAppByTemplate 的同一 Spring
        事务包围，内层默认事务传播加入该事务。
      truncated: false
  - id: A25
    source: specs/tinyengine-template-clone/spec.md
    text: 任一步骤失败时，事务应整体回滚。
    result: passed
    reason:
      text: 方法显式配置 rollbackFor=Exception.class，定向测试验证该声明，覆盖页面、Owner及其他复制步骤抛出的异常。
      truncated: false
  - id: A26
    source: specs/tinyengine-template-clone/spec.md
    text: 技术性的 `system` 身份行为继续遵循 TinyEngine 应用访问规格，不在本变更中调整。
    result: passed
    reason:
      text: 本变更未调整 system 访问规则；createOwner 对 system 保持既有跳过行为，技术身份语义未改变。
      truncated: false
  - id: A27
    source: specs/tinyengine-template-clone/spec.md
    text: 模板创建 API 请求失败时，应由全局 HTTP 层展示一次错误提示。
    result: passed
    reason:
      text: 全局响应拦截层 showError 负责失败提示；模板详情失败分支不再自行通知。
      truncated: false
  - id: A28
    source: specs/tinyengine-template-clone/spec.md
    text: 模板详情组件不得为同一 Promise rejection 再显示局部通知。
    result: passed
    reason:
      text: TemplateDetail catch 仅返回 undefined，不调用 Notify；组件失败用例验证 Notify 调用次数为 0。
      truncated: false
  - id: A29
    source: specs/tinyengine-template-clone/spec.md
    text: 错误提示不得直接把 Error 对象作为消息文本，避免出现空白提示框。
    result: passed
    reason:
      text: 组件不再把捕获的 Error 交给 Notify；全局错误层使用 error.message 字符串及稳定回退文本。
      truncated: false
  - id: A30
    source: specs/tinyengine-template-clone/spec.md
    text: 现有模板列表、模板详情和成功创建后的跳转行为保持不变。
    result: passed
    reason:
      text: 变更仅增加编码输入/校验并收敛失败通知；模板详情加载、成功 Modal、成功 Notify 和 handleMenu
        跳转流程保持不变，组件与生产构建通过。
      truncated: false
  - id: A31
    source: specs/tinyengine-template-clone/spec.md
    text: Servlet MVC 与 WebFlux 继续共享同一 Core 模板复制语义。
    result: passed
