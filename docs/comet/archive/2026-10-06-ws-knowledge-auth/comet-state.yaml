acceptance:
  - id: A1
    source: brief.md
    text: WS 默认实例与命名实例可逐实例选择 provider（permit-all + 各 sa-token 方式），实例间不继承、不串用；未配置
      provider 的实例握手一律拒绝。
    result: passed
    reason:
      text: 每个 WebSocket 实例的 auth 独立：WsConfig 顶层 auth 与 WsConfig.WsInstance.auth
        并存，WsAuthSupport.resolveAuth/resolveInstanceKey
        按实例解析，InstanceAuthRegistry.resolve
        按实例键查找；fw-plus-boot/.../web/ws/auth/WsAuthSupportTest
        中『命名实例不从顶层auth继承』『命名实例的provider只作用于该实例』『未配置provider的实例握手一律拒绝』『permit_all显式选择时放行』均通过（该测试类
        10 passed）。
      truncated: false
  - id: A2
    source: brief.md
    text: WS 握手凭据可从 query 参数或请求头读取（名称同各 provider 凭据名），两栈行为一致；凭据缺失/无效/未配置 provider
      时握手拒绝（webmvc 以 HTTP 401 拒绝且不升级；webflux 拒绝并关闭会话），不进入会话注册与订阅派发。
    result: passed
    reason:
      text: 凭证来源与拒绝语义一致：WsAuthSupport.mergeCredentials（约 113-137 行）合并 query 与 header 且
        header 覆盖 query；webmvc 侧 WsAuthHandshakeInterceptor.beforeHandshake 设置
        HTTP 401 并返回 false；webflux 侧 ReactiveWsHandler.authenticate 在
        registry.register 之前执行，拒绝时以 POLICY_VIOLATION(1008) 关闭；两栈复用同一
        WsAuthSupport。WsAuthHandshakeInterceptorTest(3)/ReactiveWsHandlerTest(14)
        通过。
      truncated: false
  - id: A3
    source: brief.md
    text: WS provider 按 classpath 可选装配，模块缺失时不可选、已配置 fail-closed；未知 provider 抛
      `IllegalArgumentException`；只认证不授权；permit-all 必须显式选择，且不作为默认。
    result: passed
    reason:
      text: fail-closed 且无越权：InstanceAuthRegistry.availableProviders 按 classpath 暴露已注册
        provider；provider 模块缺失时回退
        RejectingAuthService→ANONYMOUS（测试『provider模块缺失时fail_closed』）；未知 provider
        由 WsAuthSupport.validateProviders/resolve 抛
        IllegalArgumentException（测试覆盖）；permit-all 仅在显式配置时放行，默认 provider 为 null
        时拒绝；WS 鉴权路径仅检查 isAuthenticated，不消费 scope。
      truncated: false
  - id: A4
    source: brief.md
    text: knowledge 对外 API 按设置页 provider 校验，默认 `sa-token-login`（保持现状）；可切换为清单内任一
      classpath 可用项；`/settings`（GET/POST）同样受认证保护。
    result: passed
    reason:
      text: kb 开放 API 校验走 provider
        注册表：KbSettingService.DEFAULT_OPEN_API_AUTH_PROVIDER="sa-token-login" 且
        normalize 提供默认值；KbSaTokenAuthChecker.check 依据设置解析 provider
        并通过注册表校验；KbOpenApiController.collectHeaders 经 RequestContextHolder
        读取全部请求头；getSettings/saveSettings 由 auth(null,null)
        保护。KbSaTokenAuthCheckerTest(9)/KbSettingServiceAuthProviderTest(3)/KbSettingDefaultsTest
        通过。
      truncated: false
  - id: A5
    source: brief.md
    text: knowledge provider 模块缺失或未知时 fail-closed（返回 `error_code 1002`，不回退）；控制台下拉只展示
      classpath 可用 provider，保存即热生效。
    result: passed
    reason:
      text: 未知/缺失 provider 统一失败：抛 KbUnauthorizedException 并映射为
        error(1002)；KbConsoleController.listAuthProviders 返回
        authRegistry.availableProviders()；控制台 magic-kb-browser.vue 通过
        kbApi.authProviders('/kb/openapi-auth-providers')
        加载；KbSettingService.save 热替换 current（测试『保存后热生效』）；DDL
        open_api_auth_provider 已加入 docs/sql/fw-plus-ai-knowledge.sql 与
        schema-h2.sql。
      truncated: false
