      auth 与 WsInstance.auth（InstanceAuthProperties），新增 web.ws.auth 共享内核
      WsAuthSupport 与 webmvc 握手拦截器 WsAuthHandshakeInterceptor；webmvc 认证失败置 HTTP
      401 且不升级，webflux 用 CloseStatus.POLICY_VIOLATION(1008) 关闭；认证先于 clientId
      校验；凭据来源为握手 query 参数 + 请求头，同名 header 优先；命名实例不从顶层 auth 继承；未配置 provider
      fail-closed，未知 provider 启动期抛 IllegalArgumentException。knowledge：KbSetting
      增 openApiAuthProvider（留空语义 sa-token-login），KbSaTokenAuthChecker 改为
      provider-aware，KnowledgeConfiguration 增 registry bean，/settings GET/POST
      纳入鉴权，新增 GET /openapi-auth-providers 供控制台下拉，控制台 Vue/service/i18n 接入，并保留
      Authorization/kb-token 既有凭据兼容。新增 5 个测试类并更新受影响测试/样例。
