# OpenTelemetry Java Agent 配置文件
# 位置：src/main/resources/opentelemetry-javaagent.properties

# 调试模式
otel.javaagent.debug=true
otel.log.level=DEBUG

# 导出器配置
otel.traces.exporter=zipkin
otel.metrics.exporter=none
otel.logs.exporter=none

# Zipkin 端点
otel.exporter.zipkin.endpoint=http://172.17.240.242:9411/api/v2/spans

# 服务名称
otel.service.name=gateway-sample

# 仪器配置
otel.instrumentation.common.default-enabled=true
otel.instrumentation.spring-webmvc.enabled=true
otel.instrumentation.spring-web.enabled=true
otel.instrumentation.servlet.enabled=true
otel.instrumentation.spring-core.enabled=true

# 传播器
otel.propagators=tracecontext,baggage

# 批量处理配置
otel.bsp.schedule.delay=1
otel.bsp.max.queue.size=1
otel.bsp.max.export.batch.size=1


# ============================================================================
# 启动命令
# ============================================================================
# java -javaagent:opentelemetry-javaagent.jar \
#      -Dotel.javaagent.configuration-file=opentelemetry-javaagent-zipkin.properties \
#      -jar your-app.jar

