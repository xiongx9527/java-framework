server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: fw-plus-ai-tinyflow-sample
  autoconfigure:
    exclude:
      - com.xiongx9527.fw.plus.ai.autoconfigure.magicapi.MagicAPIBaseAutoConfiguration
      - com.xiongx9527.fw.plus.ai.autoconfigure.askdata.autoconfigure.AskDataAutoConfiguration

fw:
  plus:
    ai:
      tinyflow:
        enabled: true

fw-plus:
  ai:
    langchain4j:
      enabled: true
      model:
        enabled: ${FW_PLUS_AI_MODEL_ENABLED:false}
        default-model: chat-default
        models:
          chat-default:
            provider: openai
            model-type: chat
            base-url: ${OPENAI_BASE_URL}
            api-key: ${OPENAI_API_KEY}
            model-name: ${OPENAI_MODEL}
            enabled: true
