server:
  port: 3089

spring:
  application:
      name: ai-sample
  main:
    # OpenAI 与 Azure OpenAI 的 langchain4j 自动配置 Bean 名冲突，统一通过应用侧覆盖/禁用
    allow-bean-definition-overriding: true
  autoconfigure:
    # ngbatis 传递引入 spring-boot-starter-data-jpa（HikariCP），样例没有 JDBC 用途，
    # 排除数据源自动配置，避免无 spring.datasource.url 时启动失败
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration


fw:
  plus:
    uid:
      enabled: false
    ws:
      enabled: false
    web:
      jackson:
        write_longs_as_strings:
          enabled: true
    # LangChain4j 会话记忆（消息历史）
    ai:
      langchain4j:
        chat-memory:
          # 存储后端：in-memory（默认，进程内）/ mem0（mem0 兼容 REST 服务，跨进程保留会话历史）。
          # 指向内网共享 mem0（192.168.1.100:8888，mem0 CE docker 部署）；mem0 不可达时应用仍可启动，仅对话调用时连接失败
          # 该实例开启鉴权：运行时以环境变量提供 key，如 export MEM0_ADMIN_API_KEY=<ADMIN_API_KEY>
          type: mem0
          mem0:
            base-url: http://192.168.1.100:8888 # API 路径无 /v1 前缀，直接拼 /memories 等；网关要求 /v1 时自行带前缀
            api-key: ${MEM0_ADMIN_API_KEY:}    # 该部署 ADMIN_API_KEY，经 X-API-Key 头认证；留空不发送
        assistant:
          session:
            # 跨会话事实记忆：每轮抽取事实入库，下一轮召回注入上下文（事实 → 摘要顺序）；
            # 与 chat-memory 各自独立配置，可指向同一或不同 mem0 实例
            facts:
              enabled: true
              base-url: http://192.168.1.100:8888 # 与 chat-memory 指向同一实例，也可分开指不同实例
              api-key: ${MEM0_ADMIN_API_KEY:}    # X-API-Key 认证（留空不发送）
              extractor: mem0                 # mem0 | llm | rule | hybrid
              write-mode: per-turn            # per-turn | batched | session-end
              retriever: semantic             # semantic | keyword | hybrid | rerank
              top-k: 5                        # 召回条数上限
              max-facts-tokens: 500           # 事实段 token 软上限（4 字符/token 折算）
    # 全能力助手 bean：脚本经 langchain4j.simpleAssistant() 获取；
    # 自建助手（langchain4j.assistant()）经 langchain4j.memoryStore() 复用同一份会话存储
    magicapi:
      langchain4j:
        simple-assistant:
          enabled: true
          key: gemma4 # 默认 key = langchain4j-chat-model 数据源 key（见 langchain4j-chat-model/gemma4.json）
          # 仅对话类模型回落默认 key；tokenizer/scoring 等未配置数据源，禁止回落
          #（否则 TokenWindowChatMemory 估算 token 时按 key 取 tokenizer 失败，对话直接报错）
          use-default-key: false
          use-default-keys:
            chatModel: true
            streamingModel: true
          memory-max-messages: 20 # 会话记忆窗口（条）

fw-plus:
  ai:
    langchain4j:
      model:
        enabled: true
        default-model: chat-default
        models:
          chat-default:
            provider: openai
            model-type: chat
            base-url: http://localhost:11434/v1
            api-key: demo
            model-name: gpt-4o-mini
            enabled: true
            properties: {}

magic-api:
  editor-config: classpath:./magic-editor-config.js
  web: /magic-api/web
  show-sql: true #配置打印SQL
  sql-column-case: camel
  persistence-response-body: false
  cluster:
    channel: magic-api:notify:channel
  resource:
    type: file  # 配置接口存储方式，file | database | git
    location1: ${java.io.tmpdir}/fw-plus-ai-magicapi-sample
    location: /Users/xiongxiao/Workspaces/Idea/codes/New/java-framework/fw-plus-sample/fw-plus-ai-samples/fw-plus-ai-magicapi-sample/src/main/resources
  prefix: /magic-api  # 前缀
  backup: #备份相关配置
    enable: false #是否启用
  page:
    page: current
    size: size
  cache:
    enable: true  #开启缓存，默认是不开启的
    ttl: 3600000 #有效期1小时，默认-1 即永不过期
  response-code:
    success: 200 #执行成功的code值
    invalid: 400 #参数验证未通过的code值
    exception: 500 #执行出现异常的code值
  crud: # CRUD相关配置
    logic-delete-column: is_del #逻辑删除列
    logic-delete-value: 1 #逻辑删除值
  plugin:
    elasticsearch:
      enabled: false
    s3:
      admin:
        enabled: true
    druid:
      aop-patterns:  /*
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: 123456


# 本地未启动 ES/Neo4j，关闭对应健康检查，避免 actuator 周期性打印 Connection refused 告警
management:
  health:
    elasticsearch:
      enabled: false
    neo4j:
      enabled: false

logging:
  level:
    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR
    io.debezium: ERROR
