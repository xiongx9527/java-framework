server:
  port: 0

spring:
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:h2:mem:tiny_engine_ai_sample;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

fw:
  plus:
    magicapi:
      enabled: false
    mp:
      enabled: false
    tiny-engine:
      enabled: true
      sql:
        database: h2
      security:
        enabled: false
      ai:
        enabled: true
        provider: langchain4j
        missing-dependency-policy: degrade
        chat:
          enabled: true
        rag:
          enabled: false
        web:
          enabled: true
