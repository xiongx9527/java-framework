server:
  port: 18083

sample:
  tiny-engine:
    auth:
      token-ttl-seconds: 86400
      admin:
        enabled: true
        username: admin
        password: REDACTED
        email: admin@example.com

spring:
  application:
    name: tiny-engine-ai-sample
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/tiny_engine?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: tiny_engine
    password: REDACTED

fw-plus:
  ai:
    model:
      enabled: true
      default-model: tinyengine-openai-chat
      models:
        tinyengine-openai-chat:
          key: tinyengine-openai-chat
          framework: langchain4j
          provider: openai
          type: CHAT
          properties:
            baseUrl: ${TINY_ENGINE_AI_BASE_URL:https://gpt.fufu666.top/v1}
            apiKey: ${TINY_ENGINE_AI_API_KEY:change-me}
            modelName: ${TINY_ENGINE_AI_MODEL_NAME:gpt-5.5}
            timeout: PT2M
        tinyengine-openai-streaming-chat:
          key: tinyengine-openai-streaming-chat
          framework: langchain4j
          provider: openai
          type: STREAMING_CHAT
          properties:
            baseUrl: ${TINY_ENGINE_AI_BASE_URL:https://gpt.fufu666.top/v1}
            apiKey: ${TINY_ENGINE_AI_API_KEY:change-me}
            modelName: ${TINY_ENGINE_AI_MODEL_NAME:gpt-5.5}
            timeout: PT2M

fw:
  plus:
    magicapi:
      enabled: false
    mp:
      enabled: false
    tiny-engine:
      enabled: true
      sql:
        database: mysql
        auto-initialize: true
      security:
        enabled: true
      ai:
        enabled: true
        provider: langchain4j
        missing-dependency-policy: degrade
        model:
          chat-key: tinyengine-openai-chat
          streaming-chat-key: tinyengine-openai-streaming-chat
        chat:
          enabled: true
        rag:
          enabled: false
        web:
          enabled: true
