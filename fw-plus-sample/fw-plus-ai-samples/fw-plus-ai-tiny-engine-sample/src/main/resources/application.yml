server:
  port: 18083

sample:
  tiny-engine:
    auth:
      token-ttl-seconds: 86400
      admin:
        enabled: true
        username: admin
        password: TinyEngine@123456
        email: admin@example.com

spring:
  application:
    name: tiny-engine-ai-sample
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/tiny_engine?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: tiny_engine
    password: TinyEngine@123456

fw-plus:
  ai:
    model:
      enabled: true
      default-model: tinyengine-openai-chat
      models:
        tinyengine-openai-chat:
          key: tinyengine-openai-chat
          framework: langchain4j
          provider: openai
          type: CHAT
          properties:
            baseUrl: https://gpt.xinshu.ai/v1
            apiKey: sk-59183f8d816cd9c8b9d2da993a41816efb5627a1f5964c6ad154ab8d465783d6
            modelName: gpt-5.5
            timeout: PT2M
        tinyengine-openai-streaming-chat:
          key: tinyengine-openai-streaming-chat
          framework: langchain4j
          provider: openai
          type: STREAMING_CHAT
          properties:
            baseUrl: https://gpt.xinshu.ai/v1
            apiKey: sk-59183f8d816cd9c8b9d2da993a41816efb5627a1f5964c6ad154ab8d465783d6
            modelName: gpt-5.5
            timeout: PT2M

fw:
  plus:
    magicapi:
      enabled: false
    mp:
      enabled: false
    tiny-engine:
      enabled: true
      sql:
        database: mysql
        auto-initialize: false
      security:
        enabled: true
      ai:
        enabled: true
        provider: langchain4j
        missing-dependency-policy: degrade
        model:
          chat-key: tinyengine-openai-chat
          streaming-chat-key: tinyengine-openai-streaming-chat
        chat:
          enabled: true
        rag:
          enabled: false
        web:
          enabled: true
