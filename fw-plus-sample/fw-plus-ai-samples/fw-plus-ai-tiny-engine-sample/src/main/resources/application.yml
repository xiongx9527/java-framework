server:
  port: 18083

sample:
  tiny-engine:
    auth:
      token-ttl-seconds: 86400
      admin:
        enabled: true
        username: admin
        password: TinyEngine@123456
        email: admin@example.com

spring:
  application:
    name: tiny-engine-ai-sample
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/tiny_engine?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: tiny_engine
    password: TinyEngine@123456

fw:
  plus:
    mp-encrypt:
      private-key: ${TINY_ENGINE_FIELD_ENCRYPT_KEY:}
      public-key: ${TINY_ENGINE_FIELD_ENCRYPT_KEY:}
      iv: ${TINY_ENGINE_FIELD_ENCRYPT_IV:}
      salt: ${TINY_ENGINE_FIELD_ENCRYPT_SALT:}
    magicapi:
      enabled: false
    mp:
      enabled: false
    tiny-engine:
      enabled: true
      sql:
        database: mysql
        auto-initialize: false
      security:
        enabled: true
      ai:
        enabled: true
        provider: langchain4j
        missing-dependency-policy: degrade
        chat:
          enabled: true
        rag:
          enabled: false
        web:
          enabled: true
