fw:
    plus:
        mybatis-datachange:
            enabled: true
            tables:
                - name: test_order
                  key-columns: [id]
                  include-columns: [status]
        mp-encrypt:
            private-key: jrob4yfhdf9ihek5
            public-key: jrob4yfhdf9ihek5
management:
    endpoints:
        health:
            show-details: always
        web:
            base-path: /actuator
            exposure:
                include: '*'
mybatis:
    mapper-locations: classpath:com/9527/fw/plus/boot/mp/sample/mappers/xml/*xml
    type-aliases-package: com.xiongx9527.fw.plus.boot.mp.sample.mapper
mybatis-plus:
    configuration:
        log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
        map-underscore-to-camel-case: true
server:
    port: 8082
spring:
  datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      password: xxxxxxx

  mvc:
        pathmatch:
            matching-strategy: ant_path_matcher


  com:
    atomikos:
      icatch:
        hide_init_file_path: true
