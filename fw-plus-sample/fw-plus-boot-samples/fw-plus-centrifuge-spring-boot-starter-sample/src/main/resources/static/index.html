<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Centrifuge Sample</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        .card { max-width: 520px; }
        .field { margin-bottom: 12px; }
        label { display: inline-block; width: 90px; }
        input { width: 260px; }
        .hint { color: #666; font-size: 12px; }
        .result { margin-top: 12px; padding: 8px; border: 1px dashed #ccc; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Centrifuge Sample</h1>
        <p>通过 Java 服务向 Centrifugo 发送消息，并在控制台查看监听器输出。</p>

        <div class="field">
            <label>实例名</label>
            <input id="instanceName" value="node-1">
        </div>
        <div class="field">
            <label>channel</label>
            <input id="channel" value="chat">
        </div>
        <div class="field">
            <label>message</label>
            <input id="message" value="hello from browser">
        </div>
        <button onclick="sendMessage()">发送消息</button>

        <div id="result" class="result" style="display:none;"></div>

        <p class="hint">发送成功后，请查看 Java 控制台输出，确认 DemoCentrifugoListener 收到消息。</p>
    </div>

    <script>
        async function sendMessage() {
            const instanceName = document.getElementById('instanceName').value.trim();
            const channel = document.getElementById('channel').value.trim();
            const message = document.getElementById('message').value.trim();
            const resultBox = document.getElementById('result');

            if (!instanceName || !channel || !message) {
                resultBox.style.display = 'block';
                resultBox.textContent = '请填写完整参数';
                return;
            }

            const url = `/sample/centrifuge/send-instance?instanceName=${encodeURIComponent(instanceName)}&channel=${encodeURIComponent(channel)}&message=${encodeURIComponent(message)}`;
            resultBox.style.display = 'block';
            resultBox.textContent = '发送中...';

            try {
                const response = await fetch(url, { method: 'POST' });
                const text = await response.text();
                resultBox.textContent = '结果: ' + text;
            } catch (error) {
                resultBox.textContent = '发送失败: ' + error.message;
            }
        }
    </script>
</body>
</html>
