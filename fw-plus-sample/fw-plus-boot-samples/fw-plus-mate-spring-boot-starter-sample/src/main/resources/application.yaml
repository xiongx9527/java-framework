server:
  port: 8080

spring:
  application:
    name: fw-plus-mate
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    serialization:
      write_dates_as_timestamps: true

eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/
      fetch-registery: true
      register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
  cloud:
    inetutils:
      preferred-networks[0]: xxx.17



fw:
  plus:
    mate:
      sensitive:
        enabled: true
      easy-trans:
        enabled: true
      validator:
        enabled: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
    health:
      show-details: always


