  cloud:
    config:
      server:
        prefix: config
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  profiles:
    active: test
  redis:
    # 默认数据源
    host: xxxxxxx
    port: 6379
    password: xxxxxxx
    database: 3
    # 集群环境打开下面注释，单机不需要打开(单机只需要用上面的配置即可)
    #cluster:
    #nodes: xxx.xxx.xxx.xxx:xxxx,xxx.xxx.xxx.xxx:xxxx,xxx.xxx.xxx.xxx:xxxx
