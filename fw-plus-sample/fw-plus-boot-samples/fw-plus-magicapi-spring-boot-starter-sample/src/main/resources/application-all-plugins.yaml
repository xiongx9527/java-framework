server:
  port: 0

apollo:
  bootstrap:
    enabled: false

fw:
  plus:
    config:
      event:
        apollo-enabled: false
    # 全插件样例不接数据源：mybatisplus 插件仅把 mybatis-plus-boot-starter 带上 classpath，
    # 关闭 mp 自动配置以避免其 DataSource 单例条件在离线样例中触发装配失败
    mp:
      enabled: false

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration
      # 离线样例不接外部 Redis：排除后 StringRedisTemplate 缺席，
      # ws/mcp 等依赖它的集群广播配置按条件自然退化为单机
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  cloud:
    config:
      enabled: false

management:
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health

magic-api:
  resource:
    type: file
    location: ${java.io.tmpdir}/fw-plus-magicapi-all-plugins
