server:
  port: 0

apollo:
  bootstrap:
    enabled: false

fw:
  plus:
    config:
      event:
        apollo-enabled: false

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration
      # 默认 profile 的 redis 是占位地址，会拦住 mcpRedisMessageListenerContainer 启动；
      # 该 profile 用于"无外部资源"地验证全部插件装配，故排除 redis 自动配置。
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      # config-server 需要 git uri；样例只验证插件装配，不需要真起一个配置中心。
      # spring.cloud.config.enabled=false 关不掉 actuator 的 configServerHealthIndicator，
      # 它仍会创建 EnvironmentRepository，因此排除自动配置类。
      - org.springframework.cloud.config.server.config.ConfigServerAutoConfiguration
      - org.springframework.cloud.config.server.config.ConfigServerHealthIndicatorAutoConfiguration
  cloud:
    config:
      enabled: false

management:
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health

magic-api:
  resource:
    type: file
    location: ${java.io.tmpdir}/fw-plus-magicapi-all-plugins
  plugin:
    mqtt:
      enabled: true
