server:
  port: 8080

fw:
  plus:
    ws:
      enabled: true
      appId: default
      servers:
        # 一个实例 = 一个 key + 一组端点 + 一个 appId，与默认实例并存且为纯增量
        - key: report
          path: /ws/api3
          appId: report
      websocket:
        path: /ws/api
        paths:
          - /ws/api2
        # 演示用：允许任意来源；生产请改为具体域名
        trustedDomain: '*'
      binary:
        enabled: true
        type: binary
      broadcast:
        # 默认同步；置 true 时本地广播提交到有界线程池
        async: false

logging:
  level:
    com.xiongx9527.fw.plus.boot.autoconfigure.web.ws: info
