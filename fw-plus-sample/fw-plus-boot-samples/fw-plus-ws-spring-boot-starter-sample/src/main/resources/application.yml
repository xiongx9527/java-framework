server:
  port: 8080

fw:
  plus:
    ws:
      enabled: true
      appId: default
      token:
        # 至少 32 位；缺失时 WebSocket 握手鉴权直接失败
        secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        expireHours: 2
      websocket:
        path: /ws/api
        paths:
          - /ws/api2
        # 演示用：允许任意来源；生产请改为具体域名
        trustedDomain: '*'
      tokens:
        # 一个实例一条路径 + 一套 token：/ws/api2 改用专用密钥，/ws/api 仍用全局密钥
        - path: /ws/api2
          secret: aaaabbbbccccddddeeeeffff00001111aaaabbbbccccddddeeeeffff00001111
          expireHours: 4
      binary:
        enabled: true
        type: binary
      broadcast:
        # 默认同步；置 true 时本地广播提交到有界线程池
        async: false

logging:
  level:
    com.xiongx9527.fw.plus.boot.autoconfigure.web.ws: info
