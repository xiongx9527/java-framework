# ============================================================================
# fw-plus-lock 国际化资源 - 中文（默认）
# key 约定：具名 dotted key，形如 fw.plus.lock.<场景>
# 占位符使用 {0}、{1}（java.text.MessageFormat 语法）
# ============================================================================

# ── 单 worker 守卫锁自动配置 ────────────────────────────────────────────────
# db 后端缺少必需依赖
fw.plus.lock.db.requireJdbcTemplate=单 worker 守卫锁后端 db 需要 spring-jdbc 的 JdbcTemplate，请确认已配置数据源与 spring-jdbc 依赖
# redis 后端缺少必需依赖
fw.plus.lock.redis.requireStringRedisTemplate=单 worker 守卫锁后端 redis 需要 spring-data-redis 的 StringRedisTemplate，请确认已引入 spring-data-redis 依赖
