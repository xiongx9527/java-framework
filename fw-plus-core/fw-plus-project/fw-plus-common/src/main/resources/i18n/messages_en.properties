# ============================================================================
# fw-plus i18n resources - English
# ----------------------------------------------------------------------------
# key = 8-digit unified status code (source 2 + category 3 + specific 3)
# placeholders use {0}, {1} (java.text.MessageFormat syntax)
# ============================================================================

# ── common / unknown ────────────────────────────────────────────────────────
50999000=Internal system error
40999000=Bad request

# ── request / parameter (40 001 xxx) ────────────────────────────────────────
40001001=Missing parameter: {0}
40001002=Parameter must not be empty: {0}
40001003=Invalid parameter format: {0}
40001004=Duplicate submission, please do not repeat the operation

# ── validation (40 001 1xx) ─────────────────────────────────────────────────
40001101=Request body must not be empty
40001102=Request parameter validation failed

# ── authorization / data scope (50 003 xxx) ─────────────────────────────────
50003001=Row permission configuration is corrupted: {0}
50003002=Row permission filtering failed: {0}

# ── business (40 005 xxx) ───────────────────────────────────────────────────
40005001=Business processing failed
40005002=Tool [{0}] execution failed: {1}
40005003=Tool [{0}] is missing required parameter: {1}

# ── file / storage (50 007 xxx) ─────────────────────────────────────────────
50007001=File storage operation failed

# ── third party (50 008 xxx) ────────────────────────────────────────────────
50008001=Dify service returned an error: {0}
50008002=Dify client call failed: {0}
50008003=Knowledge base operation failed: {0}

# ── database (50 009 xxx) ───────────────────────────────────────────────────
50009001=Database routine failed: {0}
50009002=Nebula SQL parse failed: {0}
50009003=Nebula query conversion failed: {0}
50009004=Nebula write conversion failed: {0}
50009005=Binlog stream processing failed: {0}
50009006=Data replication failed: {0}
50009007=Neo4j operation failed: {0}
50009008=Nebula operation failed: {0}
50009009=Database transaction failed: {0}

# ── distributed UID (50 010 xxx) ────────────────────────────────────────────
50010001=Internal system error
50010002=UID generation failed: {0}

# ── config (50 016 xxx) ─────────────────────────────────────────────────────
50016001=Invalid Redis URL: {0}

# ── stream / CDC (50 019 xxx) ───────────────────────────────────────────────
50019001=Data change tracking failed: {0}

# ── serialization / conversion (50 024 xxx) ─────────────────────────────────
50024001=Structured output parsing failed: {0}

# ── script / expression (50 029 xxx) ────────────────────────────────────────
50029001=Java entity compilation failed: {0}

# ── named keys (non-status-code cases, e.g. JDK exceptions) ──────────────────
fw.common.web.readRequestBodyFailed=Failed to read request body
