# ============================================================================
# fw-plus 国际化资源 - 中文（默认）
# ----------------------------------------------------------------------------
# key = 8 位统一状态码（source 2 位 + category 3 位 + specific 3 位）
# 占位符使用 {0}、{1}（java.text.MessageFormat 语法）
#
# 段分配：
#   40 = 客户端错误    50 = 服务端错误
#   category 见 com.xiongx9527.fw.plus.common.enums.ErrorCategory
#   specific 001-099 为框架内置异常，100+ 供业务使用
# ============================================================================

# ── 通用 / 未知 ──────────────────────────────────────────────────────────────
50999000=系统内部错误
40999000=请求错误

# ── 请求 / 参数（40 001 xxx）────────────────────────────────────────────────
40001001=参数缺失：{0}
40001002=参数不能为空：{0}
40001003=参数格式不正确：{0}
40001004=重复提交，请勿重复操作

# ── 校验（40 001 1xx）──────────────────────────────────────────────────────
40001101=请求体不能为空
40001102=请求参数校验失败

# ── 授权 / 数据权限（50 003 xxx）────────────────────────────────────────────
50003001=行权限配置损坏：{0}
50003002=行权限过滤处理失败：{0}

# ── 业务（40 005 xxx）──────────────────────────────────────────────────────
40005001=业务处理失败
40005002=工具 [{0}] 执行失败：{1}
40005003=工具 [{0}] 缺少必填参数：{1}

# ── 文件 / 存储（50 007 xxx）───────────────────────────────────────────────
50007001=文件存储操作失败

# ── 第三方服务（50 008 xxx）───────────────────────────────────────────────
50008001=Dify 服务返回错误：{0}
50008002=Dify 客户端调用失败：{0}
50008003=知识库操作失败：{0}

# ── 数据库（50 009 xxx）────────────────────────────────────────────────────
50009001=数据库例行操作失败：{0}
50009002=Nebula SQL 解析失败：{0}
50009003=Nebula 查询转换失败：{0}
50009004=Nebula 写入转换失败：{0}
50009005=Binlog 流处理失败：{0}
50009006=数据复制失败：{0}
50009007=Neo4j 操作失败：{0}
50009008=Nebula 操作失败：{0}
50009009=数据库事务执行失败：{0}

# ── 分布式 UID（50 010 xxx）────────────────────────────────────────────────
50010001=系统内部错误
50010002=UID 生成失败：{0}

# ── 配置（50 016 xxx）──────────────────────────────────────────────────────
50016001=Redis 连接地址非法：{0}

# ── 流 / CDC（50 019 xxx）──────────────────────────────────────────────────
50019001=数据变更追踪失败：{0}

# ── 序列化 / 转换（50 024 xxx）─────────────────────────────────────────────
50024001=结构化输出解析失败：{0}

# ── 脚本 / 表达式（50 029 xxx）─────────────────────────────────────────────
50029001=Java 实体编译失败：{0}

# ── 具名 key（非状态码场景，供 JDK 异常等使用）─────────────────────────────
fw.common.web.readRequestBodyFailed=读取请求体失败
