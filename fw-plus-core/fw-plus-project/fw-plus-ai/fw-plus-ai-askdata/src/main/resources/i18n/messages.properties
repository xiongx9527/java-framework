# fw-plus-ai-askdata 国际化资源（中文默认）
# 异常：8 位统一状态码；诊断：askdata.* key；占位符 {0}/{1} 由 MessageFormat 填充

# === 异常状态码 ===
50005801=SQL 生成失败：{0}
50005806=SQL 校验未通过且修复失败：{0}
50005802=SQL 执行失败：{0}
50005807=只读模式下禁止执行写入型语句：{0}
50005803=图表生成失败：{0}
50005804=输入缺失：{0}
50005805=输入过长：问题长度 {0}，超过上限 {1}
50006801=LLM 服务暂不可用：{0}

# === 输入契约（编程错误，仍走资源避免硬编码） ===
askdata.input.question_required=question 不可为空
askdata.input.schema_required=schemaContext 不可为空（SQL 生成依赖可见 schema，不依赖隐式全局状态）
askdata.input.chart_data_required=data 不可为空（图表生成依赖已执行的数据集）
askdata.contract.llm_required=llm 不可为 null
askdata.contract.executor_required=executor 不可为 null
askdata.contract.datasource_required=dataSource 不可为 null
askdata.contract.delegate_required=delegate 不可为 null
askdata.contract.input_null=input 不可为 null
askdata.contract.build_llm=构建 SqlGenerationCapability 需要提供 llm
askdata.contract.build_executor=构建 SqlExecutionCapability 需要提供 executor

# === 提取 / 生成 ===
askdata.extract.empty_output=模型输出为空
askdata.extract.no_sql=模型输出中未找到 SQL
askdata.gen.llm_failed=LLM 调用失败

# === 执行 ===
askdata.exec.sql_required=sql 不可为空
askdata.exec.sql_empty=sql 为空
askdata.exec.failed=SQL 执行失败

# === LLM 韧性 ===
askdata.llm.breaker_open=LLM 熔断器已打开，请求被拒绝（冷却中）
askdata.llm.retry_interrupted=LLM 重试被中断
askdata.llm.retry_exhausted=LLM 调用重试后仍失败：{0}
askdata.llm.flagged_invalid=模型判定 SQL 无效
askdata.llm.invalid=模型判定 SQL 无效：{0}

# === 校验 / VERIFY / 方言 诊断 ===
askdata.validate.empty_sql=SQL 为空
askdata.validate.write_dml=包含写入型 DML：{0}
askdata.validate.table_not_in_schema=引用了可见 schema 之外的表：{0}
askdata.validate.unbalanced_paren=括号不平衡：左 {0} 个 vs 右 {1} 个
askdata.verify.empty_result=查询结果为空，未返回任何行
askdata.verify.truncated=结果被截断，可能不完整（已达到最大返回行数）
askdata.verify.dup_key=检测到主键重复，列下标 {0}
askdata.verify.dup_key_out_of_range=重复键列下标越界：{0}
askdata.dialect.backtick=方言 {0} 使用双引号标识符，却发现反引号标识符
askdata.dialect.limit=方言 {0} 不支持 LIMIT，请使用 OFFSET/FETCH 或 ROWNUM
askdata.dialect.top=方言 {0} 不支持 TOP，请使用 LIMIT/OFFSET 或 FETCH
