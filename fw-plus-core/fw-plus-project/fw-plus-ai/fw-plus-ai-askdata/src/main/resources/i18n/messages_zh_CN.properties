# fw-plus-ai-askdata 国际化资源（中文默认）
# 异常：8 位统一状态码；诊断：askdata.* key；占位符 {0}/{1} 由 MessageFormat 填充

# === 异常状态码 ===
50005801=SQL 生成失败：{0}
50005806=SQL 校验未通过且修复失败：{0}
50005802=SQL 执行失败：{0}
50005807=只读模式下禁止执行写入型语句：{0}
50005803=图表生成失败：{0}
50005804=输入缺失：{0}
50005805=输入过长：问题长度 {0}，超过上限 {1}
50006801=LLM 服务暂不可用：{0}

# === 输入契约（编程错误，仍走资源避免硬编码） ===
askdata.input.question_required=question 不可为空
askdata.input.schema_required=schemaContext 不可为空（SQL 生成依赖可见 schema，不依赖隐式全局状态）
askdata.input.chart_data_required=data 不可为空（图表生成依赖已执行的数据集）
askdata.contract.llm_required=llm 不可为 null
askdata.contract.executor_required=executor 不可为 null
askdata.contract.datasource_required=dataSource 不可为 null
askdata.contract.delegate_required=delegate 不可为 null
askdata.contract.input_null=input 不可为 null
askdata.contract.build_llm=构建 SqlGenerationCapability 需要提供 llm
askdata.contract.build_executor=构建 SqlExecutionCapability 需要提供 executor

# === 提取 / 生成 ===
askdata.extract.empty_output=模型输出为空
askdata.extract.no_sql=模型输出中未找到 SQL
askdata.gen.llm_failed=LLM 调用失败

# === 执行 ===
askdata.exec.sql_required=sql 不可为空
askdata.exec.sql_empty=sql 为空
askdata.exec.failed=SQL 执行失败

# === LLM 韧性 ===
askdata.llm.breaker_open=LLM 熔断器已打开，请求被拒绝（冷却中）
askdata.llm.retry_interrupted=LLM 重试被中断
askdata.llm.retry_exhausted=LLM 调用重试后仍失败：{0}
askdata.llm.flagged_invalid=模型判定 SQL 无效
askdata.llm.invalid=模型判定 SQL 无效：{0}

# === 校验 / VERIFY / 方言 诊断 ===
askdata.validate.empty_sql=SQL 为空
askdata.validate.write_dml=包含写入型 DML：{0}
askdata.validate.table_not_in_schema=引用了可见 schema 之外的表：{0}
askdata.validate.unbalanced_paren=括号不平衡：左 {0} 个 vs 右 {1} 个
askdata.verify.empty_result=查询结果为空，未返回任何行
askdata.verify.truncated=结果被截断，可能不完整（已达到最大返回行数）
askdata.verify.dup_key=检测到主键重复，列下标 {0}
askdata.verify.dup_key_out_of_range=重复键列下标越界：{0}
askdata.dialect.backtick=方言 {0} 使用双引号标识符，却发现反引号标识符
askdata.dialect.limit=方言 {0} 不支持 LIMIT，请使用 OFFSET/FETCH 或 ROWNUM
askdata.dialect.top=方言 {0} 不支持 TOP，请使用 LIMIT/OFFSET 或 FETCH
# === 提示词（发给 LLM，仍走资源避免硬编码） ===
askdata.prompt.sql.system=你是一个专业的数据库 SQL 生成助手。任务：根据给定的表结构与自然语言问题，生成一条只读的、可执行的 SQL 查询。\n规范：\n1. 只输出一条 SQL，不要编辑器包裹以外的额外文字（除非必要的简短说明）。\n2. 使用给定方言的引号与分页语法。\n3. 只查询可见表，不使用 DDL/DML（CREATE/ALTER/DROP/INSERT/UPDATE/DELETE/TRUNCATE 等）。\n4. 必须用反引号包裹 SQL，格式为：\n```sql\n<SQL>\n```\n如果信息不足无法生成，在反引号前用一句话说明原因。
askdata.prompt.sql.user=方言提示：{dialect}\n可见表结构：\n{schema}\n{constraintsBlock}{priorBlock}{refBlock}问题：{question}\n请生成满足该问题的 SQL。
askdata.prompt.sql.validation_system=你是一个严谨的 SQL 评审助手。任务：判断给定 SQL 是否语义正确、能否回答用户问题。只依据可见表结构与问题本身评判，不臆造表字段，不把权限/可见范围之外的内容当作错误。
askdata.prompt.validation.user=问题：{question}\n可见表结构：\n{schema}\n待校验 SQL：\n{sql}\n请判断该 SQL 是否语义正确、能否回答上述问题。仅回答 YES 或 NO，若 NO 请另起一行给出简短原因。
askdata.prompt.sql.repair_prefix=上次生成的 SQL 校验失败：
askdata.prompt.sql.repair_suffix=。请修正后仅重新输出 SQL。
askdata.prompt.sql.constraints_header=额外约束：
askdata.prompt.sql.prior_header=上轮 SQL 候选：
askdata.prompt.sql.ref_header=指代消解：
askdata.prompt.sql.dialect_unknown=未指定（请使用通用 SQL-92）
askdata.prompt.chart.system=你是一个数据可视化助手。任务：根据数据概要与自然语言问题，选择最合适的图表类型，并给出分类轴字段与数值轴字段。\n只允许从 bar / line / area / pie / scatter / table 中选择。\n严格只输出一个 JSON 对象，格式：\n{"chartType":"<类型>","categoryField":"<分类轴字段名或空>","valueFields":["<数值字段名>"]}
askdata.prompt.chart.user=问题：{question}\n数据概要：\n{schema}\n样本数据（最多 {sampleLimit} 行）：\n{sample}\n请给出图表配置 JSON。
askdata.dialect.pagination.mysql=MySQL 风格分页用 LIMIT n OFFSET m。
askdata.dialect.pagination.postgresql=PostgreSQL 风格分页用 LIMIT n OFFSET m。
askdata.dialect.pagination.sqlserver=SQL Server 分页用 OFFSET m ROWS FETCH NEXT n ROWS ONLY。
askdata.dialect.pagination.oracle=Oracle 风格分页用 OFFSET m ROWS FETCH NEXT n ROWS ONLY 或 ROWNUM 嵌套。
askdata.dialect.pagination.default=如需分页请使用该方言标准的 LIMIT/OFFSET 语法。
# === 运维日志（元数据日志，不记提示词/模型原文/业务数据） ===
askdata.log.llm.retry_failed=LLM 调用第 {} 次失败，{}ms 后重试: {}
askdata.log.llm.breaker_half_open=LLM 熔断器进入 HALF_OPEN 探活
askdata.log.llm.probe_success=LLM 探活成功，熔断器关闭
askdata.log.llm.probe_failed=LLM 探活失败，熔断器重新打开: {}
askdata.log.llm.breaker_open=LLM 连续失败 {} 次，熔断器打开
