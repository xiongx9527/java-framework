# JDBC engine i18n messages (sunk from fw-plus-ai-askdata, namespace askdata.* preserved)
askdata.contract.datasource_required=dataSource must not be null
askdata.exec.sql_required=sql must not be empty
askdata.exec.sql_empty=sql is empty
askdata.exec.failed=SQL execution failed
askdata.verify.empty_result=query result is empty, no rows returned
askdata.verify.truncated=result is truncated, possibly incomplete (max rows reached)
askdata.verify.dup_key=duplicate primary key detected, column index {0}
askdata.verify.dup_key_out_of_range=duplicate key column index out of range: {0}
askdata.dialect.backtick=dialect {0} uses double-quote identifiers, but backtick-quoted identifier found
askdata.dialect.limit=dialect {0} does not support LIMIT; use OFFSET/FETCH or ROWNUM
askdata.dialect.top=dialect {0} does not support TOP; use LIMIT/OFFSET or FETCH
askdata.dialect.pagination.mysql=For MySQL-style pagination use LIMIT n OFFSET m.
askdata.dialect.pagination.postgresql=For PostgreSQL-style pagination use LIMIT n OFFSET m.
askdata.dialect.pagination.sqlserver=For SQL Server pagination use OFFSET m ROWS FETCH NEXT n ROWS ONLY.
askdata.dialect.pagination.oracle=For Oracle-style pagination use OFFSET m ROWS FETCH NEXT n ROWS ONLY or a ROWNUM subquery.
askdata.dialect.pagination.default=If pagination is needed, use the dialect's standard LIMIT/OFFSET syntax.
